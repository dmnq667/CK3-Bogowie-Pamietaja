l_polish:
 bp_040_revenge.t:0 "Cena krwi powraca"
 bp_040_revenge.desc:0 "Kilka miesięcy po twoich rozkazach ludzie, których skrzywdziłeś, uzbroili krewnych i stronników. Zamierzają napaść na twoją eskortę. Możesz wykupić ugodę, zlekceważyć ostrzeżenie albo stanąć na ich drodze osobiście. Odwet ma swoją przyczynę i nie zniknie od samej groźby."
 bp_040_revenge.desc_target:0 "Krewni ludzi zabitych wcześniej z twojego rozkazu urządzają zasadzkę na drogę do dworu. Znasz źródło ich nienawiści. Możesz zapłacić za pokój, ryzykować śmierć swojej eskorty lub własnym życiem zakończyć napaść."
 bp_040_revenge.a:0 "Zapłacę za pokój i ochronę (150 złota; koniec tej napaści)."
 bp_040_revenge.b:0 "Zlekceważę ostrzeżenie. (65% ryzyka śmierci strażników; straty prowincji i dalszy odwet)"
 bp_040_revenge.c:0 "Sam stanę przeciw mścicielom (30% ryzyka śmierci władcy)."
 bp_040_revenge.d:0 "Każę spacyfikować okolicę. (Spustoszenie ziemi, wzrost stresu i utrata prestiżu)"
 bp_040_aftermath.t:0 "Krew rodzi następną krew"
 bp_040_aftermath.desc:0 "Od morderstwa, do którego doprowadziła dawna zemsta, upłynął niemal rok. Krewni ofiary wciąż nie pogodzili się ze stratą. Możesz wynagrodzić ich cierpienie, odpowiedzieć przemocą albo ponownie osobiście narazić życie, aby zakończyć waśń."
 bp_040_aftermath.a:0 "Wypłacę odszkodowanie (180 złota; pojednanie i ulga w stresie)."
 bp_040_aftermath.b:0 "Odpowiem represjami (+130 złota; większy postrach i wieloletni odwet)."
 bp_040_aftermath.c:0 "Sam stanę do ostatniej próby (25% ryzyka śmierci władcy)."
 bp_040_gromnica.t:0 "Gromnica — dwie osady pod śniegiem"
 bp_040_gromnica.desc:0 "W noc Gromnicy śnieżyca odcięła dwie osady od grodu. Zabrakło opału, a drogi są nieprzejezdne. Dowódca straży oznajmia, że może wyruszyć tylko jeden konwój. Musisz zdecydować, kto otrzyma pomoc i kto zapłaci za twoją decyzję."
 bp_040_gromnica.desc_compassionate:0 "W noc Gromnicy zamarzają ludzie w dwóch osadach. Wiesz, ile rodzin znalazło się w niebezpieczeństwie. Straż czeka na rozkaz: pomóc mieszkańcom kosztem skarbca czy pozostawić ich własnemu losowi. Ci, których nie ocalisz, będą pamiętani przez swoich bliskich."
 bp_040_gromnica.desc_callous:0 "Śnieżyca odcięła od grodu dwie osady. Twój zarządca widzi w katastrofie sposobność do zatrzymania zapasów i zwiększenia danin. Mieszkańcy proszą o ratunek, lecz decyzja należy wyłącznie do ciebie."
 bp_040_gromnica.a:0 "Wyślę pomoc osadom (80 złota; rozwój, łaska Mokoszy)."
 bp_040_gromnica.b:0 "Zatrzymam zapasy. Osady poniosą straty (+75 złota; niepokoje, późniejsza zemsta)."
 bp_040_gromnica.c:0 "Wzmocnię straże grodu (prestiż i wojskowa przewaga; większy stres)."
 bp_040_weles.t:0 "Siedem Nocy Welesa — cena spokoju"
 bp_040_weles.desc:0 "W czasie zimowego obrzędu żerca przekazuje ci propozycję Welesa. Bóg uwolni cię od ciężaru trosk i napełni skarbiec, lecz po kilku miesiącach osobiście upomni się o dług. Alternatywą jest wskazanie prawdziwego więźnia na ofiarę albo odmowa układu."
 bp_040_weles.desc_brave:0 "Jesteś znany z odwagi, lecz nawet ty nie możesz pokonać bezsenności ani ciężaru dawnych decyzji mieczem. Weles oferuje ukojenie i bogactwo, żądając późniejszej zapłaty. Nie ukrywa, że złamanie przysięgi może kosztować cię życie."
 bp_040_weles.desc_craven:0 "Nocą odczuwasz coraz większy lęk. Żerca przekazuje ofertę Welesa: potężna ulga od stresu i złoto teraz, lecz nieuniknione żądanie zapłaty za kilka miesięcy. Jeśli nie dotrzymasz słowa, sam bóg może cię zabić."
 bp_040_weles.a:0 "Przyjmę pakt (-100 stresu, +250 złota; późniejszy sąd Welesa)."
 bp_040_weles.b:0 "Wskażę rzeczywistego dorosłego więźnia na krwawą ofiarę."
 bp_040_weles.c:0 "Odrzucę układ. Wolę wolność od boskiego długu."
 bp_040_spring.t:0 "Wiosenny Nowy Rok — ziarno dla żywych"
 bp_040_spring.desc:0 "Po zimie w spichlerzach zostało niewiele ziarna. Wojowie żądają żywności, aby mogli ruszyć w pole, a mieszkańcy proszą o zasiew. Nie starczy dla wszystkich. Ocalenie przyszłych plonów oznacza osłabienie wojska; zbrojny pobór może sprowadzić głód."
 bp_040_spring.desc_compassionate:0 "Znasz rodziny, które utraciły zimą zapasy. Wiosną ich dzieci czekają na pierwszy siew, lecz twoi wojowie domagają się reszty ziarna. Musisz wybrać między bezpieczeństwem państwa a życiem poddanych. Mokosz zapamięta twój czyn."
 bp_040_spring.desc_callous:0 "Twoi wojowie domagają się zboża. Ziarno przeznaczone na siew można przejąć jednym rozkazem, a miejscowi nie zdołają się temu oprzeć. Dochód i siła militarna wzrosną szybko; koszty głodu spadną na prowincję."
 bp_040_spring.a:0 "Ocalę zasiew (75 złota; silny rozwój ziemi)."
 bp_040_spring.b:0 "Zabiorę ziarno dla wojska (+120 złota, siła; nieurodzaj i późniejszy sąd Mokoszy)."
 bp_040_spring.c:0 "Podzielę zapasy (mniejszy dar ziemi; utrata prestiżu)."
 bp_040_jare.t:0 "Jare Gody — krew przed świętym ogniem"
 bp_040_jare.desc:0 "Podczas Jarych Godów żerca wzywa do porzucenia dawnych waśni. Przy świętym ogniu spotykają się jednak dwa rody, od lat skłócone o ziemię i przeprawę. Gdy ich zbrojni dobywają mieczy, jeden z uczestników święta pada ciężko ranny. Starszyzna żąda twego wyroku, nim zginą następni. Możesz zapłacić za ugodę, rozkazać drużynie zdławić napastników albo pozostawić spór nierozstrzygnięty."
 bp_040_jare.desc_target:0 "Podczas Jarych Godów dochodzi do starcia zbrojnych dwóch zwaśnionych rodów. Żaden z twoich dworzan nie został wskazany jako sprawca bez dowodów. Starszyzna żąda rozstrzygnięcia sporu."
 bp_040_jare.desc_brave:0 "Przysięga pokoju złożona podczas Jarych Godów zostaje złamana, gdy dwaj zbrojni sięgają po miecze. Jeden z uczestników święta pada ranny. Jesteś znany z odwagi, więc starszyzna wzywa cię przed obrzędowy ogień. Możesz przywrócić zgodę okupem lub rozkazać krwawą rozprawę. Jeśli odstąpisz od wyroku, rody powrócą do dawnej waśni."
 bp_040_jare.desc_craven:0 "Gdy żerca rozpoczyna obrzęd, uzbrojeni ludzie dwóch rodów wszczynają bójkę. Na ziemię pada ranny uczestnik święta. Pragniesz uniknąć niebezpieczeństwa, lecz wszyscy patrzą na ciebie: to twój wyrok może zakończyć spór. Ugoda wymaga złota, przemoc sprowadzi zemstę, a bezczynność pozostawi obu rodom wolną rękę."
 bp_040_jare.a:0 "Zapłacę 90 złota i wymuszę ugodę. (Mniej stresu; łaska Mokoszy)"
 bp_040_jare.b:0 "Rozkażę drużynie rozprawić się ze zbrojnymi. (Łupy; postrach; tyrania i zemsta)"
 bp_040_jare.c:0 "Nie wydam wyroku. (Mniej stresu; utrata prestiżu i wieloletnia waśń)"
 bp_040_gaik.t:0 "Gaik — pożar świętego gaju"
 bp_040_gaik.desc:0 "Zarządca zamierza wyciąć święty gaj, by zdobyć drewno na umocnienia. Mieszkańcy stają mu na drodze. Pierwsze chaty już płoną, a twoi ludzie chcą użyć siły. Dzisiaj możesz ocalić miejsce kultu, wzbogacić skarbiec lub osobiście ryzykować życie wśród walczących."
 bp_040_gaik.desc_compassionate:0 "Widzisz dym nad gajem i słyszysz wołanie mieszkańców. Zarządca przekonuje, że drewno wystarczy na umocnienia, ale ceną będzie krzywda ludzi i świętokradztwo. Możesz powstrzymać wyrąb, choć podważysz rozkaz własnego urzędnika."
 bp_040_gaik.desc_callous:0 "Święty gaj dostarczyłby cennego drewna, a miejscowi sprzeciwiają się wycince. Masz wybór: ochronić ich i utracić korzyści, rozbić opór albo wejść między walczących i zaryzykować własne życie."
 bp_040_gaik.a:0 "Ochronię gaj (spokój prowincji, łaska Mokoszy; prestiż -70)."
 bp_040_gaik.b:0 "Rozkażę wyrąb (+150 złota; wieloletnie szkody i zemsta)."
 bp_040_gaik.c:0 "Sam rozdzielę walczących (25% ryzyka śmierci władcy)."
 bp_040_dziady.t:0 "Dziady wiosenne — krzywda po przodkach"
 bp_040_dziady.desc:0 "Podczas obrzędu przybywają ludzie, którzy twierdzą, że twój ród odebrał ich rodzinie majątek. Przynieśli dokument i proszą o zwrot ziemi. Możesz naprawić krzywdę, zniszczyć dowody albo publicznie przyznać, że historia rodu nie była nieskazitelna."
 bp_040_dziady.desc_blood:0 "Do obrzędu Dziadów dołącza rodzina pamiętająca człowieka zabitego z twojego rozkazu. Oprócz dawnego sporu o majątek żądają prawdy o tamtej śmierci. Twoja odpowiedź zdecyduje, czy waśń wygaśnie, czy z czasem dotknie także twoich bliskich."
 bp_040_dziady.desc_compassionate:0 "Przed tobą stoją ludzie, których rodzina utraciła ziemię wskutek czynów twoich przodków. Nie odpowiadasz za ich decyzje, lecz możesz zapobiec dalszej krzywdzie. Koszt zadośćuczynienia jest wysoki, a milczenie umocni nienawiść."
 bp_040_dziady.desc_callous:0 "Potomkowie dawnych właścicieli żądają zwrotu majątku. Dokumenty mogą być prawdziwe, lecz to ty dzierżysz obecnie władzę. Możesz kupić spokój, spalić dowody albo przyjąć publiczną hańbę zamiast wydawać złoto."
 bp_040_dziady.a:0 "Zwrócę należność (125 złota; ugoda, przychylność Welesa)."
 bp_040_dziady.b:0 "Zniszczę dowody (+120 złota, postrach; późniejsza zemsta)."
 bp_040_dziady.c:0 "Wyznaję winę rodu (utrata prestiżu i dochodu; oczyszczenie)."
 bp_040_stado.t:0 "Stado — krew przy wspólnym stole"
 bp_040_stado.desc:0 "W czasie Stada skłócone rody zasiadają do uczty pojednania. Jeden z wojów dobywa miecza, a po chwili padają pierwsi ranni. Drużyny chwytają za broń. Możesz rozdzielić strony, nakazać krwawą rozprawę z napastnikami albo pozwolić im walczyć. Każda decyzja na długo odmieni stosunki między rodami."
 bp_040_stado.desc_target:0 "Na ucztę Stada przybyli krewni ludzi, którzy zginęli wskutek twoich wcześniejszych rozkazów. Żądają zadośćuczynienia. W czasie sporu ktoś sięga po broń i padają ranni. Możesz powstrzymać rozlew krwi, rozprawić się ze zbrojnymi lub pozostawić rodziny samym sobie. Dawnych krzywd nie da się już przemilczeć."
 bp_040_stado.desc_brave:0 "W świątecznym kręgu zwaśnieni wojowie chwytają za miecze. Wiesz, że wejście pomiędzy nich wymaga odwagi, lecz rozkaz rzezi obarczy twój ród nową winą. Starszyzna czeka na decyzję, zanim zginą następni."
 bp_040_stado.desc_craven:0 "Rozpoczyna się krwawa bijatyka. Pragniesz zejść ze środka sali, lecz żerca i starszyzna domagają się twojego wyroku. Odstąpienie od sądu nie zakończy sporu, a rozkaz śmierci wywoła zemstę."
 bp_040_stado.a:0 "Rozdzielę zwaśnionych i ogłoszę pokój. (–100 prestiżu, mniej stresu, łaska Mokoszy)"
 bp_040_stado.b:0 "Każę drużynie zabić uzbrojonych prowodyrów. (+35 postrachu, łupy, tyrania i późniejsza zemsta)"
 bp_040_stado.c:0 "Pozwolę rodom walczyć do końca. (+80 złota, utrata prestiżu i wieloletnia waśń)"
 bp_040_kupala.t:0 "Noc Kupały — nurt i krew"
 bp_040_kupala.desc:0 "Po obrzędach Nocy Kupały nadciąga gwałtowna powódź. Nurt porywa ludzi, a strażnicy wzywają pomocy. Możesz osobiście wejść do rzeki i ryzykować życiem, wysłać drużynę, ratować jedynie osady albo zagarnąć łodzie i pozostawić mieszkańców bez ratunku."
 bp_040_kupala.desc_target:0 "Ludzie pamiętają, że wcześniej okazywałeś poddanym miłosierdzie. Teraz przed twoim obozem klękają rodziny z zalanej osady i błagają o ratunek. Woda sięga dachów, a każda zwłoka zwiększa liczbę ofiar."
 bp_040_kupala.desc_brave:0 "Płomienie kupalnych ognisk gasną pod naporem powodzi. Widząc ludzi w nurcie, pragniesz im pomóc. Nawet doświadczony wojownik może jednak zginąć w tej rzece. O losach tonących rozstrzygniesz osobiście."
 bp_040_kupala.desc_craven:0 "Rzeka pochłania łodzie i dobytek. Wiesz, że osobisty ratunek może zakończyć się twoją śmiercią. Możesz zaufać straży albo pozostać na brzegu, świadom ceny bezczynności."
 bp_040_kupala.a:0 "Sam wejdę do rzeki po tonących. (25% ryzyka śmierci władcy; wielka łaska Mokoszy po ocaleniu)"
 bp_040_kupala.b:0 "Wyślę straż do zalanych domostw. (50% ryzyka niepowodzenia; śmierć ludzi i zniszczenia)"
 bp_040_kupala.c:0 "Zatrzymam łodzie dla dworu. (+40 złota, klęska osad i przyszły odwet)"
 bp_040_kupala.d:0 "Skieruję ludzi do umocnienia brzegów. (Pomoc osadom bez osobistej próby śmierci)"
 bp_040_perun.t:0 "Święto Peruna — próba władcy"
 bp_040_perun.desc:0 "Podczas Święta Peruna dowódcy składają przysięgę przed żercą. Wojowie pamiętają tych, którzy zginęli za twoje rozkazy, i żądają, abyś sam stanął wobec niebezpieczeństwa. Możesz podjąć śmiertelną próbę, odmówić albo rozkazać drużynie wykonać ją za ciebie. Perun osądzi czyn, nie słowa."
 bp_040_perun.desc_target:0 "W poprzednich latach odmówiłeś publicznej próby odwagi. Wojowie nie zapomnieli twojej decyzji. Przy ołtarzu Peruna ponownie żądają, abyś dowiódł, że nie wysyłasz ludzi na śmierć wyłącznie po to, by ocalić własną skórę."
 bp_040_perun.desc_brave:0 "Sława odwagi zobowiązuje bardziej niż żelazna przysięga. Przed zgromadzoną drużyną możesz własnym życiem potwierdzić to, czego wymagasz od wojowników. Odmowa będzie pamiętana."
 bp_040_perun.desc_craven:0 "Obawiasz się próby, w której nie ochronią cię straże. Drużyna to widzi i czeka na decyzję. Jeśli każesz innym ryzykować zamiast siebie, przelejesz krew ludzi, których powinieneś prowadzić."
 bp_040_perun.a:0 "Sam podejmę próbę Peruna. (20% ryzyka śmierci; potężne błogosławieństwo wojenne po ocaleniu)"
 bp_040_perun.b:0 "Odmówię próby. Niech walczą inni. (+120 złota, utrata prestiżu i gniew Peruna)"
 bp_040_perun.c:0 "Wyślę swoich wojów na śmiertelną próbę zamiast siebie. (Straty, postrach, tyrania i boski gniew)"
 bp_040_harvest.t:0 "Dożynki — cena ostatniego ziarna"
 bp_040_harvest.desc:0 "Na dożynkowym placu stoją ludzie, którym grabież i nieurodzaj odebrały zapasy. Poborcy domagają się daniny, choć w spichlerzach pozostało tylko ziarno na siew. Możesz udzielić pomocy, wybrać przemocą należność albo rozkazać krwawą pacyfikację opornych osad."
 bp_040_harvest.desc_target:0 "Poddani pamiętają przelaną z twojego rozkazu krew. Teraz dożynkowe kosze pozostają puste, a poborcy żądają ostatnich zapasów. Mieszkańcy obawiają się, że i tym razem każesz wojom zabijać zamiast wysłuchać skargi."
 bp_040_harvest.desc_compassionate:0 "Dzieci proszą o chleb, a starszyzna pokazuje worki z ziarnem przeznaczonym na kolejny siew. Wiesz, że zabranie go skazuje prowincję na dalszy głód. Skarbiec jednak domaga się pieniędzy."
 bp_040_harvest.desc_callous:0 "Poborcy wykładają rachunki: daninę można ściągnąć w całości, jeśli drużyna przełamie opór. Cena będzie wysoka, lecz złoto zasili skarbiec. Pozostaje zdecydować, ile krwi gotów jesteś za nie zapłacić."
 bp_040_harvest.a:0 "Daruję daninę i kupię ziarno na siew. (–100 złota, rozwój ziemi i łaska Mokoszy)"
 bp_040_harvest.b:0 "Ściągnę należność pod osłoną zbrojnych. (+180 złota, bieda i późniejsza zemsta)"
 bp_040_harvest.c:0 "Rozkażę krwawą pacyfikację opornych wsi. (+200 złota, śmierć ludzi, tyrania i długotrwała klęska)"
 bp_040_autumn.t:0 "Dziady jesienne — krzywda domaga się odpowiedzi"
 bp_040_autumn.desc:0 "Podczas Dziadów jesiennych starszyzna odczytuje skargi rodzin pokrzywdzonych przez przemoc i niesprawiedliwe wyroki. Żywi domagają się od ciebie sądu przed duchami przodków. Możesz wynagrodzić krzywdy, uciszyć skarżących mieczem albo odmówić rozpatrzenia ich spraw."
 bp_040_autumn.desc_target:0 "Do obrzędowego ognia przybywają rodziny ludzi zabitych z twojego rozkazu. Wymieniają ich imiona i żądają sprawiedliwości. Słowa te dotyczą prawdziwych czynów twojego rodu. Możesz zapłacić za krzywdy albo dopuścić się nowej zbrodni na żałobnikach."
 bp_040_autumn.desc_blood:0 "Krewni zabitych nie zapomnieli wcześniejszego odwetu. Dziś przynoszą skargę przed przodków. Jeśli znów odpowiesz przemocą, kolejni mściciele przyjdą po twoich ludzi."
 bp_040_autumn.desc_brave:0 "Starszyzna żąda, abyś wysłuchał skarg bez zbrojnej osłony. Odwaga nie polega dziś na podniesieniu miecza, lecz na przyjęciu odpowiedzialności za podjęty wyrok."
 bp_040_autumn.desc_craven:0 "Obawiasz się gniewu rodzin domagających się sądu. Możesz zapłacić za zgodę, rozkazać ich rozpędzenie albo usunąć skargi, lecz żadna z tych decyzji nie cofnie dawnych czynów."
 bp_040_autumn.a:0 "Wynagrodzę krzywdy i wysłucham skarżących. (–100 złota, mniej stresu i łaska Welesa)"
 bp_040_autumn.b:0 "Rozkażę drużynie uciszyć żałobników mieczem. (Krew, postrach, tyrania i zemsta)"
 bp_040_autumn.c:0 "Spalę skargi i odmówię rozprawy. (+100 złota, wzrost stresu, długotrwała waśń)"
 bp_040_szczodre.t:0 "Szczodre Gody — święte prawo gościny"
 bp_040_szczodre.desc:0 "W najdłuższą zimową noc do twojej bramy docierają rodziny ścigane przez uzbrojonych prześladowców. Przybysze proszą o chleb i bezpieczny nocleg. Ich wrogowie oferują złoto za wydanie uciekinierów. Możesz dotrzymać świętego prawa gościny, sprzedać przybyszów albo zamknąć bramy."
 bp_040_szczodre.desc_target:0 "Lud pamięta, że dawniej udzielałeś schronienia potrzebującym. Teraz przy twojej bramie stoją rodziny z dziećmi, a ich prześladowcy oferują zapłatę za zdradę. Wybór rozstrzygnie, czy twoje wcześniejsze czyny były trwałą zasadą, czy tylko chwilowym gestem."
 bp_040_szczodre.desc_compassionate:0 "Zmarznięte dzieci kurczowo trzymają płaszcze rodziców. Odmowa może oznaczać ich śmierć. Znasz jednak cenę gościny: wydatek ze skarbca i groźbę odwetu ludzi, którzy przybyli po uciekinierów."
 bp_040_szczodre.desc_callous:0 "Zbrojni proponują ci złoto za wydanie uchodźców. Przybysze są bezbronni, a wszyscy wiedzą, że bez twojej ochrony nie przetrwają zimowego pościgu. Możesz przyjąć zapłatę i przelać ich krew cudzymi rękami."
 bp_040_szczodre.a:0 "Udzielę przybyszom ochrony i strawy. (–90 złota, prestiż, łaska Mokoszy)"
 bp_040_szczodre.b:0 "Wydam rodziny ich prześladowcom. (+150 złota, śmierć ludzi, postrach i zemsta)"
 bp_040_szczodre.c:0 "Zamknę bramy przed obiema stronami. (+70 złota, hańba i gniew poddanych)"
 bp_040_weles_judgement.desc_bargain:0 "Minęły miesiące od nocy, gdy Weles zdjął z ciebie ciężar trosk i przekazał ci dwieście pięćdziesiąt sztuk złota. Teraz bóg przybywa osobiście, ogromny i surowy, by odebrać obiecaną zapłatę. Żąda czterystu sztuk złota i publicznego uznania długu. Możesz zamiast tego przyjąć pięć lat ciężkiej kary. Jeżeli przeciwstawisz mu się otwarcie, ryzykujesz śmierć (35%)."
 bp_040_jare.desc_blood:0 "Na Jare Gody przybywają krewni ludzi, którzy zginęli wskutek twoich dawnych rozkazów. Przed świętym ogniem żądają zadośćuczynienia. Twoja drużyna usiłuje rozpędzić zgromadzonych; padają pierwsi ranni. Żerca przypomina, że ten dzień miał kończyć waśnie, nie rozpoczynać nowe. Możesz odkupić krzywdy, rozkazać dalszy rozlew krwi albo pozwolić, aby krewni ofiar sami szukali zemsty."
 bp_040_jare.desc_mercy:0 "Przed obrzędowym ogniem spotykają się dwa skłócone rody. Jeden z ich zbrojnych rani uczestnika święta, a tłum domaga się odwetu. Starszyzna przypomina, że dotąd wybierałeś łaskę zamiast miecza. Teraz lud oczekuje takiego samego rozstrzygnięcia. Możesz zapłacić za pojednanie, użyć siły albo odmówić sądu — lecz ostatni wybór odda sprawę w ręce mścicieli."
