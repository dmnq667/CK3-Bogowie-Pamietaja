 bp_book.status_declined_019:0 "Ostatnie obchody: świadomie odmówiono uczestnictwa. Dynastia pamięta decyzję."
 bp_book.status_active_019:0 "Ostatnie obchody: obrzęd odprawiono. Ponowny obrzęd w tym okresie jest zablokowany."
 bp_book.status_announced_019:0 "Święto trwa. Zapowiedź już nadeszła, a obrzęd nadal można rozpocząć ręcznie w menu Decyzje."
 bp_book.status_missed_019:0 "Ostatnie święto minęło bez odprawienia obrzędu. Nawet zaniechanie zostaje w pamięci bogów."
 bp_book.status_blessed_019:0 "Dynastia otrzymała już kiedyś wielką łaskę podczas tego święta. Sprawdź modyfikatory bieżącego władcy, aby poznać aktualne premie."
 bp_book.status_past_019:0 "Wcześniejsze obchody zostały odprawione. Nie ma obecnie aktywnego obrzędu."
 bp_book.status_past_declined_019:0 "Wcześniej odmówiono udziału w tym obrzędzie. Dynastia nie zapomniała."
 bp_book.status_empty_019:0 "Nie odnotowano jeszcze przebiegu tego święta w dziejach dynastii."
