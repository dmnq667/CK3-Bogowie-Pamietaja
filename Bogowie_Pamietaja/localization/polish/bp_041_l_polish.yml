l_polish:
 bp_041_gromnica.intro.t:0 "Gromnica — ogień, który chroni dom"
 bp_041_gromnica.intro.desc:0 "Drugiego lutego wspólnota rozpala i błogosławi ogień, który ma strzec domostw przed zimowym mrozem. Oczyszcza paleniska, odnawia zapasy drewna i prosi o bezpieczne nadejście wiosny. Władca staje przy świętym płomieniu razem z mieszkańcami grodu."
 bp_041_gromnica.intro.a:0 "Uczczę Gromnicę (+45 pobożności, -10 stresu, Ochrona ognia na 90 dni)."
 bp_041_weles.intro.t:0 "Siedem Nocy Welesa — pamięć i przysięga"
 bp_041_weles.intro.desc:0 "Od dziewiątego do piętnastego lutego, według naszego kalendarza obrzędowego, wspominamy zmarłych i odnawiamy przysięgi. Weles włada tajemnicami, bogactwem i zobowiązaniami, od których nie można uciec. Żerca przypomina, że słowo dane w tych dniach może związać los całego rodu."
 bp_041_weles.intro.a:0 "Uczczę Welesa (+45 pobożności, -10 stresu, Dostatek spod korzeni na 90 dni)."
 bp_041_spring.intro.t:0 "Wiosenny Nowy Rok — obudzenie ziemi"
 bp_041_spring.intro.desc:0 "Dziewiątego marca rozpoczynamy nowy czas pracy na roli. Gospodarze sprawdzają ziarno, przygotowują narzędzia i proszą Mokosz o żyzną ziemię. To święto odrodzenia: od podjętych teraz decyzji zależy, czy po zimie wystarczy żywności dla ludzi i wojów."
 bp_041_spring.intro.a:0 "Uczczę początek wiosny (+45 pobożności, -10 stresu, Błogosławieństwo siewu na 90 dni)."
 bp_041_jare.intro.t:0 "Jare Gody — pożegnanie zimy"
 bp_041_jare.intro.desc:0 "Podczas równonocy wiosennej ludzie wypędzają symbol zimy, przygotowują zielone gałązki i witają powracające życie. Jare Gody są czasem odnowienia więzi między rodzinami, pojednania i publicznych obietnic. Zgoda zawarta podczas święta powinna przetrwać dłużej niż sam obrzęd."
 bp_041_jare.intro.a:0 "Wezmę udział w Jarych Godach (+45 pobożności, -10 stresu, Nowe więzi na 90 dni)."
 bp_041_gaik.intro.t:0 "Gaik i Turzyca — święto zielonych gałęzi"
 bp_041_gaik.intro.desc:0 "Z końcem kwietnia mieszkańcy przynoszą do domów młode gałęzie, zdobią drzewa i obchodzą gaje, prosząc o pomyślność przyszłych zbiorów. Odradzająca się przyroda jest źródłem życia całej wspólnoty. W tych dniach wycięcie świętego gaju może stać się powodem poważnego sporu."
 bp_041_gaik.intro.a:0 "Uczczę Gaik (+45 pobożności, -10 stresu, Ochrona gaju na 90 dni)."
 bp_041_dziady.intro.t:0 "Dziady wiosenne — pamięć o przodkach"
 bp_041_dziady.intro.desc:0 "Drugiego maja krewni gromadzą się przy mogiłach, przynoszą jadło i wspominają imiona zmarłych. Dziady przypominają, że żyjący dziedziczą nie tylko ziemię, lecz także zobowiązania swoich poprzedników. Wspólne wspomnienie ma przywracać zgodę między pokoleniami."
 bp_041_dziady.intro.a:0 "Uczczę przodków (+45 pobożności, -10 stresu, Wiedza przodków na 90 dni)."
 bp_041_stado.intro.t:0 "Stado — wspólnota przy świątecznym stole"
 bp_041_stado.intro.desc:0 "Na przełomie maja i czerwca ludzie zbierają się na ucztach, pieśniach i tańcach. Rodziny odnawiają znajomości, młodzi zawierają związki, a skłóceni mają sposobność do pojednania. Stado służy umacnianiu więzi, bez których nawet silny gród nie przetrwa."
 bp_041_stado.intro.a:0 "Zasiądę do uczty Stada (+45 pobożności, -10 stresu, Zgoda w rodzinie na 90 dni)."
 bp_041_kupala.intro.t:0 "Noc Kupały — ogień i woda"
 bp_041_kupala.intro.desc:0 "W okolicach letniego przesilenia ludzie rozpalają ogniska, puszczają wianki na wodę i śpiewają do świtu. Ogień ma oczyszczać, woda zaś przypomina o życiu, miłości i niebezpieczeństwie natury. Noc Kupały jest świętem odwagi, bliskości i odnowienia."
 bp_041_kupala.intro.a:0 "Uczczę Noc Kupały (+45 pobożności, -10 stresu, Łaska miłości na 90 dni)."
 bp_041_perun.intro.t:0 "Święto Peruna — grom i przysięga"
 bp_041_perun.intro.desc:0 "Latem wojowie gromadzą się przy świętym dębie, aby uczcić Peruna, władcę burzy i opiekuna wojennego męstwa. Przed drużyną przypomina się przysięgi, oddaje cześć poległym i zobowiązuje dowódców do ochrony ludzi. W tych dniach słowo władcy ma szczególną wagę."
 bp_041_perun.intro.a:0 "Stanę przed Perunem (+45 pobożności, -10 stresu, Wojenny zapał na 90 dni)."
 bp_041_harvest.intro.t:0 "Święto Plonów — chleb dla wspólnoty"
 bp_041_harvest.intro.desc:0 "U schyłku lata wieńce ze zbóż i pierwszy chleb z nowego ziarna wyrażają wdzięczność za urodzaj. Święto Plonów przypomina, że dostatek pochodzi z pracy wielu rąk. Władca powinien rozstrzygnąć, jak podzielić zapasy między spichlerz, wojsko i mieszkańców."
 bp_041_harvest.intro.a:0 "Uczczę zbiory (+45 pobożności, -10 stresu, Pomyślność plonów na 90 dni)."
 bp_041_autumn.intro.t:0 "Dziady jesienne — obowiązek wobec zmarłych"
 bp_041_autumn.intro.desc:0 "Pod koniec października rodziny odwiedzają groby i wspominają tych, którzy odeszli. Zapalają ognie i dzielą się jadłem, aby okazać pamięć przodkom. Jesienne Dziady przypominają także o sprawiedliwości: krzywdy pozostawione bez zadośćuczynienia mogą ciążyć na potomkach."
 bp_041_autumn.intro.a:0 "Uczczę pamięć zmarłych (+45 pobożności, -10 stresu, Mądrość przodków na 90 dni)."
 bp_041_szczodre.intro.t:0 "Szczodre Gody — powrót światła"
 bp_041_szczodre.intro.desc:0 "W najdłuższe zimowe noce wspólnota zasiada do wspólnego stołu, dzieli się jadłem i zapala ogień na znak nadziei na nowy rok. Szczodre Gody są czasem gościnności, obdarowywania i odnawiania rodzinnych więzi. Wtedy szczególnie ważne staje się dotrzymanie danego słowa."
 bp_041_szczodre.intro.a:0 "Uczczę Szczodre Gody (+45 pobożności, -10 stresu, Szczodra gościnność na 90 dni)."
 bp_040_frozen_villages_modifier:0 "Osady pozostawione mrozowi"
 bp_040_frozen_villages_modifier_desc:0 "Zaniedbanie pomocy zimą osłabiło gospodarkę i rozwój tych ziem."
 bp_040_saved_villages_modifier:0 "Ocalone zimą osady"
 bp_040_saved_villages_modifier_desc:0 "Mieszkańcy otrzymali pomoc w czasie mrozów, dzięki czemu ziemie szybciej się odradzają."
 bp_040_fortified_capital_modifier:0 "Zabezpieczony gród"
 bp_040_fortified_capital_modifier_desc:0 "Władca skupił zapasy na obronie grodu kosztem rozwoju okolicy."
 bp_040_seed_saved_modifier:0 "Ocalone ziarno na siew"
 bp_040_seed_saved_modifier_desc:0 "Uratowany zasiew przyspiesza rozwój ziemi i wzmacnia dochody."
 bp_040_grain_requisition_modifier:0 "Przymusowy pobór ziarna"
 bp_040_grain_requisition_modifier_desc:0 "Zabrane chłopom ziarno pogarsza przyszłe plony i dochody."
 bp_040_oath_of_peace_modifier:0 "Przysięga zgody"
 bp_040_oath_of_peace_modifier_desc:0 "Władca wyjednał pokój między zwaśnionymi rodzinami, zdobywając zaufanie wasali."
 bp_040_feud_curse_modifier:0 "Waśń bez pojednania"
 bp_040_feud_curse_modifier_desc:0 "Nierozstrzygnięty spór osłabia dyplomację władcy i podważa jego autorytet."
 bp_040_ruthless_war_modifier:0 "Bezwzględna drużyna"
 bp_040_ruthless_war_modifier_desc:0 "Surowe rozkazy zwiększają skuteczność wojenną kosztem bezpieczeństwa poddanych."
 bp_040_scarred_veterans_modifier:0 "Drużyna okaleczona walką"
 bp_040_scarred_veterans_modifier_desc:0 "Dotkliwe straty osłabiły zdolności dowódcze i skuteczność wojów."
 bp_040_retribution_modifier:0 "Widmo zemsty"
 bp_040_retribution_modifier_desc:0 "Groźba odwetu i utrata zaufania utrudniają intrygi władcy."
 bp_040_blood_price_modifier:0 "Cena przelanej krwi"
 bp_040_blood_price_modifier_desc:0 "Dawna zbrodnia wymaga kosztownego zadośćuczynienia i obciąża skarbiec."
 bp_040_protected_guests_modifier:0 "Święte prawo gościny"
 bp_040_protected_guests_modifier_desc:0 "Władca ocalił przybyszów i zyskał sławę człowieka dotrzymującego obietnic."
 bp_040_tyrants_supper_modifier:0 "Uczta tyrana"
 bp_040_tyrants_supper_modifier_desc:0 "Strach po krwawej uczcie ułatwia zastraszanie i podstępy."
 bp_040_desperate_country_modifier:0 "Zubożała kraina"
 bp_040_desperate_country_modifier_desc:0 "Przemoc i wymuszone daniny wyniszczyły mieszkańców oraz dochody."
 bp_040_merciful_harvest_modifier:0 "Plony ocalone miłosierdziem"
 bp_040_merciful_harvest_modifier_desc:0 "Darowanie danin pozwoliło mieszkańcom odbudować gospodarstwa."
 bp_040_blood_feud_opinion:0 "Krwawe porachunki"
 bp_040_blood_feud_opinion_desc:0 "Krewni pamiętają śmierć bliskiej osoby i domagają się zemsty."
 bp_040_protected_kin_opinion:0 "Ocalił moich bliskich"
 bp_040_protected_kin_opinion_desc:0 "Wdzięczność za udzieloną ochronę członkom rodziny."
 bp_040_shamed_vassals_opinion:0 "Upokorzył wasali"
 bp_040_shamed_vassals_opinion_desc:0 "Wasale pamiętają publiczne poniżenie i utratę honoru."
 bp_040_kept_oath_opinion:0 "Dotrzymał przysięgi"
 bp_040_kept_oath_opinion_desc:0 "Szacunek dla władcy, który nie złamał złożonego słowa."
