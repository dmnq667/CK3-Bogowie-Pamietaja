 bp_book.0001.h:0 "Wiedza Przodków"
 bp_book.0007.e:0 "Wiosna i lato: kolejne cztery święta"
 bp_book.0008.t:0 "Księga Bogów: Wiedza Przodków"
 bp_book.0008.desc_war:0 "WIEDZA WOJENNA\n\nDziady wiosenne przyniosły ci nauki dawnych dowódców. Ich praktyczna wiedza zwiększa sprawność twoich wojsk i twoją biegłość w prowadzeniu wojny. Modyfikator działa dwa lata; odnawiasz go tylko przez własne wybory podczas kolejnych Dziadów."
 bp_book.0008.desc_state:0 "WIEDZA ZARZĄDU\n\nPrzodkowie nauczyli cię prowadzenia spichlerzy i skarbca. Wpływa to na zdolności zarządcze oraz dochody twojej domeny przez dwa lata."
 bp_book.0008.desc_names:0 "PAMIĘĆ IMION\n\nZapamiętałeś imiona przodków. To nie daje od razu wielkiego dochodu ani zwycięstwa w wojnie, lecz stanowi prawdziwą pamięć rodu."
 bp_book.0008.desc_empty:0 "WIEDZA PRZODKÓW\n\nNie zachowano jeszcze aktywnej nauki wojennej ani gospodarczej. Podczas Dziadów wiosennych możesz prosić zmarłych o konkretną radę."
 bp_book.0009.t:0 "Kronika świąt: wiosna i lato"
 bp_book.0009.desc:0 "Oto kolejne cztery obrzędy zapisane w dziejach dynastii. Wybierz jeden, by zobaczyć, czy został odprawiony, odrzucony czy pominięty.\n\nKronika nie zastępuje kalendarza: święta nadejdą niezależnie od woli władcy."
 bp_book.chronicle2_back:0 "Wróć do pierwszej części kroniki"
 bp_book.0009.gaik:0 "Gaik / Turzyca"
 bp_book.0105.t:0 "Kronika: Gaik / Turzyca"
 bp_book.0105.desc_declined:0 "Gaik / Turzyca. ŚWIADOMA ODMOWA.\n\nWładca zaniechał obrzędu. Bogowie zapamiętali jego decyzję.\n\nTermin: 30 kwietnia - 1 maja."
 bp_book.0105.desc_active:0 "Gaik / Turzyca. OBRZĘD ODPRAWIONY.\n\nObrzęd został odprawiony w ostatnim cyklu. Nie można go ponowić w tym samym okresie.\n\nTermin: 30 kwietnia - 1 maja."
 bp_book.0105.desc_announced:0 "Gaik / Turzyca. ŚWIĘTO NADESZŁO.\n\nŚwięto trwa, lecz obrzęd jeszcze nie został rozpoczęty. Możesz to uczynić z menu Decyzje.\n\nTermin: 30 kwietnia - 1 maja."
 bp_book.0105.desc_missed:0 "Gaik / Turzyca. MINĄŁ TERMIN.\n\nTermin ostatniego święta minął bez zapisanego obrzędu.\n\nTermin: 30 kwietnia - 1 maja."
 bp_book.0105.desc_past:0 "Gaik / Turzyca. DAWNE OBRZĘDY.\n\nW kronice zachowano pamięć o dawnym odprawieniu tego święta.\n\nTermin: 30 kwietnia - 1 maja."
 bp_book.0105.desc_past_declined:0 "Gaik / Turzyca. DAWNA ODMOWA.\n\nW kronice zachowano pamięć o dawnej odmowie obrzędu.\n\nTermin: 30 kwietnia - 1 maja."
 bp_book.0105.desc_empty:0 "Gaik / Turzyca. BRAK ZAPISU.\n\nNie zapisano jeszcze odprawienia ani odmowy. Święto nadejdzie zgodnie z kalendarzem.\n\nTermin: 30 kwietnia - 1 maja."
