 bp_book.0001.h:0 "Knowledge of the Ancestors"
 bp_book.0007.e:0 "Spring and Summer: Four More Feasts"
 bp_book.0008.t:0 "Book of Gods: Ancestral Wisdom"
 bp_book.0008.desc_war:0 "WARFARE WISDOM\n\nThe spring ancestors taught you military lessons, improving your command and knights. The modifier lasts two years and requires a fresh ritual to renew."
 bp_book.0008.desc_state:0 "STEWARDSHIP WISDOM\n\nThe ancestors taught you how to govern stores and treasury. The insight improves stewardship and domain income for two years."
 bp_book.0008.desc_names:0 "MEMORY OF NAMES\n\nYou remember the names of your ancestors. This is not immediate wealth or victory, but it keeps faith with your dead."
 bp_book.0008.desc_empty:0 "ANCESTRAL WISDOM\n\nNo active military or civic lesson has been recorded. The Spring Ancestors may teach you something useful."
