 bp_book.0001.g:0 "Kronika świąt"
 bp_book.0006.t:0 "Bogowie pamiętają: o modzie"
 bp_book.0006.desc:0 "BOGOWIE PAMIĘTAJĄ\n\nBóstwa to rzeczywiste siły świata. Dwanaście świąt nadchodzi zgodnie z kalendarzem, niezależnie od zamiarów władcy. Automatyczne okno zatrzymuje grę i pozwala rozpocząć obrzęd, odłożyć go w ramach okresu lub świadomie odmówić.\n\nWeles pamięta długi dynastii. Mokosz pyta o los ziemi i ludzi, a Perun bada męstwo oraz przysięgi. Księga Bogów przechowuje przychylność, trzy próby, długi, błogosławieństwa i Kronikę Świąt.\n\nWersja 0.1.9 ALPHA: dwanaście świąt. Graficzna oprawa CK3 wykorzystuje zaakceptowane ilustracje użytkownika."
 bp_book.0007.t:0 "Kronika świąt"
 bp_book.0007.desc:0 "Kronika przechowuje pamięć o odprawionych i zaniechanych obrzędach twojej dynastii. Wybierz święto, aby zobaczyć jego ostatni stan.\n\nPierwsze cztery święta znajdziesz na tej stronie, kolejne cztery na drugiej, a Peruna, Plony, Dziady jesienne i Szczodre Gody na trzeciej. Nie jest to jeszcze pełny dziennik z dokładną datą wszystkich dawnych obchodów."
 bp_book.chronicle_back:0 "Wróć do Kroniki Świąt"
 bp_announcement.start:0 "Przystąpię do obrzędu teraz."
 bp_announcement.later:0 "Uczczę święto później. Wybiorę odpowiedni moment."
 bp_announcement.decline:0 "Nie odprawię obrzędu w tym roku. Przyjmę konsekwencje."
 bp_book.0007.a:0 "Gromnica"
 bp_book.0101.t:0 "Kronika: Gromnica"
 bp_book.0101.desc_active:0 "Gromnica. OBRZĘD ODPRAWIONY w bieżącym cyklu.\n\nDynastia rozpoczęła ten obrzęd. Ponowny udział w obecnym okresie jest zablokowany.\n\nTermin: 2–8 lutego."
 bp_book.0101.desc_declined:0 "Gromnica. ŚWIADOME ZANIECHANIE.\n\nŚwięto nadeszło, lecz władca odmówił odprawienia obrzędu. Bogowie pamiętają tę decyzję.\n\nTermin: 2–8 lutego."
 bp_book.0101.desc_announced:0 "Gromnica. ŚWIĘTO ZOSTAŁO OGŁOSZONE.\n\nBogowie wyznaczyli ten okres. Obrzęd nie został jeszcze odprawiony. Jeśli czas święta nie minął, możesz wybrać go w menu Decyzje.\n\nTermin: 2–8 lutego."
 bp_book.0101.desc_missed:0 "Gromnica. OBRZĘDU NIE ODPRAWIONO.\n\nŚwięto nadeszło w bieżącym cyklu, ale minął jego termin. Nie zapisano odprawienia obrzędu.\n\nTermin: 2–8 lutego."
 bp_book.0101.desc_past_both:0 "Gromnica. DAWNIEJSZE WYBORY ZAPISANE.\n\nTwoja dynastia w przeszłości zarówno odprawiła ten obrzęd, jak i innym razem go odmówiła. Bogowie pamiętają oba czyny.\n\nTermin: 2–8 lutego."
 bp_book.0101.desc_past_declined:0 "Gromnica. W KRONICE ZANOTOWANO ODMOWĘ.\n\nTwoja dynastia już kiedyś odmówiła odprawienia tego obrzędu. Nadchodzące sezony pozostają niezależne od tej decyzji.\n\nTermin: 2–8 lutego."
 bp_book.0101.desc_past:0 "Gromnica. W KRONICE ZACHOWANO DAWNIEJSZE OBRZĘDY.\n\nTwoja dynastia odprawiła już to święto. Kolejne obchody nadchodzą zgodnie z kalendarzem, niezależnie od poprzednich wyborów.\n\nTermin: 2–8 lutego."
 bp_book.0101.desc_empty:0 "Gromnica. BRAK ZAPISU O ODPRAWIENIU.\n\nKronika nie zawiera jeszcze potwierdzenia obrzędu w historii dynastii. Święto i tak nadejdzie w ustalonym terminie.\n\nTermin: 2–8 lutego."
