l_english:
 bp_041_gromnica.intro.t:0 "Gromnica — The Fire that Guards the Home"
 bp_041_gromnica.intro.desc:0 "On the second of February, households kindle a sacred flame to protect their families against winter's cold. People clean their hearths, gather firewood and pray for spring to arrive safely. The ruler joins the community before the holy fire."
 bp_041_gromnica.intro.a:0 "Honor Gromnica and receive its blessing."
 bp_041_weles.intro.t:0 "Seven Nights of Veles — Memory and Oaths"
 bp_041_weles.intro.desc:0 "From the ninth to the fifteenth of February in this ritual calendar, the living remember their dead and renew solemn promises. Veles governs secrets, riches and debts that cannot simply be forgotten. The priest warns that an oath made during these nights may bind an entire dynasty."
 bp_041_weles.intro.a:0 "Honor Veles and receive his gift."
 bp_041_spring.intro.t:0 "Spring New Year — The Earth Awakens"
 bp_041_spring.intro.desc:0 "On the ninth of March, a new season of work begins. Farmers inspect their seed and tools, praying to Mokosh for fertile fields. This is a celebration of renewal: decisions made now determine whether the land will feed its people and its warriors after a long winter."
 bp_041_spring.intro.a:0 "Celebrate the earth's awakening."
 bp_041_jare.intro.t:0 "Jare Gody — Farewell to Winter"
 bp_041_jare.intro.desc:0 "At the spring equinox, villagers cast out the symbol of winter and welcome new life with green branches. Jare Gody is a time to renew ties, reconcile divided households and make promises before witnesses. Peace established at the festival should last beyond the feast."
 bp_041_jare.intro.a:0 "Join the rites of Jare Gody."
 bp_041_gaik.intro.t:0 "Gaik and Turzyca — The Green Branch"
 bp_041_gaik.intro.desc:0 "At the end of April, households decorate young branches and visit the groves to ask for prosperity. The growing forest sustains the entire community. To cut down a sacred grove at this time may provoke a bitter dispute among the people."
 bp_041_gaik.intro.a:0 "Honor the sacred grove."
 bp_041_dziady.intro.t:0 "Spring Dziady — Remembering Ancestors"
 bp_041_dziady.intro.desc:0 "On the second of May, families gather by graves, bring food and speak the names of the departed. Dziady reminds the living that they inherit not only land but also obligations from those who came before them. Shared remembrance can restore peace between generations."
 bp_041_dziady.intro.a:0 "Bring offerings and honor the ancestors."
 bp_041_stado.intro.t:0 "Stado — The Community Feast"
 bp_041_stado.intro.desc:0 "At the turn of May and June, people gather for feasts, songs and dances. Families renew their bonds, young adults form relationships, and old rivals may be reconciled. Stado strengthens the ties without which even a mighty stronghold cannot endure."
 bp_041_stado.intro.a:0 "Join the communal feast."
 bp_041_kupala.intro.t:0 "Kupala Night — Fire and Water"
 bp_041_kupala.intro.desc:0 "Around the summer solstice, bonfires are lit and wreaths set adrift upon the water. The fire signifies purification; the river speaks of life, love and nature's dangers. Kupala Night celebrates courage, affection and renewal."
 bp_041_kupala.intro.a:0 "Honor the fire and waters of Kupala Night."
 bp_041_perun.intro.t:0 "Feast of Perun — Thunder and Oaths"
 bp_041_perun.intro.desc:0 "In summer, warriors assemble beneath the sacred oak to honor Perun, lord of the storm and patron of martial courage. They remember the fallen and renew oaths to defend their people. A ruler's word carries special weight before this gathering."
 bp_041_perun.intro.a:0 "Swear an oath before Perun."
 bp_041_harvest.intro.t:0 "Harvest Feast — Bread for the Community"
 bp_041_harvest.intro.desc:0 "As summer ends, grain wreaths and the first bread of the new harvest give thanks for the fields. The celebration recalls that prosperity is earned by many hands. The ruler must consider how the grain should be shared among the stores, the army and the villagers."
 bp_041_harvest.intro.a:0 "Give thanks for the harvest."
 bp_041_autumn.intro.t:0 "Autumn Dziady — Duty to the Departed"
 bp_041_autumn.intro.desc:0 "At the end of October, families visit the graves of their ancestors, kindle fires and share food in remembrance. Autumn Dziady also speaks of justice: wrongs left unanswered may burden the descendants of those who committed them."
 bp_041_autumn.intro.a:0 "Honor the memory of the departed."
 bp_041_szczodre.intro.t:0 "Szczodre Gody — The Return of Light"
 bp_041_szczodre.intro.desc:0 "During the longest winter nights, families share food and kindle flames in hope of a new year. Szczodre Gody celebrates hospitality, generosity and the renewal of family bonds. Keeping one's word matters greatly during this sacred season."
 bp_041_szczodre.intro.a:0 "Join the feast of Szczodre Gody."
 bp_040_frozen_villages_modifier:0 "Villages Abandoned to Winter"
 bp_040_frozen_villages_modifier_desc:0 "Neglect during the bitter cold has damaged the local economy and development."
 bp_040_saved_villages_modifier:0 "Villages Saved from Winter"
 bp_040_saved_villages_modifier_desc:0 "The ruler's aid allowed villagers to recover and rebuild."
 bp_040_fortified_capital_modifier:0 "Stronghold Reinforced"
 bp_040_fortified_capital_modifier_desc:0 "Resources were devoted to defending the stronghold rather than developing the countryside."
 bp_040_seed_saved_modifier:0 "Seed Grain Preserved"
 bp_040_seed_saved_modifier_desc:0 "Saving the spring seed improves the prosperity of the land."
 bp_040_grain_requisition_modifier:0 "Grain Seized by Force"
 bp_040_grain_requisition_modifier_desc:0 "Requisitioning seed grain has damaged the coming harvest and the local economy."
 bp_040_oath_of_peace_modifier:0 "Oath of Reconciliation"
 bp_040_oath_of_peace_modifier_desc:0 "Peace between rival families has earned the ruler the trust of the vassals."
 bp_040_feud_curse_modifier:0 "Unsettled Blood Feud"
 bp_040_feud_curse_modifier_desc:0 "An unresolved dispute has weakened the ruler's diplomacy and authority."
 bp_040_ruthless_war_modifier:0 "Ruthless Warband"
 bp_040_ruthless_war_modifier_desc:0 "Harsh discipline increases the army's strength at the expense of the people."
 bp_040_scarred_veterans_modifier:0 "Warband Scarred by Battle"
 bp_040_scarred_veterans_modifier_desc:0 "Devastating losses have weakened leadership and the effectiveness of the warriors."
 bp_040_retribution_modifier:0 "Shadow of Revenge"
 bp_040_retribution_modifier_desc:0 "Threats of retaliation and broken trust hinder the ruler's schemes."
 bp_040_blood_price_modifier:0 "Price of Spilled Blood"
 bp_040_blood_price_modifier_desc:0 "A past crime demands costly reparations and burdens the treasury."
 bp_040_protected_guests_modifier:0 "Sacred Hospitality"
 bp_040_protected_guests_modifier_desc:0 "Protecting vulnerable guests has earned the ruler a reputation for keeping promises."
 bp_040_tyrants_supper_modifier:0 "Tyrant's Feast"
 bp_040_tyrants_supper_modifier_desc:0 "Fear after the bloodshed makes intimidation and deception easier."
 bp_040_desperate_country_modifier:0 "Land Reduced to Poverty"
 bp_040_desperate_country_modifier_desc:0 "Violence and forced levies have ruined the livelihoods of the inhabitants."
 bp_040_merciful_harvest_modifier:0 "Harvest Saved by Mercy"
 bp_040_merciful_harvest_modifier_desc:0 "Remitting taxes has allowed the villagers to rebuild their farms."
 bp_040_blood_feud_opinion:0 "Blood Feud"
 bp_040_blood_feud_opinion_desc:0 "The family remembers a loved one's death and thirsts for revenge."
 bp_040_protected_kin_opinion:0 "Protected My Kin"
 bp_040_protected_kin_opinion_desc:0 "Gratitude for the protection of family members."
 bp_040_shamed_vassals_opinion:0 "Humiliated the Vassals"
 bp_040_shamed_vassals_opinion_desc:0 "The vassals remember their public humiliation."
 bp_040_kept_oath_opinion:0 "Kept an Oath"
 bp_040_kept_oath_opinion_desc:0 "Respect for a ruler who honored a solemn promise."
