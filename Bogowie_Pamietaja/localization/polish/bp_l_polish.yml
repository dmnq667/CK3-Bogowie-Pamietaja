 bp_announcement.1001.t:0 "Gromnica nadeszła"
 bp_announcement.1001.desc:0 "W środku zimy zamierają ognie w osadach. Płomienie trwają tylko pod świętym dębem. Od dziś, przez siedem dni, przypada Gromnica. To czas oczyszczenia i ochrony domostw.\n\nNie możesz sprawić, aby święto nie nadeszło. Możesz jednak rozstrzygnąć, czy własnymi czynami uświetnisz jego obchody. Zaniedbanie ognia może powrócić do ciebie podczas Tygodnia Welesa."
 bp_announcement.1002.t:0 "Nadeszły noce Welesa"
 bp_announcement.1002.desc:0 "Dziewiątego dnia lutego ktoś uderza w lód od spodu. Żerca czeka pod korzeniami starego dębu. Przez siedem nocy granica umarłych i żywych będzie otwarta.\n\nWeles nie prosi o pozwolenie. Nadszedł jego czas. To ty rozstrzygniesz, czy przystąpisz do niebezpiecznego obrzędu, czy zostawisz gaj zamknięty."
 bp_announcement.1003.t:0 "Przebudzenie Ziemi"
 bp_announcement.1003.desc:0 "Dziewiątego marca mroźna ziemia po raz pierwszy pęka od odwilży. Ludzie wybiegają na pola, lecz niektórzy wracają z nich w milczeniu. Spod bruzd dochodzi dźwięk oddechu.\n\nNadeszło święto przebudzenia ziemi. Mokosz patrzy nie tylko na twoje dary, ale także na to, co uczyniono z ludźmi i ziemią podczas zimy."
 bp_announcement.1004.t:0 "Nadeszły Jare Gody"
 bp_announcement.1004.desc:0 "Rzeka uwolniła się od lodu. Ludzie szykują kukłę Marzanny, lecz na jej twarzy ktoś namalował znaki, których nie zna żaden z żerców.\n\nRównonoc nadeszła. Zima odejdzie niezależnie od twoich rozkazów, ale to, co odnajdziesz podczas obrzędu, może przesądzić o łasce Mokoszy i pamięci Welesa."

 bp_test.9001.f:0 "[TEST] Zapowiedź Gromnicy (okno bez uruchomienia)"
 bp_gaik_decision:0 "Gaik / Turzyca: Przebudzenie gaju"
 bp_gaik_decision_desc:0 "Okres: 30 kwietnia - 1 maja.\n\nPomiędzy zielenią a prawem do drewna. Mokosz widzi, co czynisz z ziemią.\n\nŚwięto nadchodzi samo. Obrzęd rozpoczynasz dobrowolnie i tylko raz w danym okresie."
 bp_gaik_decision_tooltip:0 "Rozpocznij obrzęd podczas trwającego święta."
 bp_dziady_decision:0 "Dziady wiosenne: Głosy zza mogił"
 bp_dziady_decision_desc:0 "Okres: 2-8 maja.\n\nPrzodkowie mogą przekazać wiedzę przydatną w rządzeniu i na wojnie.\n\nŚwięto nadchodzi samo. Obrzęd rozpoczynasz dobrowolnie i tylko raz w danym okresie."
 bp_dziady_decision_tooltip:0 "Rozpocznij obrzęd podczas trwającego święta."
 bp_stado_decision:0 "Stado: Gdy splatają się losy"
 bp_stado_decision_desc:0 "Okres: 29 maja - 4 czerwca.\n\nWspólnota, zaloty, więzi i pokusa władzy nad cudzym losem.\n\nŚwięto nadchodzi samo. Obrzęd rozpoczynasz dobrowolnie i tylko raz w danym okresie."
 bp_stado_decision_tooltip:0 "Rozpocznij obrzęd podczas trwającego święta."
 bp_kupala_decision:0 "Noc Kupały: Ogień, woda i pożądanie"
 bp_kupala_decision_desc:0 "Okres: 20-23 czerwca.\n\nLetnia noc namiętności, spotkań, sekretów i niezwykłej łaski.\n\nŚwięto nadchodzi samo. Obrzęd rozpoczynasz dobrowolnie i tylko raz w danym okresie."
 bp_kupala_decision_tooltip:0 "Rozpocznij obrzęd podczas trwającego święta."
 bp_announcement.1005.t:0 "Gaik. Gaj, który się obudził"
 bp_announcement.1005.desc:0 "Trzydziestego kwietnia pierwsze zielone gałęzie mają trafić do domów. W nocy jednak stary gaj przemówił. Przy pniach ziemia pękła, a korzenie zatrzymały ludzi niosących siekiery.\n\nGaik nadszedł. Żaden rozkaz nie odwoła jego czasu. Możesz tylko zdecydować, czy wejdziesz do gaju i podejmiesz obrzęd."
 bp_announcement.1006.t:0 "Dziady wiosenne. Głosy przodków"
 bp_announcement.1006.desc:0 "Drugiego maja przy mogiłach pojawiają się światła, choć nikt ich nie zapalał. Starszy żerca twierdzi, że zmarli nie przybyli po strawę, lecz by przemówić do tych, którzy dziedziczą ich ziemię.\n\nNadeszły Dziady wiosenne. Czy wysłuchasz przodków, zależy od ciebie."
 bp_announcement.1007.t:0 "Stado. Czas ludzkich więzi"
 bp_announcement.1007.desc:0 "Ostatnie dni maja niosą śpiew i śmiech. Ludzie z odległych osad zbierają się na wspólnej uczcie. Niektóre rodziny szykują zaręczyny, inne przyprowadzają tych, którzy od dawna ze sobą nie rozmawiają.\n\nStado rozpoczęło się niezależnie od twojej woli. To, co uczynisz z ludzkimi więziami, zostanie zapamiętane."
 bp_announcement.1008.t:0 "Noc Kupały. Ogień i pragnienie"
 bp_announcement.1008.desc:0 "Dwudziestego czerwca nad rzekami płoną pierwsze ognie. Wieniec wypuszczony na wodę wraca przeciw prądowi, a z ciemności dochodzi śmiech. Młodzi i starzy opuszczają codzienny porządek, by spotkać się pod letnim niebem.\n\nNadeszła Noc Kupały. Bogowie widzą nie tylko rytuały, ale i pragnienia, które ludzie skrywają."
 bp_gaik.5001.t:0 "Zieleń pod ostrzem"
 bp_gaik.5001.desc:0 "Rankiem do sali wpada zarządca grodu. W jednej ręce trzyma odłamek topora, w drugiej garść ziemi. Na żelazie widać ślad, jakby ktoś ścisnął je od wewnątrz.\n\n\"Potrzebujemy drewna do umocnień\", mówi. \"Ale gaj nie pozwala nam go ściąć\".\n\nZa nim stoi żerca, milczący i blady. Twierdzi, że Mokosz obudziła korzenie. Zarządca żąda rozkazu. Ludzie czekają, czy poślesz drwali z powrotem."
 bp_gaik.5001.a:0 "Zachowajcie gaj. Umocnienia wzniosę gdzie indziej."
 bp_gaik.5001.b:0 "Rozebrać przeszkodę. Gród nie może ustąpić drzewom."
 bp_gaik.5001.c:0 "Niech wieś sama wyznaczy granice świętego miejsca."
 bp_gaik.5002.t:0 "To, czego strzegą korzenie"
 bp_gaik.5002.desc:0 "Gdy ustępujesz z gaju, ziemia odsłania pod najstarszym drzewem kości człowieka, którego nie pochowano zgodnie z obyczajem. Przy zmarłym leży uszkodzony pierścień z wyrytym znakiem dawnego rodu.\n\nŻerca pyta, czy pozwolisz oddać mu należną cześć. \"Nie dla mnie\", dodaje, patrząc na gęśte korzenie."
 bp_gaik.5002.desc_debt:0 "Spod korzeni wynurza się pierścień tego samego kształtu, jaki widziałeś podczas spotkania z Welesem. Przy nim leżą kości, których nikt nie pochował.\n\n\"Ziemia pamięta twoje zimowe słowa\", mówi żerca. \"Jeszcze możesz uczynić coś z tą pamięcią\"."
 bp_gaik.5002.a:0 "Pochowajmy zmarłego. Jego imię trzeba odnaleźć."
 bp_gaik.5002.b:0 "Niech opowieść o tym przysporzy mi sławy."
 bp_gaik.5003.t:0 "Korzenie pod palisadą"
 bp_gaik.5003.desc:0 "Drewno zwieziono przed zmrokiem. Nocą jednak spod palisady wyszły cienkie korzenie, a rano ludzie znaleźli w nich wbite groty włóczni, jakby drzewo uczyło się wojny.\n\nMokosz nie odebrała ci budulca. Pozostawiła znak, że zna cenę twojej decyzji."
 bp_gaik.5003.a:0 "Niech straże obserwują gaj."
 bp_dziady.6001.t:0 "Mądry umarły nie prosi o wino"
 bp_dziady.6001.desc:0 "Przy mogiłach przygotowano jedzenie dla przodków. Kiedy pierwszy puchar dotyka ziemi, spod kamieni dobiega głos: \"Nie przyszliśmy po wieczerzę. Przyszliśmy, bo zapomnieliście, jak przetrwać\".\n\nDawny dowódca i zarządca ziem, obaj od dawna martwi, czekają na odpowiedź. Żerca pyta, czy oddasz im należną cześć i pozwolisz mówić."
 bp_dziady.6001.desc_blood:0 "Przy pierwszym pucharze słyszysz głos członka rodu oddanego Welesowi. Nie oskarża cię. Mówi tylko: \"Pamiętam noc w gaju. Dziś mam dla ciebie słowa, których nie kupisz nową ofiarą\".\n\nInni zmarli stoją za nim w milczeniu. Czekają, czy pozwolisz im przemówić."
 bp_dziady.6001.a:0 "Złożę dary i wysłucham zmarłych."
 bp_dziady.6001.b:0 "Niech zabrzmią dawne pieśni. Oddam cześć nie pieniądzmi."
 bp_dziady.6001.c:0 "Nie będę uczyć się od mogił."
 bp_dziady.6002.t:0 "Dwie rady zza grobu"
 bp_dziady.6002.desc:0 "\"Wojna była ciężka, bo czytaliśmy wzgórza, nie twarze przeciwników\", mówi zmarły dowódca. Opowiada o przeprawach, osłonie skrzydeł i dniu, gdy odwrót ocalił armię.\n\n\"A państwo ginie nie tylko od miecza\", odpowiada zarządca. \"Zapasy, miary i uczciwe pobory są silniejsze od niejednej palisady\".\n\nMasz czas zapamiętać jedną naukę, zanim ich głosy ucichną."
 bp_dziady.6002.a:0 "Zapamiętam drogi wojny."
 bp_dziady.6002.b:0 "Zapamiętam prawa spichlerza i skarbca."
 bp_dziady.6002.c:0 "Zapamiętam ich imiona. Bez tego wiedza nic nie znaczy."
 bp_dziady.6003.t:0 "Wieść, której nie było w księgach"
 bp_dziady.6003.desc_war:0 "Podczas ćwiczeń wojownik pokazuje nowy sposób przeprawy. Poznajesz go natychmiast. Widziałeś tę drogę oczyma zmarłego dowódcy.\n\nNie jest to sen. Ludzie wykonują manewr, którego nikt ich wcześniej nie uczył."
 bp_dziady.6003.desc_state:0 "Zarządca kładzie przed tobą rachunki. Znajdujesz w nich błąd, który zmarły urzędnik wyjaśnił ci podczas Dziadów.\n\nGdy poprawiają pobory, okazuje się, że zasobów starczy na dłużej. Wiedza przodków ma wagę worków zboża."
 bp_dziady.6003.desc_names:0 "Słudzy pytają o imię dawnego dowódcy. Wypowiadasz je bez wahania. Kiedy potem odnajdują zapomniany grób, znaki na kamieniu zgadzają się z tym, co opowiedzieli ci zmarli."
 bp_dziady.6003.a:0 "Niech ta wiedza służy żywym."
 bp_stado.7001.t:0 "Ci, którzy przyszli razem"
 bp_stado.7001.desc:0 "Na łące za grodem zebrali się ludzie, których dzielą pola, powinności i rodowe spory. Teraz piją z jednego dzbana. Śpiewacy wymieniają imiona przyszłych małżonków, lecz w jednej grupie nikt nie podejmuje pieśni: dwie zwaśnione rodziny stoją naprzeciw siebie.\n\nŻerca prosi o znak, czy władca pozwoli świętu pojednać tych ludzi, czy wykorzysta je do umocnienia własnego autorytetu."
 bp_stado.7001.a:0 "Urządzę wspólną ucztę. Niech usiądą obok siebie."
 bp_stado.7001.b:0 "Oddam głos starszym obu rodów."
 bp_stado.7001.c:0 "Stado ma służyć mojej chwale, nie cudzym sporom."
 bp_stado.7002.t:0 "Wianek na wspólnym stole"
 bp_stado.7002.desc_person:0 "W tłumie dostrzegasz [bp_stado_companion.GetFirstName]. Wianek przyniesiony na święto zostaje położony między wami, a rozmowa, początkowo ostrożna, staje się szczera. Nie każde spotkanie musi skończyć się obietnicą. Niektóre wystarczy zapamiętać.\n\nStarszyzna oczekuje, że wrócisz do uroczystości. Jak odpowiesz na ten niespodziewany gest?"
 bp_stado.7002.desc_default:0 "Wianek położony na środku stołu przechodzi z rąk do rąk. Ludzie podchodzą do siebie bez broni i bez orszaków. Jeden ze starszych mówi: \"Dzisiaj możemy naprawić to, co zepsuliśmy przez cały rok\"."
 bp_stado.7002.a:0 "Odpowiem na zaproszenie do rozmowy."
 bp_stado.7002.b:0 "Niech wspólnota zapamięta ten dzień."
 bp_stado.7002.c:0 "Zostawię im czas bez mojego nadzoru."
 bp_kupala.8001.t:0 "Kiedy rzeka przyjmuje ogień"
 bp_kupala.8001.desc:0 "Na brzegu rzeki płoną ogniska. W ciemności widać twarze rozpalone tańcem i winem. Ktoś niesie wianek, ktoś inny wyprowadza ukochaną osobę pomiędzy drzewa. Nad wodą niesie się śmiech i gorący oddech letniej nocy.\n\nŻerca szepcze: \"Ogień może być tylko widowiskiem albo ofiarą. Bogowie poznają różnicę\". Czy rozpoczniesz obrzęd, który może odmienić uczucia i losy rodu?"
 bp_kupala.8001.a:0 "Złożę kosztowny dar i rozpalę święty ogień."
 bp_kupala.8001.b:0 "Niech każda wieś przyniesie płomień."
 bp_kupala.8001.c:0 "Niech ta noc przeminie bez mojej obecności."
 bp_kupala.8002.t:0 "Kiedy gasną ogniska"
 bp_kupala.8002.desc_person:0 "Taniec trwa dłużej, niż przewidywała starszyzna. Nad brzegiem rzeki spotykasz [bp_kupala_companion.GetFirstName]. Rozmowa nie przypomina dworskich zalotów. Nikt nie mówi o posagach ani traktatach.\n\n\"Mogę odejść\", słyszysz. \"Ale jeśli chcesz, zostanę z tobą do świtu\".\n\nNad rzeką jest dość miejsca na pragnienie i na odmowę. To, co wybierzesz, może dotrzeć na dwór dopiero po wielu tygodniach."
 bp_kupala.8002.desc_default:0 "Ludzie rozchodzą się między ogniska. Niektórzy szukają bliskości, inni wracają do małżonków; nikt nie zagląda w nocne ścieżki sąsiadów.\n\nWieniec rzucony do wody wraca ku brzegowi, jakby rzeka odmawiała wypuszczenia go z rąk. To nie przypadek. Coś czeka na twój wybór."
 bp_kupala.8002.a:0 "Zostanę. Oboje tego pragniemy."
 bp_kupala.8002.b:0 "Pożądanie nie musi prowadzić do zdrady. Wracam do swoich."
 bp_kupala.8002.c:0 "Nie chcę dziś nikomu niczego obiecywać."
 bp_kupala.8003.t:0 "Wianek pod prąd"
 bp_kupala.8003.desc:0 "Na środku rzeki zatrzymuje się wianek. Woda płynie dalej, lecz kwiaty pozostają nieruchome. Z głębiny odzywa się kobiecy głos: \"Chcecie brać, brać i jeszcze raz brać. A co oddacie tym, którzy obudzą się jutro bez chleba?\"\n\nPoznajesz wolę Mokoszy. Trzecia próba nie dotyczy ani ognia, ani namiętności. Dotyczy ludzi, których życie ma trwać po świcie."
 bp_kupala.8003.desc_debt:0 "Wianek zatrzymuje się na rzece i nie porusza się mimo prądu. Z wody dochodzi głos: \"Weles ma twoje słowo. Ja pytam o żywych\".\n\nMokosz nie przybyła, by anulować dług. Żąda, byś nakarmił tych, którzy jeszcze mogą doczekać następnej wiosny."
 bp_kupala.8003.a:0 "Oddam zapasy potrzebującym. Niech świt przyniesie życie."
 bp_kupala.8003.b:0 "Nie oddam skarbca za głos z rzeki."
 bp_kupala.8003.c:0 "To tylko znak. Odejdźmy."
 bp_kupala.8004.t:0 "Łaska najkrótszej nocy"
 bp_kupala.8004.desc:0 "Nad ranem święty ogień wciąż płonie, choć dawno skończyło się drewno. Po drugiej stronie rzeki widzisz postać kobiety, której stopy nie zapadają się w mokry piasek.\n\n\"Ogień był prawdziwy. Serce nie skłamało. Ziemia otrzymała dar\", mówi Mokosz. \"Niech twoje życie na pewien czas rozkwitnie tak, jak kwitnie ten brzeg\".\n\nZ jej dłoni spadają na wodę trzy ziarna. Każde wypuszcza korzeń jeszcze przed dotknięciem dna."
 bp_kupala.8004.a:0 "Przyjmuję wielką łaskę Mokoszy."
 bp_kupala.8005.t:0 "Świt bez obietnicy"
 bp_kupala.8005.desc:0 "Słońce wychodzi nad las. Ludzie wracają do swoich domów, niektórzy osobno, inni trzymając się za ręce. Ogniska dogasają, lecz rzeka nadal niesie wianki pod prąd.\n\nNie spełniono wszystkich prób. Mimo to czujesz, że ziemia na krótko stała się przychylniejsza. To nie cud, którego mógłbyś żądać ponownie jutro."
 bp_kupala.8005.a:0 "Niech to, co zaszło tej nocy, pozostanie w naszej pamięci."
 bp_kupala.8006.t:0 "Gdy lato straciło zapach"
 bp_kupala.8006.desc_secret:0 "Na dworze ktoś nuci pieśń śpiewaną nad rzeką. Rozpoznajesz melodię i czujesz powrót tamtej nocy. Nie wszyscy znają jej prawdę. Niektórzy dopiero zaczną pytać.\n\nMokosz nie odebrała swojej łaski, ale przypomina ci, że nawet najkrótsza noc może mieć długie następstwa."
 bp_kupala.8006.desc_default:0 "Mijają tygodnie. Na polach życie rozwija się z niezwykłą siłą, a ludzie wspominają czerwcową noc z niedowierzaniem.\n\nDar trwa. Otrzymałeś go nie za sam ogień ani za samą przyjemność, lecz za trzy odrębne czyny."
 bp_kupala.8006.a:0 "Bogowie pamiętają. Ja również."
