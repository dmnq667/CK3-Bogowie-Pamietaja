 bp_weles.2011.t:0 "Imiona spod korzeni"
 bp_weles.2011.desc:0 "Na stole znajduję misę ziemi i spis zapomnianych imion. Przy każdym widnieje wieś należąca dziś do mego rodu.\n\n„Dałem ci dostatek”, mówi Weles. „Teraz przywróć pamięć skrzywdzonym. Żywi nadal płacą za winy umarłych”."
 bp_weles.2011.a:0 "Odbuduję ich mogiły i oddam potomkom należne dobra. (180 złota)"
 bp_weles.2011.b:0 "Przed całym dworem wyznam prawdę o winie mego rodu."
 bp_weles.2011.c:0 "Niech Weles czeka. Rządzę ziemią żywych."
 bp_weles.2012.t:0 "Puste miejsce w spichlerzu"
 bp_weles.2012.desc:0 "W zamkniętych spichlerzach zamiast zboża leży mokra ziemia. Na schodach ktoś zostawił pierścień bezimiennego zmarłego.\n\n„Dług nie znika, gdy milczysz”, szepcze Weles. „Następna odmowa uderzy w pola twoich poddanych”."
 bp_weles.2012.a:0 "Zapłacę, choć cena wzrosła. Niech wrócą imiona. (250 złota)"
 bp_weles.2012.b:0 "Niech wszyscy poznają prawdę. Za ten wstyd zapłacę sam."
 bp_weles.2012.c:0 "Nie oddam nic. Rozkażę zamknąć wejście do gaju."
 bp_weles.2013.t:0 "Dług odziedziczony"
 bp_weles.2013.desc:0 "Podczas Dziadów żerca przynosi spis zmarłych. Jedno imię przekreślono.\n\n„Twój przodek przyjął dar Welesa i pozostawił dług. Dziedziczysz nie tylko jego pieczęć, lecz także zobowiązanie”."
 bp_weles.2013.desc_blood:0 "Żerca przynosi dwa imiona: krewnego złożonego w ofierze i człowieka, któremu ród odebrał ziemię.\n\n„Jedną cenę zapłacono krwią”, mówi. „Drugiej Weles nie zapomniał. Teraz ty musisz odpowiedzieć”."
 bp_weles.2013.a:0 "Wyrównam krzywdę zmarłych. Niech ziemia wróci do żywych. (220 złota)"
 bp_weles.2013.b:0 "Ogłoszę winę rodu wobec wszystkich, bez ukrywania imion."
 bp_weles.2013.c:0 "Nie jestem winien tego, czego dokonali umarli."
 bp_weles.2014.t:0 "To, co przyjęła ziemia"
 bp_weles.2014.desc_truth:0 "Nikt nie lubi słuchać o winie własnych przodków. Na dziedzińcu jedni odwracają ode mnie wzrok, inni po raz pierwszy wypowiadają imiona ludzi, których ich rodziny nie mogły opłakiwać.\n\nWieczorem pod dębem nie ma żercy ani ofiar. Leży tylko sucha gałąź, choć cały las ocieka deszczem. Weles nie przemawia. Nie musi. Dług został spłacony."
 bp_weles.2014.desc_restored:0 "Przy starej drodze stanęły kamienie z odzyskanymi imionami. Mieszkańcy sąsiednich wsi przyszli bez rozkazu, przynieśli chleb, ziemię i światło. Nikt nie złożył krwawej ofiary.\n\nGdy ostatnia misa została postawiona przed grobem, ziemia pod dębem drgnęła. Dopiero wtedy zrozumiałem, że Weles czekał nie na kolejną śmierć, lecz na pamięć."
 bp_weles.2014.a:0 "Niech te imiona pozostaną w naszych księgach."
 bp_book.0002.debt:0 "Sprawdż długi, które Weles zapisał na moim rodzie."
 bp_book.0010.t:0 "Księga długów Welesa"
 bp_book.0010.desc_blood:0 "Mój ród wciąż jest dłużny Welesowi. W jego pamięci pozostała także krew bliskiego, złożonego mu w ofierze. Tamtej śmierci nie da się odwołać i nie można uznać jej za spłatę każdego innego zobowiązania.\n\nSTAN: DŁUG OTWARTY.\nPowrót: podczas Dziadów wiosennych lub po wezwaniu Welesa.\nMożliwe skutki odmowy: niełaska i wyniszczenie ziemi."
 bp_book.0010.desc_unpaid:0 "Weles obdarzył mój ród przychylnością, lecz w jego księdze pozostał nierozliczony zapis. Ani śmierć władcy, ani zmiana posiadacza korony nie wykreśla tego zobowiązania.\n\nSTAN: DŁUG OTWARTY.\nPowrót: po wezwaniu Welesa lub podczas Dziadów wiosennych.\nSpłata wymaga rzeczywistej ceny."
 bp_book.0010.desc_paid:0 "Przywrócono imiona zmarłych lub publicznie uznano dawną winę. Weles otrzymał to, czego żądał, a ciężar długu przestał ciążyć na rodzie.\n\nSTAN: DŁUG SPŁACONY.\nPamięć o umowie pozostaje; nowy boski dar może kiedyś otworzyć kolejne zobowiązanie."
 bp_book.0010.desc_none:0 "Nie ma obecnie zapisanego długu tej dynastii wobec Welesa. To nie znaczy, że bóg nigdy nie przemówi. Zanim zażąda zapłaty, musi jednak zawiązać się historia, którą obie strony zapamiętają.\n\nSTAN: BRAK OTWARTEJ UMOWY."
 bp_book.0010.back:0 "Powróć do prób Welesa."
 bp_test.9002.weles_debt:0 "[TEST] Dług Welesa, druga część"
 bp_test.9004.t:0 "[TEST] Dług Welesa"
 bp_test.9004.desc:0 "Tu można wymusić drugą część opowieści lub sprawdzić dług odziedziczony przez ród. Używaj wyłącznie na kopii zapisu, bo opcje mają rzeczywiste konsekwencje dla pieniędzy, ziemi i postaci."
 bp_test.9004.new_debt:0 "Utwórz próbny dług i pokaż jego pierwsze rozliczenie."
 bp_test.9004.inherited:0 "Utwórz próbny dług odziedziczony przez dynastię."
 bp_test.9004.book:0 "Otwórz Księgę długów."
 bp_test.9004.back:0 "Wróć do listy testów."
 bp_weles_restored_graves_modifier:0 "Imiona przywrócone ziemi"
 bp_weles_restored_graves_modifier_desc:0 "Zwrócona cześć majątku i odbudowane groby poprawiają stosunki z poddanymi i gospodarowanie ziemią."
 bp_weles_barren_fields_modifier:0 "Milczące pola Welesa"
 bp_weles_barren_fields_modifier_desc:0 "Ziemia poddana niełasce Welesa daje mniejsze dochody i rozwija się wolniej."
 bp_weles_debt_shadow_modifier:0 "Cień wierzyciela"
 bp_weles_debt_shadow_modifier_desc:0 "Nierozliczony dług Welesa osłabia skarbiec i zdolności władcy."
 bp_weles_public_confession_modifier:0 "Prawda o przodkach"
 bp_weles_public_confession_modifier_desc:0 "Uznanie dawnych win przynosi wiedze, ale osłabia pozycję polityczną władcy."

 bp_weles_reckon_debt_decision:0 "Rozlicz dług Welesa"
 bp_weles_reckon_debt_decision_desc:0 "Dług spisany przez Welesa pozostaje na naszej dynastii. Można stanąć przed bogiem i rozliczyć go bez czekania na kolejne Dziady."
 bp_weles_reckon_debt_decision_tooltip:0 "Otwórz rozmowę o niespłaconym długu Welesa. Raz na 90 dni, dopóki dług nie zostanie spłacony."
 bp_weles.2013.desc_outside:0 "Żerca przynosi czarną księgę. Wśród imion rodu widnieje dawna, niespłacona umowa.\n\n„Weles pamięta dar i cenę. Skoro odziedziczyłeś bogactwo, odpowiedz również za dług”."
 bp_weles.2013.desc_outside_blood:0 "Żerca stawia przede mną dwie misy: w jednej pierścień dawnej ofiary, w drugiej ziemia ze skradzionych pól.\n\n„Krew nie wyrównała rachunku”, mówi. „Dług rodu nadal trwa”."

 bp_weles.2007.desc_debt:0 "Kiedy oczekuję kolejnego daru, wilgotna ziemia pojawia się na kamieniu ofiarnym. Z głębi korzeni odpowiada głos, który już znam.\n\n„Nie otworzę drugiej księgi, dopóki nie zamkniesz pierwszej. Bogactwo, które otrzymałeś, nadal ma swoją cenę”.\n\nŻerca pochyla głowę. Otrzymuję tylko mniejszą przychylność. Dług nie został zapomniany."
 bp_perun_decision:0 "Święto Peruna: Pod gromem"
 bp_perun_decision_desc:0 "Święto Peruna trwa od 20 do 27 lipca. Burza, przysięga i próba męstwa. Święto nadejdzie niezależnie od władcy. Obrzęd można odprawić tylko raz w danym okresie."
 bp_perun_decision_tooltip:0 "Otwórz wydarzenie święta i wybierz przebieg obrzędu."
 bp_perun_decision_confirm:0 "Rozpocznij doroczny obrzęd Peruna"
 bp_harvest_decision:0 "Święto Plonów: Co daje ziemia"
 bp_harvest_decision_desc:0 "Od 28 sierpnia do 5 września ziemia domaga się sprawiedliwego podziału plonów. Święto nadejdzie niezależnie od władcy. Obrzęd można odprawić tylko raz w danym okresie."
 bp_harvest_decision_tooltip:0 "Otwórz wydarzenie święta i wybierz przebieg obrzędu."
 bp_harvest_decision_confirm:0 "Rozpocznij obrzęd Święta Plonów"
 bp_autumn_decision:0 "Dziady jesienne: Ci, którzy wracają"
 bp_autumn_decision_desc:0 "Od 25 do 31 października przodkowie przychodzą po pamięć, prawdę i niespłacone długi. Święto nadejdzie niezależnie od władcy. Obrzęd można odprawić tylko raz w danym okresie."
 bp_autumn_decision_tooltip:0 "Otwórz wydarzenie święta i wybierz przebieg obrzędu."
 bp_autumn_decision_confirm:0 "Rozpocznij obrzęd Dziadów jesiennych"
 bp_szczodre_decision:0 "Szczodre Gody: Światło powraca"
 bp_szczodre_decision_desc:0 "Od 21 grudnia do 6 stycznia trwa jeden nieprzerwany okres przesilenia zimowego. Święto nadejdzie niezależnie od władcy. Obrzęd można odprawić tylko raz w danym okresie."
 bp_szczodre_decision_tooltip:0 "Otwórz wydarzenie święta i wybierz przebieg obrzędu."
 bp_szczodre_decision_confirm:0 "Rozpocznij obrzęd Szczodrych Godów"
 bp_perun_call_storm_decision:0 "Wezwij błogosławieństwo Peruna"
 bp_perun_call_storm_decision_desc:0 "Perun obdarzył cię siłą, lecz zachował ją na godzinę próby. Możesz wezwać jego grom, gdy twoje wojska prowadzą wojnę. Dar wygaśnie, jeśli nie zostanie wykorzystany w ciągu dwóch lat."
 bp_perun_call_storm_decision_tooltip:0 "Uaktywnij silną premię wojenną na 12 miesięcy."
 bp_perun_call_storm_decision_confirm:0 "Wezwij grom Peruna"
 bp_announcement.1009.t:0 "Święto Peruna: Pod gromem"
 bp_announcement.1009.desc:0 "20–27 lipca. Nadszedł czas Peruna. Uderzenie pioruna rozdarło dąb nad miejscem zebrań, a wojowie czekają na twoje słowo. Samo święto trwa niezależnie od tego, co postanowisz. Możesz stanąć do obrzędu teraz, później, albo świadomie odmówić."
 bp_announcement.1010.t:0 "Święto Plonów: Co daje ziemia"
 bp_announcement.1010.desc:0 "28 sierpnia – 5 września. Na polach stoją snopy, a spichlerze zapełniają się ziarnem. Mokosz chce wiedzieć, kto zasiądzie do stołu, a kto odejdzie głodny. Możesz rozpocząć obrzęd teraz, wrócić do niego w terminie lub zaniechać."
 bp_announcement.1011.t:0 "Dziady jesienne: Ci, którzy wracają"
 bp_announcement.1011.desc:0 "25–31 października. Wieczorem droga do mogił niknie we mgle. Kapłan wypowiada imiona przodków, ale jedno z nich nie znajduje odpowiedzi wśród żywych. Święto nadejdzie bez twojej zgody. Ty wybierasz, czy stawisz mu czoła."
 bp_announcement.1012.t:0 "Szczodre Gody: Światło powraca"
 bp_announcement.1012.desc:0 "21 grudnia – 6 stycznia. Rozpoczyna się najdłuższa noc. Ogień w grodzie zapłonie bez względu na to, czy władca weźmie w obrzędzie udział. Ten okres trwa również po Nowym Roku, lecz wolno odprawić go tylko raz."
 bp_perun.9101.t:0 "Grom nad dębem"
 bp_perun.9101.desc:0 "Burza przyszła z północy, choć rano niebo było czyste. U podnóża starego dębu leżą osmolone gałęzie, a wojowie czekają w milczeniu. Żerca wskazuje włócznie i tarcze złożone przed posągiem. „Perun słucha przysiąg”, mówi, „ale pamięta przede wszystkim to, co uczyniono później”."
 bp_perun.9101.a:0 "Oddaję broń i siedemdziesiąt sztuk złota na utrzymanie straży."
 bp_perun.9101.b:0 "Płacę przysięgą, która będzie kosztować mnie sławę."
 bp_perun.9101.c:0 "Nie zamierzam składać obietnic podczas burzy."
 bp_perun.9102.t:0 "Przysięga bez świadków"
 bp_perun.9102.desc_war:0 "Wiadomość z obozu dociera przed zmrokiem: przeciwnik naciera na nasze straże. Zbrojni spoglądają na ciebie, bo żaden rozkaz nie zwolni ich z ryzyka. Żerca pyta, czy odpowiesz własnym honorem za tych, których posyłasz ku śmierci."
 bp_perun.9102.desc_peace:0 "Nie ma dziś wojny, lecz są strażnice wymagające odbudowy i ludzie, którzy będą ich bronić, gdy zima odejdzie. Żerca wskazuje na granicę. „Gdy nie ma wroga, odwaga polega nieraz na podjęciu ciężaru, którego nikt nie widzi”."
 bp_perun.9102.a:0 "Biorę odpowiedzialność za los moich wojów."
 bp_perun.9102.b:0 "Oddaję część chwały na naprawę strażnic i ochronę poddanych."
 bp_perun.9102.c:0 "Niech ludzie mierzą się z niebezpieczeństwem beze mnie."
 bp_perun.9103.t:0 "Ten, który został na drodze"
 bp_perun.9103.desc:0 "Pod osłoną deszczu wraca zwiadowca. Na ramieniu podtrzymuje rannego, którego towarzysze zostawili za oddziałem. Żaden kronikarz nie zapisze jego imienia. Żerca jednak patrzy na ciebie uważnie: trzeciej próby Peruna nie rozstrzyga słowo ani dar, lecz czyn wobec człowieka bez znaczenia na dworze."
 bp_perun.9103.a:0 "Opatrzcie go na mój koszt. Nikt nie zostaje w błocie."
 bp_perun.9103.b:0 "Niech jego rodzina otrzyma publiczne zadośćuczynienie."
 bp_perun.9103.c:0 "Jego los posłuży innym za ostrzeżenie."
 bp_perun.9104.t:0 "Milczenie gromowładnego"
 bp_perun.9104.desc:0 "Ogień dopala się pod dębem. Złoto i żelazo zniknęły z twojego skarbca, przysięga została wypowiedziana, a ranny znalazł opiekę. Teraz niczego nie możesz już wymusić. Burza przesuwa się nad dolinę i na chwilę słychać tylko deszcz na tarczach."
 bp_perun.9104.a:0 "Wysłucham odpowiedzi, jakakolwiek będzie."
 bp_perun.9105.t:0 "Grom oddany w twoje ręce"
 bp_perun.9105.desc_war:0 "Piorun uderza w skałę za szeregiem wojowników. Nikt nie pada, choć wszyscy przez chwilę widzą własny cień na ziemi. Na ostrzach mieczy pojawia się jasna poświata. Żerca przyklęka. „Perun daje ci przewagę, lecz ani jednej tarczy nie poniesie za ciebie”."
 bp_perun.9105.desc_peace:0 "Z chmur spada ostry grom, który nie trafia w żaden dom. Żerca zbiera zwęgloną drzazgę z dębu i oddaje ją tobie. „Zachowaj ten znak. Gdy nadejdzie wojna, będziesz mógł wezwać przyrzeczoną pomoc. Jeśli będziesz zwlekać zbyt długo, pamięć ognia wygaśnie”."
 bp_perun.9105.a:0 "Przyjmuję dar i jego odpowiedzialność."
 bp_perun.9106.t:0 "Iskra zamiast burzy"
 bp_perun.9106.desc:0 "Niebo nie otwarło się nad tobą. Jedynie wiatr niesie żar ze świętego ognia i przez moment oświetla ręce wojów. Żerca nie wygląda na zawiedzionego. „Nie każda przysięga sprowadza piorun. Nieraz wystarczy, że człowiek nie złamie jej do rana”."
 bp_perun.9106.a:0 "Tego również nie zmarnuję."
 bp_perun.9107.t:0 "Gniew między chmurami"
 bp_perun.9107.desc:0 "Kiedy odwracasz się od ognia, nad obozem rozlega się huk. Żadna włócznia nie została złamana, lecz ludzie widzą, że posąg dębowy pękł wzdłuż twarzy. Żerca odwraca wzrok. Perun nie zabrał ci korony; pozostawił ci świadomość, że odmowa miała świadków."
 bp_perun.9107.a:0 "Będę żyć z konsekwencjami tej nocy."
 bp_perun.9108.t:0 "Ślad na tarczy"
 bp_perun.9108.desc_reserved:0 "Minęły miesiące. Drewniana drzazga zabrana spod dębu nadal jest ciepła w dłoni, chociaż nikt nie palił przy niej ognia. Żerca przypomina: dar Peruna czeka na wojnę, ale nie będzie czekał wiecznie."
 bp_perun.9108.desc:0 "Minęły miesiące. Na jednej z tarcz widzisz wypalone pęknięcie przypominające błyskawicę. Żołnierze opowiadają o nim jak o znaku zwycięstwa. Ty pamiętasz także rannego, którego nie pozostawiono na drodze."
 bp_perun.9108.a:0 "Perun pamięta także to, czego nie zapisano w kronikach."
 bp_harvest.9201.t:0 "Pierwszy snop"
 bp_harvest.9201.desc:0 "Pola opustoszały, lecz wzdłuż miedz stoją snopy. Z daleka dochodzi pieśń żniwiarzy, a na stole przed świętym słupem położono świeży chleb. Żerca Mokoszy przynosi dwa worki: jeden dla dworu, drugi dla głodujących. „Na końcu żniw”, mówi, „nie pytamy, ile urosło zboża, lecz do czyich rąk trafiło”."
 bp_harvest.9201.desc_hard:0 "W ziemi nadal widać blizny po zniszczeniu świętego gaju. Ziarno zebrano, lecz mniej niż oczekiwano, a żniwiarze wrócili z pól milczący. Żerca Mokoszy stawia na stole pierwszy bochen. „Bogini pamięta, jak potraktowano jej ziemię. Dzisiaj będzie patrzeć, jak potraktujesz jej ludzi”."
 bp_harvest.9201.a:0 "Złożę dar z pierwszego ziarna i własnego skarbca."
 bp_harvest.9201.b:0 "Zrzeknę się części splendoru na rzecz wspólnej uczty."
 bp_harvest.9201.c:0 "Najlepsze snopy należą do mnie."
 bp_harvest.9202.t:0 "Spichlerze pełne, misy puste"
 bp_harvest.9202.desc:0 "Przed spichlerzem stoją dwie kolejki. Pierwszą tworzą urzędnicy z pieczęciami, drugą ludzie bez butów, którzy przynieśli puste miski. Zarządca prosi, by nie zakłócać poboru danin. Żerca nie mówi nic, lecz pokazuje worek z ziarnem, które nigdy nie dotrze do wioski za lasem."
 bp_harvest.9202.a:0 "Otwieram zapasy i pokrywam niedobór z własnego złota."
 bp_harvest.9202.b:0 "Niech zarządca odda zebrane daniny tam, skąd pochodzą."
 bp_harvest.9202.c:0 "Zamknąć bramy spichlerza. Każda miara ma swoją cenę."
 bp_harvest.9203.t:0 "Ziarno na przyszłą wiosnę"
 bp_harvest.9203.desc:0 "Gdy uczta dobiega końca, przybywa wieśniaczka z prośbą o ziarno siewne. Jej pola zalała woda i jeśli teraz nie otrzyma pomocy, następnego roku nie będzie miała czego zebrać. Dworzanie radzą odprawić ją z obietnicą. Zdarzyło ci się już widzieć, ile waży obietnica złożona przy pełnym stole."
 bp_harvest.9203.desc_gaik:0 "Przybysze wspominają święty gaj, o który toczył się spór podczas Gaiku. Jego korzenie nadal trzymają wilgoć w ziemi, lecz pola za lasem zostały zalane. Wieśniaczka prosi o ziarno siewne. Żerca Mokoszy patrzy na ciebie, jakby odpowiedź znał już od wiosny."
 bp_harvest.9203.a:0 "Wydam ziarno teraz, nim będzie za późno."
 bp_harvest.9203.b:0 "Niech otrzyma zapasy z dworskich rezerw."
 bp_harvest.9203.c:0 "Jest właścicielką własnego losu. Niech sobie poradzi."
 bp_harvest.9204.t:0 "Dłoń w ziemi"
 bp_harvest.9204.desc:0 "Kiedy wieśniaczka odchodzi, żerca pochyla się nad bruzdą. Z wilgotnej ziemi wyjmuje jedno nienaruszone ziarno. Nie jest pora siewu, lecz na jego powierzchni dostrzegasz mały zielony kiełek. Nikt na placu nie ośmiela się nazwać tego przypadkiem."
 bp_harvest.9204.a:0 "Niech Mokosz sama osądzi nasze czyny."
 bp_harvest.9205.t:0 "Ziemia odpowiada"
 bp_harvest.9205.desc:0 "Przez noc zboże rośnie na ugorze, na którym od pokoleń nic się nie udawało. Kiedy zarządca przynosi wieść, żerca nie okazuje zdziwienia. „Bogini nie policzyła bochenków. Policzyła tych, którzy zostali przy stole, choć nie przynieśli złota”. Dar obejmie ziemię, za którą osobiście odpowiadasz."
 bp_harvest.9205.a:0 "Niech ta ziemia wyda więcej, niż ktokolwiek się spodziewał."
 bp_harvest.9206.t:0 "Puste kłosy"
 bp_harvest.9206.desc:0 "Po święcie zarządca przynosi garść złocistych kłosów. Z daleka wyglądają zdrowo, lecz po przełamaniu okazują się puste. Żerca Mokoszy przesypuje plewy między palcami. „Tego ziarna nie ukradł żaden wróg”, mówi cicho."
 bp_harvest.9206.a:0 "Za pustymi kłosami przyjdzie trudny rok."
 bp_harvest.9207.t:0 "Dar skromniejszy od obietnicy"
 bp_harvest.9207.desc:0 "Na skraju pola wyrastają świeże pędy, mimo że zbiory już się skończyły. Mokosz nie odmówiła ci zupełnie, ale nie otworzyła także pełnych spichlerzy. Żerca wskazuje na ziemię. „Z tej łaski urośnie tylko tyle, ile własnymi rękami zdołacie utrzymać”."
 bp_harvest.9207.a:0 "Przyjmuję to, co zostało dane."
 bp_harvest.9208.t:0 "Drugi siew"
 bp_harvest.9208.desc:0 "Pewnego ranka znajdujesz na stole garść ciemnego ziarna przyniesionego z ziem, których nigdy dotąd nie uważano za żyzne. Rolnicy proszą o zgodę na nowy siew. Wtedy przypominasz sobie kobietę, której jesienią nie odmówiłeś pomocy."
 bp_harvest.9208.a:0 "Niech pamięć o tym zbiorze przetrwa zimę."
 bp_autumn.9301.t:0 "Noc otwartych mogił"
 bp_autumn.9301.desc:0 "Liście przykrywają ścieżkę między kurhanami. Żerca ustawia misy z jadłem, jedna po drugiej, i wypowiada imiona przodków. Z głębi lasu odpowiada trzask gałęzi. Rozpoznajesz w nim kroki, chociaż nie widać nikogo. „Wiosną przyszli z radą”, mówi żerca. „Jesienią przychodzą po rachunek”."
 bp_autumn.9301.desc_debt:0 "Przed twoim przybyciem ktoś położył na mogile czerwony sznur, znak niespłaconego długu Welesa. Żerca nie chce go dotknąć. „To nie ja wezwałem dziś przodków. Twoja dynastia dała im powód, by przyszli sami”. Na ścieżce pomiędzy kurhanami słychać cichy szelest."
 bp_autumn.9301.a:0 "Oddajmy zmarłym należne dary i wypowiedzmy ich imiona."
 bp_autumn.9301.b:0 "Oddam część honoru rodu, by uczcić zapomnianych."
 bp_autumn.9301.c:0 "To żywi rządzą królestwem, nie umarli."
 bp_autumn.9302.t:0 "Imię, którego nikt nie wypowiedział"
 bp_autumn.9302.desc:0 "Między ogniskami staje postać o twarzy znanej z dawnych malowideł. Nikt jej nie przedstawia. Kładzie na ziemi pustą miskę, a wokół cichną rozmowy. „Jedno imię skreślono z rodowej opowieści. Dlaczego?”."
 bp_autumn.9302.desc_debt:0 "Przy ognisku pojawia się zmarły krewny. Nie prosi o jadło. Dotyka czerwonego sznura położonego na mogile i wskazuje dłonie, w których Weles pozostawił swój dług. „Dary można policzyć”, mówi. „Krzywdę trzeba nazwać”."
 bp_autumn.9302.desc_paid:0 "Pomiędzy drzewami ukazuje się postać przodka. Kładzie na ziemi pęknięty pierścień, dawny znak długu Welesa, i przesuwa go ku tobie. „Spłata nie przywróci życia”, mówi, „ale przywraca prawo do pamięci”."
 bp_autumn.9302.a:0 "Przyznaję przed rodem, że milczenie również jest winą."
 bp_autumn.9302.b:0 "Niech Weles sam upomni się o to, co mu jesteśmy winni."
 bp_autumn.9302.c:0 "Każę spalić stare zapisy. Dość tych oskarżeń."
 bp_autumn.9303.t:0 "Kto pozostanie przy mogile?"
 bp_autumn.9303.desc:0 "Przed świtem na ścieżkę wychodzi posłaniec z pobliskiej wsi. Mogiłę jednego z twoich przodków rozkopano w poszukiwaniu kamienia do budowy. Mieszkańcy proszą o nowe miejsce pamięci. Możesz oddać im pracę ludzi i pieniądze albo zaszczyt, którego nikt nie chce już dzierżyć."
 bp_autumn.9303.a:0 "Odbuduję mogiłę i wynagrodzę tych, którzy przy niej czuwali."
 bp_autumn.9303.b:0 "Niech mój ród wyrzeknie się przywileju zdobytego na tej krzywdzie."
 bp_autumn.9303.c:0 "Postawcie zwykły kamień. Nie będziemy do tego wracać."
 bp_autumn.9304.t:0 "Sąd, którego nie prowadzi król"
 bp_autumn.9304.desc:0 "Przed kamieniem stają cienie ludzi, których imiona wymieniono podczas obrzędu. Jeden wskazuje drogę do grodu, drugi puste miejsce przy stole, trzeci nie podnosi głowy. Żerca odsuwa się, pozostawiając cię samego. Odpowiedź Welesa przychodzi bez świadków, których mógłbyś przekupić."
 bp_autumn.9304.desc_debt:0 "Wszystkie cienie odwracają twarze ku czerwonej nici leżącej na mogile. Nie pytają o twoje dary. Pytają o dług, który ród nadal nosi. Możesz wynieść stąd tylko część wiedzy przodków, dopóki dawny rachunek pozostaje otwarty."
 bp_autumn.9304.a:0 "Przyjmę ich sąd bez ukrywania prawdy."
 bp_autumn.9305.t:0 "Wiedza pod popiołem"
 bp_autumn.9305.desc:0 "Przy wygasłym ognisku znajdujesz drewnianą tabliczkę, której wcześniej nie było. Na jednej stronie wyryto sposób ustawienia wojów w wąskiej dolinie, na drugiej spis dawnych powinności ziemskich. Przodkowie nie darują ci korony ani zwycięstwa. Pozostawiają wiedzę, która może zmienić sposób, w jaki będziesz rządzić."
 bp_autumn.9305.a:0 "Zachowam naukę wojenną i przekażę ją dowódcom."
 bp_autumn.9305.b:0 "Zachowam naukę zarządzania ziemią i przekażę ją urzędnikom."
 bp_autumn.9306.t:0 "Okruch pamięci"
 bp_autumn.9306.desc:0 "Na popiele ogniska ktoś pozostawił pojedynczy znak, może pierwszą literę imienia. Nie jest to pełna łaska przodków, lecz więcej, niż mógłbyś uzyskać rozkazem. Żerca prosi, byś zachował znak w Księdze Bogów."
 bp_autumn.9306.desc_debt:0 "Wśród popiołu znajduje się tylko kawałek zwęglonego drewna. Żerca mówi, że przodkowie nie odmówili wszystkiego. „Otwarty dług Welesa przesłania większy dar. Dopóki pozostaje, pamięć mówi do was półgłosem”."
 bp_autumn.9306.a:0 "Zachowam choć ten fragment ich pamięci."
 bp_autumn.9306.b:0 "Muszę wrócić do sprawy długu Welesa."
 bp_autumn.9307.t:0 "Ci, którym odmówiono imienia"
 bp_autumn.9307.desc:0 "Nocą słudzy skarżą się, że nie mogą zasnąć. W sieni słyszą czyjeś kroki, a na progach znajdują mokrą ziemię z mogił. Żaden z mieszkańców nie widział przybysza. Żerca wzywa cię do ciszy. „Przodkowie nie zawsze krzyczą. Czasem po prostu przestają odchodzić”."
 bp_autumn.9307.a:0 "Nie zdołam uciszyć wszystkich głosów."
 bp_autumn.9308.t:0 "Droga pod korzenie"
 bp_autumn.9308.desc:0 "Mogiła rozstępuje się ledwie na szerokość dłoni. Spod ziemi wychodzi zimne powietrze i zapach wilgotnego drewna. To ten sam znak, który Weles pozostawił waszej dynastii. Jeśli chcesz rozliczyć dług, nie musisz już czekać na jego następne wezwanie."
 bp_autumn.9308.a:0 "Pójdę tam, gdzie prowadzi dług."
 bp_szczodre.9401.t:0 "Najdłuższa noc"
 bp_szczodre.9401.desc:0 "Przed wieczorem żerca każe roznieść po grodzie żar z jednego ognia. W domach znikają ostatnie płomienie starego roku, a ludzie czekają na nowy. Nad zaśnieżonym dziedzińcem stoi dym. „Słońce wróci”, mówi starzec, „lecz nie wszyscy, którym tego życzymy, doczekają świtu”."
 bp_szczodre.9401.a:0 "Utrzymam ogień dla całego grodu."
 bp_szczodre.9401.b:0 "Przekażę żercy honor mojego domu na ten obrzęd."
 bp_szczodre.9401.c:0 "W moim domu nic nie będzie gaszone na rozkaz żercy."
 bp_szczodre.9402.t:0 "Dwanaście miejsc przy stole"
 bp_szczodre.9402.desc:0 "W wielkiej sali stoją stoły przykryte płótnem. Wśród gości rozpoznajesz krewnych, doradców i wojów, lecz przy końcu ławy przygotowano także miejsca dla tych, którzy zmarli w minionym roku. Za drzwiami czekają głodni podróżni. Zarządca pyta, czy ma ich odprawić."
 bp_szczodre.9402.a:0 "Otworzyć wrota. Dzisiaj nikogo nie odeślę głodnym."
 bp_szczodre.9402.b:0 "Niech goście dostaną miejsce przy stole kosztem dworskich przywilejów."
 bp_szczodre.9402.c:0 "Zamknąć drzwi. To uczta mojego rodu."
 bp_szczodre.9403.t:0 "Gość, którego nie zaproszono"
 bp_szczodre.9403.desc:0 "Gdy najstarszy z gości wznosi toast, jeden z pustych talerzy przesuwa się po stole. W izbie cichnie śmiech. Starszyzna patrzy na ciebie, czekając na imię zmarłego, któremu zostawiono to miejsce. Musisz wybrać, co zabierzesz ze starego roku do następnego."
 bp_szczodre.9403.desc_debt:0 "Przy pustym miejscu pojawia się cień, a na talerzu leży czerwony sznur. Weles nie usiadł między gośćmi, lecz jego dług przybył na ucztę. Żerca mówi cicho: „Światło nowego roku nie zmaże rachunku, którego nie spłacono w starym”."
 bp_szczodre.9403.desc_paid:0 "Przy pustym miejscu ktoś postawił starą, pękniętą obręcz. Poznajesz znak długu Welesa, który twoja dynastia już rozliczyła. Tym razem nikt nie wyciąga dłoni po należność. Żerca zachęca, byś wypowiedział imiona tych, którzy nie zasiądą już przy tym stole."
 bp_szczodre.9403.a:0 "Wypowiem ich imiona i obietnicę, której jeszcze nie spełniłem."
 bp_szczodre.9403.b:0 "Weles upomina się o spłatę. Zmierzę się z jego długiem."
 bp_szczodre.9403.c:0 "Przenieść talerz. Nie pozwolę zmarłym psuć uczty."
 bp_szczodre.9404.t:0 "Obietnica przy ostatnim ogniu"
 bp_szczodre.9404.desc:0 "Śnieg zasypuje ślady na dziedzińcu. Dzieci przynoszą do paleniska mokre drewno, którego nie sposób rozpalić. Starzec prosi o zapasy suchego drzewa oraz ludzi do naprawy dachów. Nikt nie nazywa tego trzecią próbą. Wiesz jednak, że bogowie odróżniają obietnicę wypowiedzianą przy stole od tej dotrzymanej na mrozie."
 bp_szczodre.9404.a:0 "Zapłacę za opał i naprawy, zanim przyjdzie świt."
 bp_szczodre.9404.b:0 "Oddam część dworskiego splendoru na zimowe schronienie."
 bp_szczodre.9404.c:0 "Obiecałem tyle, ile mogłem. Więcej nie zrobię."
 bp_szczodre.9405.t:0 "Światło wraca"
 bp_szczodre.9405.desc:0 "Jeszcze przed świtem na wschodzie pojawia się wąska smuga złota. Rozprzestrzenia się szybciej, niż nakazuje pora roku, rozjaśniając dom po domu. Ludzie wychodzą z sieni i stają w śniegu. Żerca mówi tylko: „Otworzyliście drzwi, zanim otworzyło się niebo”. Możesz skierować wielką łaskę ku dworowi albo ku ziemi, której strzeżesz."
 bp_szczodre.9405.a:0 "Niech odrodzi się zdolność mojego dworu do rządzenia."
 bp_szczodre.9405.b:0 "Niech odrodzą się pola i osady mojej ziemi."
 bp_szczodre.9406.t:0 "Blask w szczelinie okiennicy"
 bp_szczodre.9406.desc:0 "Na ścianie sali pojawia się wąski pas porannego światła. Nikt nie widzi w nim wielkiego cudu. Żerca jednak skłania głowę. „Dobrze, że zostawiliście ogień dla następnych pokoleń. Nie każdy dar musi odmienić cały kraj”."
 bp_szczodre.9406.desc_debt:0 "Na stole pozostał jeden talerz, którego nikt nie tknął. Żerca wskazuje czerwony sznur i mówi, że bogowie nie zapomnieli o uczcie, ale dług Welesa nadal ciąży na rodzie. Pełniejsza łaska poczeka na spłatę, która nie znika wraz z końcem roku."
 bp_szczodre.9406.a:0 "Zachowamy choć to światło."
 bp_szczodre.9407.t:0 "Zimny próg"
 bp_szczodre.9407.desc:0 "Nad ranem w grodzie wygasają kolejne paleniska. Strażnicy próbują rozpalić je na nowo, ale drewno dymi i czernieje. W śniegu pojawiają się ślady ludzi, których odprawiono od bramy. Żerca nie wzywa bogów ponownie. „Już usłyszeli odpowiedź”, mówi."
 bp_szczodre.9407.a:0 "Przejdziemy tę zimę bez ich wielkiej łaski."
 bp_szczodre.9408.t:0 "Pierwszy świt nowego roku"
 bp_szczodre.9408.desc:0 "Kilka tygodni później przychodzi wiadomość z ziem należących do twojego rodu. Ludzie odbudowują domy, które jesienią uznano za stracone, a spichlerze otwierają się bez rozkazu. Część dworzan mówi o roztropnym zarządzaniu. Ty pamiętasz chwilę, gdy w najdłuższą noc światło weszło do sali szybciej, niż powinno."
 bp_szczodre.9408.a:0 "Tak zaczyna się kolejny rok pamięci."
 bp_book.0001.i:0 "Kronika Świąt: jesień i przesilenie"
 bp_book.0007.f:0 "Przejdź do części trzeciej kroniki"
 bp_book.0011.t:0 "Kronika Świąt, część trzecia"
 bp_book.0011.desc:0 "Żerca rozkłada ostatnią kartę kalendarza. Przeczytasz tu cztery święta drugiej połowy roku, wraz z pamięcią o odprawionym obrzędzie, odmowie lub minionym terminie. Pamięć dynastii pozostaje również wtedy, gdy umrze władca, który dokonał wyboru."
