 bp_book.0011.t:0 "Chronicle of Festivals, Part Three"
 bp_book.0011.desc:0 "The priest unfolds the final leaf of the calendar. Here lie the four feasts of the latter half of the year, recording whether each rite was performed, refused, or missed. The memory of the dynasty survives the ruler who made the choice."
