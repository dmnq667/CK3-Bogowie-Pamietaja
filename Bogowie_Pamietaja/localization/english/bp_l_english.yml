 bp_book.0005.t:0 "Festival Calendar | The Gods Remember"
 bp_book.0005.desc:0 "CALENDAR OF RITES\n\nGROMNICA: February 2–8\nVELES WEEK: February 9–15\nSPRING NEW YEAR: March 9–14\nSPRING EQUINOX: March 21–27\nGAIK: April 30 – May 1\nSPRING ANCESTORS: May 2–8\nSTADO: May 29 – June 4\nKUPALA NIGHT: June 20–23\nPERUN: July 20–27\nHARVEST: August 28 – September 5\nAUTUMN ANCESTORS: October 25–31\nWINTER SOLSTICE: December 21 – January 6\n\nFeasts occur regardless of the ruler. During each season you choose whether to perform the rite. Each can be performed only once per season, including seasons that cross the new year. Their history appears across three chronicle pages."
