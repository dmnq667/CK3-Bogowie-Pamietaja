 bp_calendar.8101.t:0 "Gromnica: następny okres"
 bp_calendar.8101.desc:0 "Termin święta Gromnica przypada na 2-8 lutego. Możesz teraz zaakceptować udział w najbliższym okresie obchodów. Gdy nadejdzie termin, samodzielnie uruchomisz wydarzenie z menu Decyzje. Zapis nie rozpoczyna obrzędu i nie liczy się jako jego odprawienie."
 bp_calendar.8101.desc_registered:0 "Udział w przyszłym okresie został już zapisany. Kiedy nadejdzie termin święta, samodzielnie uruchomisz obrzęd z menu Decyzje. Akceptacja nie zużywa limitu obrzędu. Termin: 2-8 lutego."
 bp_calendar.8111.t:0 "Gromnica: obrzęd już rozpoczęty"
 bp_calendar.8111.desc:0 "Ten obrzęd został już rozpoczęty w bieżącym okresie przez Twoją dynastię. Ponowne otwarcie nie wywoła wydarzenia ani nie przyzna kolejnej łaski. Następny obrzęd będzie możliwy w kolejnym roku."
