l_english:
 bp_040_revenge.t:0 "Blood Demands Payment"
 bp_040_revenge.desc:0 "Months have passed since your harsh order. Those who suffered have gathered followers and now threaten revenge. You may pay for peace, confront them yourself or accept the consequences of unrest."
 bp_040_revenge.desc_target:0 "Months after your brutal order, the injured family's supporters threaten to murder [bp_040_revenge_target.GetTitledFirstName], a real member of your court. You may pay for protection, ignore their threat or risk your own life."
 bp_040_revenge.a:0 "Buy peace and protection (150 gold; avert the attack)."
 bp_040_revenge.b:0 "Ignore the threat (65% risk of a courtier's death)."
 bp_040_revenge.c:0 "Face the avengers personally (30% risk of the ruler's death)."
 bp_040_revenge.d:0 "Suppress the unrest (county damage and stress)."
 bp_040_aftermath.t:0 "Blood Begets Blood"
 bp_040_aftermath.desc:0 "Almost a year has passed since the murder committed in an earlier act of revenge. The victim's relatives still demand justice. You may compensate them, retaliate or risk your own life to end the feud."
 bp_040_aftermath.a:0 "Pay compensation (180 gold; reconciliation and relief)."
 bp_040_aftermath.b:0 "Retaliate (+130 gold; more dread and years of danger)."
 bp_040_aftermath.c:0 "Face the last trial (25% chance of the ruler's death)."
 bp_040_gromnica.t:0 "Gromnica — Two Villages in the Snow"
 bp_040_gromnica.desc:0 "During Gromnica a blizzard isolates two villages. They have almost no fuel, and your guards can send only one convoy. The choice is yours: rescue the villagers or preserve your resources for the fortress."
 bp_040_gromnica.desc_compassionate:0 "Families are freezing in the two villages cut off by a blizzard. You know that sending help will drain your treasury, yet abandoning them will leave lasting wounds."
 bp_040_gromnica.desc_callous:0 "A blizzard isolates two villages. Your steward sees a chance to keep their supplies and increase the taxes. The villagers ask for rescue, but the decision lies entirely with you."
 bp_040_gromnica.a:0 "Rescue the villages (80 gold; growth and Mokosh's favor)."
 bp_040_gromnica.b:0 "Keep the supplies (+75 gold; hardship and later vengeance)."
 bp_040_gromnica.c:0 "Strengthen the garrison (prestige and military strength; stress)."
 bp_040_weles.t:0 "Seven Nights of Veles — The Price of Peace"
 bp_040_weles.desc:0 "During the winter rites, a priest brings Veles's offer: relief from suffering and an overflowing treasury, in exchange for a debt the god will personally collect months from now. You may instead designate an actual prisoner for sacrifice or reject the bargain."
 bp_040_weles.desc_brave:0 "You are known for courage, but no sword can defeat sleepless nights. Veles offers wealth and freedom from stress, then promises to return for payment. Breaking the oath may cost your life."
 bp_040_weles.desc_craven:0 "Fear has robbed you of sleep. Veles offers riches and relief in exchange for an inevitable demand several months hence. If you break the oath, the god himself may kill you."
 bp_040_weles.a:0 "Accept the pact (-100 stress, +250 gold; Veles will return)."
 bp_040_weles.b:0 "Designate a real adult prisoner for sacrifice."
 bp_040_weles.c:0 "Reject the bargain. I will owe the god nothing."
 bp_040_spring.t:0 "Spring New Year — Grain for the Living"
 bp_040_spring.desc:0 "The winter left little grain. Your soldiers demand provisions, but the villagers need seed for their fields. There is not enough for everyone. Feeding the army may bring famine and the goddess's anger."
 bp_040_spring.desc_compassionate:0 "The villagers' children await spring sowing, but your warriors demand the remaining grain. Your decision will determine whether the land can recover."
 bp_040_spring.desc_callous:0 "Your warriors want grain, and the stores reserved for sowing can be seized with one order. The soldiers will be stronger; the suffering will fall on the villages."
 bp_040_spring.a:0 "Preserve the seed (75 gold; strong development)."
 bp_040_spring.b:0 "Take the grain for my soldiers (+120 gold, power; famine and Mokosh's judgment)."
 bp_040_spring.c:0 "Divide the stores (smaller boon; loss of prestige)."
 bp_040_jare.t:0 "Jare Gody — Peace or Blood"
 bp_040_jare.desc:0 "During the spring celebration a feud erupts between rival families. Weapons are drawn despite an oath of peace. You may purchase reconciliation, permit bloodshed or leave the feud unresolved."
 bp_040_jare.desc_target:0 "[bp_040_target.GetTitledFirstName], one of your courtiers, has been accused of taking part in an attack during Jare Gody. The evidence is uncertain. You may restore peace, execute this real person or leave the feud unresolved."
 bp_040_jare.desc_brave:0 "Two factions are ready to fight in a sacred place. Your followers expect you to end the feud. An execution may inspire fear but also lasting revenge."
 bp_040_jare.desc_craven:0 "Two factions threaten bloodshed. You would rather leave the decision to others, but your silence may cost lives."
 bp_040_jare.a:0 "Buy peace between the families (90 gold; loyalty and lower stress)."
 bp_040_jare.b:0 "Execute [bp_040_target.GetTitledFirstName] (real death, tyranny and revenge)."
 bp_040_jare.c:0 "Refuse to intervene (prestige now; a lasting feud)."
 bp_040_gaik.t:0 "Gaik — Fire in the Sacred Grove"
 bp_040_gaik.desc:0 "Your steward wishes to fell the sacred grove for fortifications. Villagers resist and the first houses are burning. You can spare the grove, profit from the timber or risk your own life among the combatants."
 bp_040_gaik.desc_compassionate:0 "Smoke rises from the grove, and villagers call for help. Your steward demands timber for the defenses. Saving the people means defying your own officer."
 bp_040_gaik.desc_callous:0 "The grove could yield valuable timber, but the villagers refuse to allow it. You may protect them, crush their resistance or intervene personally at mortal risk."
 bp_040_gaik.a:0 "Protect the grove (peace, Mokosh's favor; -70 prestige)."
 bp_040_gaik.b:0 "Order the felling (+150 gold; lasting damage and revenge)."
 bp_040_gaik.c:0 "Intervene personally (25% chance of the ruler's death)."
 bp_040_dziady.t:0 "Spring Dziady — An Ancestral Wrong"
 bp_040_dziady.desc:0 "During the rites, descendants of a family dispossessed by your ancestors come to demand their land. They bring written evidence. You can make restitution, destroy the document or publicly admit the family's guilt."
 bp_040_dziady.desc_blood:0 "The relatives of someone killed by your order join the Dziady rites. They demand the truth about that death and compensation for an older wrong. Your answer may end the feud or bring harm to your family."
 bp_040_dziady.desc_compassionate:0 "The descendants of a dispossessed family stand before you. You did not commit your ancestors' crime, but you can repair its consequences."
 bp_040_dziady.desc_callous:0 "The former owners' descendants demand restitution. Their documents may be genuine, but you now wield the power. Pay them, burn the evidence or admit the family wrong."
 bp_040_dziady.a:0 "Restore their claim (125 gold; peace and Veles's favor)."
 bp_040_dziady.b:0 "Destroy the evidence (+120 gold, dread; later revenge)."
 bp_040_dziady.c:0 "Confess the family's guilt (prestige and income lost; reconciliation)."
 bp_040_stado.t:0 "Stado — Blood at the Feast"
 bp_040_stado.desc:0 "Warriors of two rival groups start fighting during the festival. One man lies wounded, and the others demand immediate judgment. You may reconcile them, order an execution or allow the feud to grow."
 bp_040_stado.desc_target:0 "A man has died at the feast, and the courtiers accuse [bp_040_target.GetTitledFirstName] of taking part in the assault. Guilt has not been established. You may seek peace or execute a real courtier, whose relatives will remember."
 bp_040_stado.desc_brave:0 "Weapons are drawn at the festival table. The injured call for help, while the warriors demand a judgment. A swift execution may silence one side and provoke the other."
 bp_040_stado.desc_craven:0 "The first blows fall during the feast. You wish someone else would intervene, but every warrior awaits your decision."
 bp_040_stado.a:0 "Stop the fighting and proclaim peace (prestige cost, loyalty)."
 bp_040_stado.b:0 "Execute [bp_040_target.GetTitledFirstName] (real death, +35 dread, revenge)."
 bp_040_stado.c:0 "Let the warriors settle it (80 gold; unrest and revenge)."
 bp_040_kupala.t:0 "Kupala Night — The Flooded River"
 bp_040_kupala.desc:0 "After the night rites the river bursts its banks. The nearby settlements are threatened. If a member of your court is in danger, saving that person may require you to risk your own life."
 bp_040_kupala.desc_target:0 "The flooded river sweeps away [bp_040_target.GetTitledFirstName], a member of your court. You can dive into the torrent, send your guards or refuse to help. Your own intervention could cost your life."
 bp_040_kupala.desc_brave:0 "A sudden flood interrupts Kupala Night. Your courage could save another life, but the current may claim your own. No one can command you to enter the water."
 bp_040_kupala.desc_craven:0 "The river floods the villages after the festival. People cry for help. You know that entering the torrent could kill you, and you consider sending your guards instead."
 bp_040_kupala.a:0 "Enter the river myself (25% risk of my death; major favor on success)."
 bp_040_kupala.b:0 "Send the guards (50% risk of the courtier's death)."
 bp_040_kupala.c:0 "I will risk no one. [bp_040_target.GetTitledFirstName] will drown."
 bp_040_kupala.d:0 "Protect the villages against the flood (minor boon)."
 bp_040_perun.t:0 "Feast of Perun — The Warriors' Oath"
 bp_040_perun.desc:0 "The warriors demand that you face the dangers they have endured in your name. You may undertake a deadly trial, refuse or punish a courtier accused of breaking the oath."
 bp_040_perun.desc_target:0 "[bp_040_target.GetTitledFirstName] is accused of breaking an oath before the warriors. The evidence is incomplete, but the soldiers demand blood. You may risk your own life, refuse the trial or execute the accused."
 bp_040_perun.desc_brave:0 "Victory has made your courage famous, but now Perun demands proof that you honor the warriors' oath. You can stake your life or condemn an alleged traitor."
 bp_040_perun.desc_craven:0 "The warriors remember how you avoided danger. They now demand public courage. Refuse and suffer Perun's wrath, or undertake a trial that may kill you."
 bp_040_perun.a:0 "Undertake Perun's trial (20% chance of death; great war boon)."
 bp_040_perun.b:0 "Refuse. Let others fight (+120 gold; Perun will return in anger)."
 bp_040_perun.c:0 "Execute [bp_040_target.GetTitledFirstName] (real death, dread and feud)."
 bp_040_harvest.t:0 "Harvest — Taxes Paid in Blood"
 bp_040_harvest.desc:0 "After a raid the village cannot pay its taxes. The tax collector demands permission to confiscate everything, while starving villagers threaten rebellion. You can show mercy or collect the dues by force."
 bp_040_harvest.desc_target:0 "After the failed harvest, an official accuses [bp_040_target.GetTitledFirstName] of stealing the stores. The evidence has not been checked. You may forgive the tax, collect it by force or execute the accused."
 bp_040_harvest.desc_compassionate:0 "You see starving villagers who lack even the seed for next year. The treasury still needs money. Your decision will shape their future for years."
 bp_040_harvest.desc_callous:0 "The taxes can be collected by force. The village will suffer, but your treasury will recover. The steward warns of a revolt."
 bp_040_harvest.a:0 "Forgive the tax (100 gold; strong development and Mokosh's favor)."
 bp_040_harvest.b:0 "Collect it by force (+180 gold; hardship and revenge)."
 bp_040_harvest.c:0 "Execute [bp_040_target.GetTitledFirstName] (+200 gold; death and feud)."
 bp_040_autumn.t:0 "Autumn Dziady — The Living Demand Justice"
 bp_040_autumn.desc:0 "During Dziady a living family brings a complaint against an earlier judgment. These are no ghosts or cryptic signs. They demand restitution. You can compensate them, silence the witness or refuse."
 bp_040_autumn.desc_target:0 "[bp_040_target.GetTitledFirstName] brings a complaint about an earlier ruling during the rites. You can confess wrongdoing, execute this witness or dismiss the charge."
 bp_040_autumn.desc_blood:0 "Autumn Dziady recall a death that occurred by your order. The victim's relatives demand reparation. Another execution would deepen their feud."
 bp_040_autumn.desc_brave:0 "Your subjects bring a complaint against an earlier judgment. No one can compel you to answer, but all will see whether you dare admit an error."
 bp_040_autumn.desc_craven:0 "The people demand justice for an old wrong. You fear both the court's anger and the relatives' revenge. Will you admit responsibility or conceal it behind a new order?"
 bp_040_autumn.a:0 "Compensate the injured (100 gold; reconciliation and Veles's favor)."
 bp_040_autumn.b:0 "Silence [bp_040_target.GetTitledFirstName] by execution (death and revenge)."
 bp_040_autumn.c:0 "Burn the complaint (+100 gold; long-term danger)."
 bp_040_szczodre.t:0 "Szczodre Gody — The Right of Hospitality"
 bp_040_szczodre.desc:0 "During the winter festival, refugees seek shelter at your gates. Their pursuers offer money for their rejection. You may protect the strangers, take the payment or deliver a bloody judgment."
 bp_040_szczodre.desc_target:0 "The refugees seek hospitality, while your court accuses [bp_040_target.GetTitledFirstName] of betraying them. You do not yet know the truth. Protect the guests, execute the accused courtier or accept payment from their pursuers."
 bp_040_szczodre.desc_compassionate:0 "Freezing families ask for shelter during Szczodre Gody. Refusal may bring them disaster. Protecting them will cost money and anger your neighbors."
 bp_040_szczodre.desc_callous:0 "Their pursuers offer gold for refusing hospitality. The refugees cannot defend themselves. You may preserve the sacred custom, accept the money or terrorize your own court."
 bp_040_szczodre.a:0 "Grant protection (90 gold; powerful diplomatic benefit)."
 bp_040_szczodre.b:0 "Execute [bp_040_target.GetTitledFirstName] (death, gold and revenge)."
 bp_040_szczodre.c:0 "Refuse hospitality (+70 gold; divine anger and lasting feud)."
