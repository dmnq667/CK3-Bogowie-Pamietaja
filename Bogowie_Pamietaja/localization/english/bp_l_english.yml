 bp_weles.2011.t:0 "Names Beneath the Roots"
 bp_weles.2011.desc:0 "The night is windless. Someone has placed a bowl of wet earth in my chamber, with a rolled list of names beneath it. None appear in our court records. Each stands beside a village now held by my dynasty.\n\nA voice comes from the darkness above the beams.\n\n\"I gave you wealth because you listened to me. Now I wish to hear you. Who will remember those whom your ancestors ordered everyone to forget?\"\n\nThe priest does not move. He understood before I did: the god does not demand another tribute of silver. He demands restitution to the living."
 bp_weles.2011.a:0 "Restore their graves and compensate the living. (180 gold)"
 bp_weles.2011.b:0 "I shall confess my dynasty's crimes before the entire court."
 bp_weles.2011.c:0 "Veles can wait. I rule the land of the living."
 bp_weles.2012.t:0 "An Empty Place in the Granary"
 bp_weles.2012.desc:0 "The grain lies in locked chests, yet servants find only wet earth beneath the lids. The locks remain whole. Beneath the steps of my hall rests an old ring, the same one meant to be buried in the nameless grave.\n\n\"A debt does not disappear because you stop speaking of it,\" whispers a voice from behind the wall.\n\nI still have a choice. But another refusal will strike not my treasury, but my people's fields."
 bp_weles.2012.a:0 "Pay the higher price and restore the forgotten names. (250 gold)"
 bp_weles.2012.b:0 "Let everyone hear the truth. I will pay in shame."
 bp_weles.2012.c:0 "I yield nothing. Seal the sacred grove."
 bp_weles.2013.t:0 "An Inherited Debt"
 bp_weles.2013.desc:0 "At the spring feast of the ancestors, the priest sets down a list of the dead. Between familiar names, one appears that exists nowhere in the dynastic records.\n\n\"Veles granted wealth to your forebear,\" says the priest. \"He accepted the gift and left a debt. You bear his name upon your seal. Now the answer belongs to you.\"\n\nThe branches beyond the window sway without wind. The feast of the dead has brought the matter back among the living."
 bp_weles.2013.desc_blood:0 "At the spring feast, the priest brings two names. One belongs to a kinsman once offered to Veles. The other belongs to the man whose land our dynasty stole.\n\n\"Your predecessor believed the blood of family would settle every account,\" he says. \"Veles kept the two debts separate. Now you must answer for the other.\"\n\nTwo empty bowls stand on the table. Both fill with black earth as I reach to remove them."
 bp_weles.2013.a:0 "Make restitution to the living and honour the dead. (220 gold)"
 bp_weles.2013.b:0 "Declare our dynasty's guilt before the whole court."
 bp_weles.2013.c:0 "I owe nothing for the deeds of the dead."
 bp_weles.2014.t:0 "What the Earth Has Accepted"
 bp_weles.2014.desc_truth:0 "No one enjoys hearing of their ancestors' wrongs. Some at court will no longer meet my gaze. Others at last speak aloud the names their families were forbidden to mourn.\n\nAt dusk there is no priest beside the oak, no sacrificial offering. Only a dry branch lies beneath it, while the entire forest runs with rain. Veles says nothing. He does not need to. The debt has been paid."
 bp_weles.2014.desc_restored:0 "Along the old road, stones now bear the recovered names. Villagers arrive without orders, bringing bread, soil and light. No blood is shed.\n\nAs the last bowl is set down beside the grave, the ground beneath the oak stirs. Only then do I understand. Veles was not waiting for another death. He was waiting for remembrance."
 bp_weles.2014.a:0 "Let these names remain in our records."
 bp_book.0002.debt:0 "Read what Veles has written against my dynasty."
 bp_book.0010.t:0 "Veles: Ledger of Debts"
 bp_book.0010.desc_blood:0 "My dynasty still owes Veles a debt. He remembers the blood of a kinsman offered to him. That death cannot be undone, nor can it be counted as payment for every other wrong.\n\nSTATUS: DEBT OUTSTANDING.\nReturn: at the spring feast of the ancestors or when Veles summons us.\nA refusal may bring famine and divine displeasure."
 bp_book.0010.desc_unpaid:0 "Veles once favoured my dynasty, yet an entry remains unpaid in his ledger. The death of a ruler does not erase it.\n\nSTATUS: DEBT OUTSTANDING.\nReturn: after Veles' summons or during the spring feast of the ancestors.\nPayment requires a real sacrifice of resources or reputation."
 bp_book.0010.desc_paid:0 "The dead have been given their names or the dynasty's wrongdoing has been publicly acknowledged. Veles has accepted the account as settled.\n\nSTATUS: DEBT SETTLED.\nA future pact may create another obligation."
 bp_book.0010.desc_none:0 "No unsettled debt to Veles is currently recorded against this dynasty. The god may speak again, but a debt requires a history that both sides remember.\n\nSTATUS: NO ACTIVE PACT."
 bp_book.0010.back:0 "Return to Veles' trials."
