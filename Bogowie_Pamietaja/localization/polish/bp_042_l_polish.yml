l_polish:
 message_filter_bp_042_events_pause:0 "Gniew i Łaska Bogów — wyniki prób"
 message_filter_bp_042_events_pause_desc:0 "Powiadomienia o rzeczywistych skutkach ryzykownych wyborów; bez dodatkowej pauzy."
 bp_042_pause_rite.t:0 "Nadeszło słowiańskie święto"
 bp_042_pause_rite.desc:0 "Gra zostaje zatrzymana, abyś mógł zapoznać się z obrzędem."
 bp_042_pause_story.t:0 "Rozstrzygnięcie święta"
 bp_042_pause_story.desc:0 "Los ludzi i władcy zależy od twojego wyboru. Czas zostaje zatrzymany."
 bp_042_pause_divine.t:0 "Bogowie upominają się o swoje"
 bp_042_pause_divine.desc:0 "Wydarzenie wymaga twojej decyzji. Czas zostaje zatrzymany."
 bp_042_result_generic_good.t:0 "Próba została rozstrzygnięta"
 bp_042_result_generic_bad.t:0 "Próba zakończyła się nieszczęściem"
 bp_042_gaik_dead.t:0 "Śmierć w świętym gaju"
 bp_042_gaik_dead.desc:0 "Władca wszedł między walczących, lecz padł od śmiertelnego ciosu. Przysięgi i dobra rodu przechodzą na następcę."
 bp_042_gaik_survived.t:0 "Władca ocalał w gaju"
 bp_042_gaik_survived.desc:0 "Zdołałeś powstrzymać rozlew krwi i wrócić żywy. Twoja odwaga umocniła wojsko na dwa lata."
 bp_042_kupala_dead.t:0 "Rzeka zabrała władcę"
 bp_042_kupala_dead.desc:0 "Porwał cię wezbrany nurt. Próba ratunku zakończyła się twoją śmiercią, a rządy obejmie następca."
 bp_042_kupala_survived.t:0 "Ocaleni z wód Kupały"
 bp_042_kupala_survived.desc:0 "Wyrwałeś tonących mieszkańców z rzeki i sam powróciłeś na brzeg. Osady zyskały ochronę, a Mokosz udziela ci dwuletniego błogosławieństwa."
 bp_042_kupala_guard_failed.t:0 "Nieudany ratunek podczas Kupały"
 bp_042_kupala_guard_failed.desc:0 "Straż nie zdołała uratować zalanych osad. Utonęli ludzie, zniszczono domostwa, a na twoje sumienie spadł ciężar ich śmierci."
 bp_042_kupala_guard_saved.t:0 "Straż ocaliła mieszkańców"
 bp_042_kupala_guard_saved.desc:0 "Twoi wojowie wydobyli ludzi z powodzi i zabezpieczyli domostwa. Zyskujesz prestiż, a wspólnota pamięta o udzielonej pomocy."
 bp_042_perun_trial_dead.t:0 "Śmierć pod gromem Peruna"
 bp_042_perun_trial_dead.desc:0 "Nie przeżyłeś wojennej próby. Towarzysze zapamiętają twoją odwagę, lecz koronę obejmie następca."
 bp_042_perun_trial_survived.t:0 "Zwycięska próba Peruna"
 bp_042_perun_trial_survived.desc:0 "Przetrwałeś śmiertelną próbę i wypełniłeś przysięgę przed drużyną. Perun udziela ci wielkiej siły wojennej na dwa lata."
 bp_042_revenge_dead.t:0 "Mściciele zabili władcę"
 bp_042_revenge_dead.desc:0 "Stanąłeś naprzeciw mścicieli, lecz zginąłeś w zasadzce. Twój ród odziedziczy władzę oraz pamięć tej krwi."
 bp_042_revenge_survived.t:0 "Zemsta została odparta"
 bp_042_revenge_survived.desc:0 "Przeżyłeś starcie z mścicielami. Twoja bezwzględność wzbudza postrach, a drużyna przez trzy lata walczy skuteczniej."
 bp_042_aftermath_dead.t:0 "Ostatni wyrok krwawej waśni"
 bp_042_aftermath_dead.desc:0 "Próba zakończenia wieloletniego sporu kosztowała cię życie. Następca obejmie władzę naznaczoną dawną zbrodnią."
 bp_042_aftermath_survived.t:0 "Waśń zakończona"
 bp_042_aftermath_survived.desc:0 "Przetrwałeś ostatnią próbę i doprowadziłeś do pojednania. Zyskujesz prestiż i czteroletnią premię do dyplomacji."
 bp_042_perun_wrath_dead.t:0 "Gniew Peruna dopełniony"
 bp_042_perun_wrath_dead.desc:0 "Sprzeciwiłeś się bogu burzy, a jego wyrok odebrał ci życie. Twoja dynastia przechowa pamięć o tej klęsce."
 bp_042_perun_wrath_survived.t:0 "Perun darował życie, lecz nie winę"
 bp_042_perun_wrath_survived.desc:0 "Pozostałeś przy życiu, ale przez pięć lat ciąży na tobie niełaska Peruna. Tracisz prestiż, spokój i siłę wojenną."
 bp_042_weles_wrath_dead.t:0 "Weles odebrał zapłatę"
 bp_042_weles_wrath_dead.desc:0 "Odrzuciłeś żądanie Welesa. Bóg podziemi dopełnił wyroku i zabrał twoje życie, pozostawiając dług w pamięci rodu."
 bp_042_weles_wrath_survived.t:0 "Weles pozostawił cię przy życiu"
 bp_042_weles_wrath_survived.desc:0 "Bóg nie zabił cię, lecz obciążył na pięć lat ciężką klątwą. Ponoszysz dotkliwą utratę prestiżu i rosnący stres."
 bp_042_result_generic_good.desc:0 "Władca przeżył próbę; jej skutki zostały rozliczone."
 bp_042_result_generic_bad.desc:0 "Próba zakończyła się nieszczęściem; skutki zostały rozliczone."
 bp_042_trial_success_message_desc:0 "Władca przeżył próbę; jej skutki zostały rozliczone."
 bp_042_trial_failure_message_desc:0 "Próba zakończyła się nieszczęściem; skutki zostały rozliczone."
