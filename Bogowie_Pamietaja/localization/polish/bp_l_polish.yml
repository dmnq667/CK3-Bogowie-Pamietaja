l_polish:
 bp_book_decision:0 "Księga Bogów"
 bp_book_decision_desc:0 "Otwórz Księgę Bogów: przychylność bóstw, próby, błogosławieństwa, kalendarz i kronika świąt. Dostępna przez cały rok."
 bp_book_decision_tooltip:0 "Kalendarz, kronika obrzędów i stan przychylności bogów. Bez kosztu."
 bp_gromnica_decision:0 "Gromnica: Ostatnie światło"
 bp_gromnica_decision_desc:0 "2–8 lutego. Stań wobec znaku, który pojawił się przy ogniach Gromnicy."
 bp_gromnica_decision_tooltip:0 "2–8 lutego. Rozpocznij obrzęd Gromnicy, jeśli nie odprawiono go jeszcze w tym roku. Samo święto nadchodzi niezależnie od decyzji gracza."
 bp_weles_week_decision:0 "Tydzień Welesa: Siedem nocy"
 bp_weles_week_decision_desc:0 "9–15 lutego. Otwórz obrzęd Welesa, poznaj jego cenę i wybierz swoją drogę."
 bp_weles_week_decision_tooltip:0 "9–15 lutego. W czasie święta możesz rozpocząć obrzęd Welesa najwyżej raz."
 bp_spring_decision:0 "Wiosenny Nowy Rok: Głos ziemi"
 bp_spring_decision_desc:0 "9–14 marca. Mokosz przemawia przez ziemię, której nie da się oszukać samym słowem."
 bp_spring_decision_tooltip:0 "9–14 marca. Rozpocznij obrzęd Wiosennego Nowego Roku; święto nadchodzi niezależnie od decyzji gracza."
 bp_jare_decision:0 "Jare Gody: Pożegnanie Marzanny"
 bp_jare_decision_desc:0 "21–27 marca. Równonoc, ogień i rzeka. Zima odejdzie, lecz nie każdy dług zniknie razem z nią."
 bp_jare_decision_tooltip:0 "21–27 marca. Rozpocznij obrzęd Jarych Godów, jeśli nie odprawiono go w bieżącym cyklu."
 bp_test_decision:0 "[TEST] Bogowie pamiętają: uruchom święto"
 bp_test_decision_desc:0 "Narzędzie wyłącznie w trybie debugowania. Wywołuje wybrany obrzęd niezależnie od daty."
 bp_test_decision_tooltip:0 "Używaj na kopii zapisu. Powtarzanie testów może wielokrotnie zastosować efekty."
 bp_weles_change_offering_decision:0 "Zmień dar dla Welesa"
 bp_weles_change_offering_decision_desc:0 "Zamiast wskazywać więźnia, wróć do wyboru ofiary lub zakończ obrzęd."
 bp_weles_change_offering_decision_tooltip:0 "Powrót do rozmowy z żercą. Nie zabija ani nie zwalnia żadnej postaci."
 bp_weles_designate_offering_interaction:0 "Przeznacz na obrzęd Welesa"
 bp_weles_designate_offering_interaction_desc:0 "Wybierz tego dorosłego więźnia jako potencjalną ofiarę. Najpierw pojawi się osobne potwierdzenie. Wskazanie nie powoduje jeszcze śmierci."
 bp_gromnica.1001.t:0 "Ostatnie światło"
 bp_gromnica.1001.desc:0 "W grodzie gasną paleniska, choć drewno jest suche. Za drzwiami pustej komory płonie nieruchomy, błękitny ogień, a na progu widać ślady bosych stóp.\n\n„Gromnica nie zatrzyma tego, co nadchodzi”, ostrzega żerca. „Może zamknąć przed nim drzwi”. Z północnych osad dobiega sygnał rogu. Tam również potrzebują pomocy."
 bp_gromnica.1001.a:0 "Rozpalcie ognie przy każdej bramie. Zapłacę za straże i drewno."
 bp_gromnica.1001.b:0 "Moje ognie poczekają. Wyślijcie ludzi do północnych osad."
 bp_gromnica.1001.c:0 "Niech żerca straszy tych, którzy chcą go słuchać. Otwórzcie składy."
 bp_gromnica.1002.t:0 "Ślady pod drzwiami"
 bp_gromnica.1002.desc_fire:0 "Ognie przetrwały noc. O świcie śnieg na dziedzińcu jest czarny, choć nie spadła nań iskra. Pod drzwiami leży grudka ziemi z trzema rysami.\n\n„Był tutaj”, szepcze żerca. „Nie wszedł. Jeszcze”."
 bp_gromnica.1002.desc_village:0 "Ludzie wrócili z osad. Ocalili dziecko, które rozmawiało z kimś niewidzialnym. Na progu leży glina ciepła mimo mrozu.\n\n„Weles wie, że tych ludzi ocaliłeś”, mówi żerca. „I zostawił ci znak”."
 bp_gromnica.1002.desc_ignored:0 "Spichlerze otwierają się same. Na ziarnie osiada czarny pył, choć zamki pozostały całe.\n\n„Na Gromnicę zamyka się drzwi”, mówi żerca. „Ty kazałeś je otworzyć”."
 bp_gromnica.1002.a:0 "Zapamiętam. Ale czego właściwie mam się bać?"
 bp_gromnica.1002.b:0 "Straże strzegą ognia. Niech teraz moi ludzie ruszą z pomocą do północnych osad."
 bp_gromnica.1002.c:0 "Ludzie są ocaleni. Zapłacę za straże, aby nie zgasł żaden ogień."
 bp_gromnica.1003.t:0 "Dwa obowiązki"
 bp_gromnica.1003.desc_village:0 "Straże nie opuszczają palenisk. Gdy posyłam pomoc ku północnym osadom, żerca podnosi z popiołu grudkę zmarzniętej ziemi. Są na niej dwa odciski: znamię płomienia i ślad drobnej dłoni.\n\n„Ogień obronił twój gród”, mówi. „A ci, których ocaliłeś poza murami, zaniosą pamięć o nim dalej. Weles nie pomyli jednego czynu z drugim”."
 bp_gromnica.1003.desc_fire:0 "Z północnych osad napływają wieści o ocalonych. Teraz rozkazuję rozniecić ognie przy wszystkich bramach i postawić straże. W ciemności dwie drogi łączą się w jedną, od zimnych domostw aż do murów grodu.\n\nŻerca przygląda się płomieniom. „Najpierw wyprowadziłeś ludzi z mrozu. Potem dopilnowałeś, by mieli dokąd powrócić. Weles pamięta oba czyny”."
 bp_gromnica.1003.desc:0 "Ognie płoną, a ludzie otrzymali pomoc. W popiele pozostają ślady płomienia i ludzkiej dłoni.\n\n„Weles pamięta”, mówi żerca, „kogo ocaliłeś i jakiej ceny nie uniknąłeś”."
 bp_gromnica.1003.a:0 "Niech ogień służy żywym. Przyjmę odpowiedzialność za oba rozkazy."
 bp_weles.2001.t:0 "Kto chodzi pod lodem?"
 bp_weles.2001.desc_fire:0 "Pod lodem rzeki słychać uderzenia. Pod dębem leżą mokre monety bez znaku żyjącego władcy.\n\n„Weles pamięta zapomnianych”, mówi żerca. „Wybierz dar: bogactwo, sławę, życie więźnia albo odmowę. Bóg zapamięta również cenę”."
 bp_weles.2001.desc_village:0 "Ocaleni mieszkańcy przynoszą sól, miód i dziecięcy but pełen mokrej ziemi.\n\n„Weles widział, że im pomogłeś”, mówi żerca. „Teraz oczekuje daru: majątku, sławy albo czyjegoś życia. Możesz też odmówić”."
 bp_weles.2001.desc_default:0 "Spod rzecznego lodu dochodzi stukot. Przy dębie znaleziono martwego ptaka z dziobem pełnym czarnej ziemi.\n\n„Weles pamięta zaniedbaną Gromnicę”, mówi żerca. „Wybierz, co mu oddasz: złoto, sławę, ludzkie życie albo nic”."
 bp_weles.2001.a:0 "Prowadź mnie do gaju. Chcę wiedzieć, czego żąda Weles."
 bp_weles.2001.b:0 "Zamknijcie święty gaj. Nie oddam bogu mojego dworu."
 bp_weles.2002.t:0 "Imię przeznaczone do oddania"
 bp_weles.2002.desc:0 "Na czarnym kamieniu leżą moneta, suchy kłos i nóż. Żerca wskazuje trzy ceny: majątek, dobre imię albo życie więźnia.\n\n„Weles zapamięta dar i odmowę. Ja nie wybiorę za ciebie”."
 bp_weles.2002.a:0 "Oddam sześćdziesiąt sztuk złota na odnalezienie bezimiennych mogił."
 bp_weles.2002.b:0 "Przyprowadzę więźnia. Najpierw sam wybiorę, kto stanie przed kamieniem."
 bp_weles.2002.c:0 "Złożę ślub milczenia o winie moich przodków, choć utracę poważanie."
 bp_weles.2002.d:0 "Nie złożę daru, którego ceny nie rozumiem."
 bp_weles.2003.t:0 "Wina pod ziemią"
 bp_weles.2003.desc:0 "Spod korzeni dębu przemawia Weles: „Twój ród odebrał człowiekowi ziemię i imię. Kto nosi pierścień jego krzywdziciela?”.\n\nSpoglądam na własną pieczęć. „Oddaj potomkom to, co zabrano. Dopiero wtedy porozmawiamy o darze”."
 bp_weles.2003.desc_kin:0 "Wciąż widzę twarz krewnego złożonego w ofierze.\n\n„Własną krew oddałeś szybko”, mówi Weles. „Ale twój ród zagarnął też cudzą ziemię. Zwróć ją potomkom skrzywdzonego. Jedna śmierć nie spłaci wszystkich win”."
 bp_weles.2003.a:0 "Odszukam potomków skrzywdzonego. Zwrócę im należność."
 bp_weles.2003.b:0 "Niech ziemia zostanie w moim ręku. Zmarli nie będą mnie sądzić."
 bp_weles.2003.c:0 "Nie umiem jeszcze tego naprawić. Proszę o czas, nie o rozgrzeszenie."
 bp_weles.2004.t:0 "Nie jestem twoją własnością"
 bp_weles.2004.desc:0 "[bp_offering_person.GetTitledFirstName] stoi przed kamieniem. „Mam własne imię”, mówi więzień. „Oddasz je razem z moim życiem?”.\n\nPochodnie milkną. Spod korzeni odzywa się Weles: „Niech władca sam odpowie”."
 bp_weles.2004.a:0 "Niech stanie się obrzęd. Biorę odpowiedzialność za tę śmierć."
 bp_weles.2004.b:0 "Odejdź od kamienia. Nie uczynię z ciebie daru."
 bp_weles.2005.t:0 "Ofiara musi mieć imię"
 bp_weles.2005.desc:0 "„Nie wybiorę więźnia za ciebie”, mówi żerca.\n\nOtwórz panel więźniów, wskaż żyjącą dorosłą postać i użyj interakcji „Przeznacz na obrzęd Welesa”. Śmierć nastąpi dopiero po potwierdzeniu. Dar można zmienić w menu Decyzje."
 bp_weles.2005.a:0 "Rozumiem. To moje imię będzie podpisem pod tym wyborem."
 bp_weles.2006.t:0 "Bogactwo spod korzeni"
 bp_weles.2006.desc:0 "Spod dębu wyłania się dawny skarbiec. Nieznajomy o twarzy, której nie umiem zapamiętać, przemawia głosem Welesa:\n\n„Zapłaciłeś ogniem, stratą i prawdą. Daję ci lata dostatku. Lecz gdy wrócę po zapłatę, nie mów, że zapomniałeś”."
 bp_weles.2006.a:0 "Przyjmuję dar. Nie będę udawać, że nie słyszałem ostatnich słów."
 bp_weles.2007.t:0 "Garść ziemi"
 bp_weles.2007.desc:0 "Pod dębem nie ukazuje się żaden władca zmarłych. Żerca już otwiera usta, by ogłosić klęskę obrzędu, gdy ze szczeliny między korzeniami wysuwa się mały, ciemny kamień.\n\nPrzy jego podstawie błyszczy żyła metalu. Weles nie dał mi wszystkiego, o co prosiłem. Dał jednak dość, bym wiedział, że usłyszał moje słowa.\n\n„Wielkie dary wymagają trzech czynów”, mówi żerca. „Nie trzech obietnic”."
 bp_weles.2007.a:0 "Zachowam ten dar i zapamiętam brakującą próbę."
 bp_weles.2008.t:0 "Głód pod drzwiami"
 bp_weles.2008.desc:0 "Świt nie przynosi ciepła. Rano odnajduję przed progiem mojej komnaty ziemię z grobu, którego nie kazałem odszukać. Na niej leży pierścień podobny do mojego, ale przecięty na pół.\n\nŻerca patrzy w popiół.\n\n„Kłamać ludziom jest łatwo”, mówi. „Welesowi trzeba umieć także powiedzieć prawdę. Ty nawet nie spróbowałeś”.\n\nW skarbcu przez następne dni zaczyna brakować monet. Klucze pozostają na miejscu."
 bp_weles.2008.a:0 "Niech to będzie ostrzeżeniem. Nie ostatnim słowem."
 bp_weles.2010.t:0 "Pierwszy wierzyciel"
 bp_weles.2010.desc:0 "Od tygodni moje dochody rosną. Wioski płacą podatki, których dawno nie potrafiły zebrać, a kupcy przynoszą srebro zza odległych granic.\n\nPewnej nocy znajduję na ławie wilgotny ślad dłoni. Nie ma obok żadnego posłańca. Ktoś położył tylko cienką gałązkę dębu i kartkę bez pieczęci.\n\n„Nie zgubiłem drogi do twojego domu”.\n\nPodpisu nie potrzebuję."
 bp_weles.2010.a:0 "Wiem, kto to zostawił. I wiem, że powróci."
 bp_spring.3001.t:0 "Ziemia otwiera dłonie"
 bp_spring.3001.desc:0 "Dziewiątego marca pierwszy raz słychać wodę w rowach. Pod mokrym śniegiem ziemia oddycha, lecz ziarno zachowane na siew jest stare i słabe.\n\nDo grodu przychodzi kobieta w prostej lnianej sukni. Jej bose stopy pozostają suche, choć przechodzi przez błoto. Nie prosi o miejsce przy stole. Bierze do ręki garść ziemi z dziedzińca.\n\n„Wasza ziemia jest głodna”, mówi. „Nie dlatego, że nic na niej nie rośnie. Dlatego, że wszystko, co zbieracie, odkładacie za zamknięte drzwi”.\n\nNikt nie zna jej imienia. Żerca jednak nie śmie na nią spojrzeć."
 bp_spring.3001.desc_blood:0 "Zima odchodzi, ale śnieg w świętym gaju jeszcze nie stopniał. Wiem, co pozostało pod korzeniami.\n\nDziewiątego marca do grodu przychodzi kobieta w lnianej sukni. Rozciera w palcach grudkę ziemi, a potem patrzy na mnie, nie na moich doradców.\n\n„Cudza krew nie uczyni pola żyznym”, mówi. „Nie jestem Welesem. Jeśli chcesz, by ta ziemia rodziła, pokaż mi, kogo zamierzasz nakarmić”.\n\nŻerca pochyla głowę. Rozpoznaje Mokosz."
 bp_spring.3001.desc_debt:0 "Pola już czernieją spod topniejącego śniegu. Wraz z odwilżą wraca jednak pamięć o dębie i o tym, co obiecano pod jego korzeniami.\n\nNa dziedziniec wchodzi kobieta w prostym lnie. Żadna straż jej nie zatrzymuje. Wyciąga ku mnie garść kiełkującego ziarna.\n\n„Weles daje to, co zachowała ziemia”, mówi. „Ja pytam, co ziemia otrzyma z powrotem”.\n\nPo jej słowach wokół kamiennej studni przebijają się pierwsze zielone źdźbła."
 bp_spring.3001.a:0 "Otworzyć spichlerze na ziarno siewne. Niech ziemia je otrzyma."
 bp_spring.3001.b:0 "Wyruszę do osad. Niech ludzie zobaczą, że nie pozostawię ich samych."
 bp_spring.3001.c:0 "Pola poczekają. Najpierw napełnię własne skarbce."
 bp_spring.3002.t:0 "Ziarno podzielone"
 bp_spring.3002.desc:0 "W osadzie przy trakcie zastaję pusty piec. Na ławie leży misa z wodą, obok niej trzy kromki czarnego chleba. Gospodyni mówi, że wystarczą na dziś dla dzieci. Sama nie jadła od wczoraj.\n\nStarszy wsi rozkłada przede mną worek z ziarnem przeznaczonym na siew. Jeśli ludzie go zjedzą, przetrwają miesiąc, ale jesienią nie zbiorą niczego. Jeśli ziarno zostanie w spichlerzu, część z nich może nie doczekać wiosny.\n\nKobieta w lnianej sukni stoi za moimi plecami. Niczego nie podpowiada."
 bp_spring.3002.a:0 "Nakarmię osadę ze swojego skarbca. Ziarno niech pozostanie na zasiew."
 bp_spring.3002.b:0 "Rozkażę możnym oddać część własnych zapasów. Zapłacę utratą poważania."
 bp_spring.3002.c:0 "Nie odejmę majątku swojej władzy, choćby wiosna miała nadejść później."
 bp_jare.4001.t:0 "Rzeka zabiera zimę"
 bp_jare.4001.desc:0 "Dwudziestego pierwszego marca ludzie niosą ku rzece Marzannę, uplecioną ze słomy i starych płócien. Dzieci śmieją się na brzegu, lecz starsi milkną, gdy ze środka nurtu wynurza się gałązka, której nikt tam nie rzucał.\n\nŻerca podnosi pochodnię. Ogień przechodzi przez słomę powoli, jakby ogarniał ją wbrew własnej woli.\n\nWśród zebranych dostrzegam kobietę w lnianej sukni. Mokosz patrzy na rzekę, nie na mnie.\n\n„Nie wystarczy utopić zimę”, mówi. „Trzeba jeszcze pozwolić żywym żyć”."
 bp_jare.4001.desc_kin:0 "Marzanna czeka na brzegu rzeki. Ludzie owijają jej słomiane ramiona czerwonym płótnem, ale nikt nie chce przypominać, kogo tej zimy oddano pod dąb.\n\nKiedy wznoszę pochodnię, na wodzie odbija się twarz krewnego, którego nie ma już wśród żywych. Mrugam. Odbicie znika.\n\nObok mnie staje kobieta w lnianej sukni. „Zima może odejść”, mówi Mokosz. „Pamięć nie odpływa tak łatwo”.\n\nZa rzeką rusza wiosenny wiatr. Wybór pozostaje mój."
 bp_jare.4001.a:0 "Oczyśćmy brzeg i pożegnajmy Marzannę. Niech ludzie wrócą do pól."
 bp_jare.4001.b:0 "Niech obrzęd stanie się wielkim świętem naszej władzy."
 bp_jare.4001.c:0 "Dość obrzędów. Rzeka popłynie także bez naszej pomocy."
 bp_jare.4002.t:0 "Oddech Matki Ziemi"
 bp_jare.4002.desc:0 "Gdy słomiana postać znika za zakolem, z rzeki unosi się mgła. Mokosz idzie przez mokrą łąkę. Pod jej stopami wyrastają rośliny, których korzeni nie było tu jeszcze wczoraj.\n\n„Trzy razy wybierałeś życie”, mówi. „Zasiew, chleb i odnowę. Nie prosisz o cud dla własnego stołu, lecz dla ziemi, która cię karmi”.\n\nDotyka wilgotnej gleby. Dalej, aż po granice mojego głównego hrabstwa, ciemna ziemia nabiera życia. Nie jest to zapowiedź. To już się dzieje.\n\n„Przez cztery lata odda ci więcej, niż dała twoim ojcom. Pamiętaj, czyja to łaska”."
 bp_jare.4002.a:0 "Otworzyć pola. Niech całe hrabstwo zobaczy dar Mokoszy."
 bp_jare.4003.t:0 "To, co niesie nurt"
 bp_jare.4003.desc:0 "Marzanna znika pod wodą. Ludzie wznoszą okrzyk, dzieci biegną za pierwszymi gałązkami niesionymi przez rzekę. Nikt nie mówi o bogach. A jednak mam wrażenie, że ktoś stoi za moimi plecami.\n\nGdy się odwracam, widzę tylko szary brzeg i długi ślad bosych stóp prowadzący ku polom.\n\nWiosna nadeszła. Nie oznacza to jeszcze, że spełniłem wszystko, czego oczekiwano."
 bp_jare.4003.desc_debt:0 "Nurt zabiera Marzannę, a pod stopami czuję już miękką, wiosenną ziemię. Zebrani świętują. Tylko ja widzę, że woda na chwilę ciemnieje pod starym dębem.\n\nZimowy dług nie został spłacony. Weles o tym pamięta.\n\nPo drugiej stronie rzeki stoi kobieta w lnianej sukni. Mokosz podnosi garść żywej ziemi i pozwala jej powoli przesypać się przez palce.\n\nBogowie nie zapomnieli. Ale żadne z nich nie mówi jeszcze, co nastąpi dalej."
 bp_jare.4003.a:0 "Nie wszystko skończyło się wraz z zimą."
 bp_book.0001.t:0 "Księga Bogów"
 bp_book.0001.desc:0 "W starych zapisach żerców nie ma jednej miary boskiej łaski. Każde bóstwo pamięta co innego.\n\nWeles: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] (od -100 do +100)\nMokosz: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] (od -100 do +100)\nPerun: [ROOT.GetCharacter.MakeScope.Var('bp_perun_favor').GetValue|0] (od -100 do +100)\n\nOrientacyjne poziomy: +60 i więcej to wielka przychylność, +20 do +59 to zainteresowanie, -19 do +19 to milczenie, poniżej -20 to niełaska. Sama liczba nie zastępuje trzech prób ani nie gwarantuje cudu.\n\nWybierz bóstwo, aby sprawdzić postępy, nagrody i zobowiązania."
 bp_book.0001.a:0 "Weles: zobacz moje próby i długi."
 bp_book.0001.b:0 "Mokosz: zobacz moje próby i ziemię."
 bp_book.0001.c:0 "Perun: zobacz stan mojej przychylności."
 bp_book.0001.d:0 "Zamknij księgę."
 bp_book.0002.t:0 "Weles: pamięć pod korzeniami"
 bp_book.0002.desc_great:0 "Weles jest świadomy twego imienia. Jego wielki dar został przyznany, a dług wobec świata podziemnego może powrócić.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nTRZY PRÓBY: spełnione.\nBłogosławieństwo: Bogactwo spod korzeni, +75% dochodów i +5 zarządzania przez 3 lata, jeśli modyfikator nadal trwa.\n\nDług i pamięć rodu mogą przetrwać samo błogosławieństwo. Sprawdź aktywne modyfikatory swojej postaci."
 bp_book.0002.desc_all:0 "Weles usłyszał trzy wykonane czyny. Jeśli wielki dar nie został jeszcze udzielony, finał opowieści wymaga domknięcia.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nPRÓBA I: Gromnica, wykonana.\nPRÓBA II: prawdziwa ofiara, wykonana.\nPRÓBA III: naprawienie dawnej winy, wykonana."
 bp_book.0002.desc_offering:0 "Weles zna cenę twojej ofiary. Nie jest to jednak ostatni warunek.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nPRÓBA I: ogień Gromnicy, zależnie od twojej decyzji.\nPRÓBA II: ofiara, wykonana.\nPRÓBA III: rozliczenie dawnej winy, jeszcze nierozstrzygnięte lub przerwane.\n\nPełny dar wymaga wszystkich trzech prób w jednym cyklu."
 bp_book.0002.desc_first:0 "Zimą utrzymałeś granicę pomiędzy ogniem żywych a ciszą umarłych. To dopiero początek.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nPRÓBA I: Gromnica, wykonana.\nPRÓBA II: ofiara, oczekuje.\nPRÓBA III: prawda o krzywdzie przodków, oczekuje.\n\nWejdź do świętego gaju podczas Tygodnia Welesa."
 bp_book.0002.desc_none:0 "Weles nie dał jeszcze znaku wielkiej łaski. Może znać twoje imię, ale nie zawarłeś z nim pełnej umowy.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nPRÓBA I: Gromnica, brak potwierdzenia.\nPRÓBA II: ofiara, brak potwierdzenia.\nPRÓBA III: prawda i wyrównanie krzywdy, brak potwierdzenia.\n\nPierwszy cykl zaczyna się 2 lutego."
 bp_book.0003.t:0 "Mokosz: ziemia, która patrzy"
 bp_book.0003.desc_great:0 "Mokosz pobłogosławiła twoją ziemię. Jej łaska działa na hrabstwo stołeczne, nie na cały świat.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nTRZY PRÓBY: spełnione.\nBłogosławieństwo: Oddech Matki Ziemi, +100% wzrostu rozwoju i +50% lokalnych podatków przez 4 lata, jeśli modyfikator nadal trwa.\n\nZajrzyj do modyfikatorów swojego hrabstwa stołecznego."
 bp_book.0003.desc_second:0 "Mokosz pamięta dwa wybory, które kosztowały cię więcej niż słowa. Pozostała jeszcze równonoc.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nPRÓBA I: zasiew i opieka nad ziemią, wykonana.\nPRÓBA II: ochrona ludzi przed głodem, wykonana.\nPRÓBA III: Jare Gody i odnowa, oczekuje."
 bp_book.0003.desc_first:0 "Mokosz przyjęła twój pierwszy czyn, lecz nie podjęła jeszcze decyzji o wielkiej łasce.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nPRÓBA I: troska o ziemię, wykonana.\nPRÓBA II: pomoc osadzie, oczekuje.\nPRÓBA III: Jare Gody, oczekuje."
 bp_book.0003.desc_none:0 "Mokosz jest blisko każdej ziemi, lecz wielką łaskę okazuje tym, którzy troszczą się o życie, a nie tylko o własny skarbiec.\n\nPrzychylność: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nPRÓBA I: Wiosenny Nowy Rok, jeszcze nieukończona.\nPRÓBA II: podział ziarna, jeszcze nieukończona.\nPRÓBA III: Jare Gody, jeszcze nieukończona."
 bp_book.0004.t:0 "Perun: cisza przed burzą"
 bp_book.0004.desc:0 "Perun: [ROOT.GetCharacter.MakeScope.Var('bp_perun_favor').GetValue|0] (od -100 do +100)\n\nTrzy próby boga gromu: rytuał pod dębem, rzeczywisty koszt przysięgi i czyn dowodzący odwagi oraz opieki nad ludźmi. Wielka łaska: +20 przewagi przy osobistym dowodzeniu, +50% obrażeń armii i +100% skuteczności rycerzy na 12 miesięcy w wojnie. Jeżeli otrzymasz błogosławieństwo podczas pokoju, możesz wezwać je później z menu Decyzje.\n\nPerun słyszy słowa, ale osądza przede wszystkim czyny."
 bp_book.back:0 "Wróć do Księgi Bogów."
 bp_test.9001.t:0 "Test: wybierz święto"
 bp_test.9001.desc:0 "Panel testowy. Uruchamiaj wydarzenia bez oczekiwania na kalendarz, wyłącznie na kopii zapisu. Testowa decyzja omija zwykłe okna czasowe i blokady."
