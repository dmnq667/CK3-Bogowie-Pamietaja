 bp_book.status_missed_019:0 "The last feast passed without a rite. Even neglect is remembered by the gods."
 bp_book.status_blessed_019:0 "The dynasty has received a great blessing at this feast in the past. Check the current ruler’s modifiers for any active bonuses."
 bp_book.status_past_019:0 "The rite has been performed in a previous season. No rite is active now."
 bp_book.status_past_declined_019:0 "The rite was refused in a previous year. The dynasty has not forgotten."
