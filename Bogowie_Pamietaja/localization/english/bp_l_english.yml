 bp_announcement.1001.t:0 "Gromnica Has Come"
 bp_announcement.1001.desc:0 "The midwinter fires are dying across the villages. Only the sacred flame beneath the oak still burns. Gromnica has begun. For seven days, the people will honor light and safeguard their homes.\n\nThe festival does not depend on your consent. What you choose to do with it will matter when Weles draws near."
 bp_announcement.1002.t:0 "The Nights of Weles Have Come"
 bp_announcement.1002.desc:0 "On the ninth day of February, something knocks against the ice from below. A priest waits beneath the roots of the oldest oak. For seven nights the boundary between the living and the dead will loosen.\n\nWeles asks no permission. His time has come, whether or not you dare enter the grove."
 bp_announcement.1003.t:0 "The Earth Awakens"
 bp_announcement.1003.desc:0 "On the ninth of March the ground begins to thaw. People return to the fields, but beneath the furrows they hear a slow breath.\n\nThe season of the Earth Mother has begun. Mokosh will judge your deeds, not merely the gifts you place on her altar."
 bp_announcement.1004.t:0 "Jare Gody Has Come"
 bp_announcement.1004.desc:0 "The river has cast off its ice. The people prepare the effigy of Marzanna, but strange symbols have appeared upon its face.\n\nThe equinox has come. Winter will pass, but the choices made beneath its shadow may live on."

 bp_test.9001.f:0 "[TEST] Gromnica announcement only"
 bp_gaik_decision:0 "Gaik / Turzyca: The Waking Grove"
 bp_gaik_decision_desc:0 "Window: 30 kwietnia - 1 maja.\n\nBetween spring green and the demand for timber. Mokosh sees how you treat the land.\n\nThe feast arrives independently. You may begin its rite voluntarily, once in this period."
 bp_gaik_decision_tooltip:0 "Begin the rite while this holiday is underway."
 bp_dziady_decision:0 "Spring Ancestors: Voices Beyond the Graves"
 bp_dziady_decision_desc:0 "Window: 2-8 maja.\n\nThe ancestors may reveal lessons for government and war.\n\nThe feast arrives independently. You may begin its rite voluntarily, once in this period."
 bp_dziady_decision_tooltip:0 "Begin the rite while this holiday is underway."
 bp_stado_decision:0 "Stado: Where Fates Entwine"
 bp_stado_decision_desc:0 "Window: 29 maja - 4 czerwca.\n\nCommunity, courtship, bonds and the temptation to rule other lives.\n\nThe feast arrives independently. You may begin its rite voluntarily, once in this period."
 bp_stado_decision_tooltip:0 "Begin the rite while this holiday is underway."
 bp_kupala_decision:0 "Kupala Night: Fire, Water and Desire"
 bp_kupala_decision_desc:0 "Window: 20-23 czerwca.\n\nA midsummer night of longing, encounters, secrets and extraordinary favor.\n\nThe feast arrives independently. You may begin its rite voluntarily, once in this period."
 bp_kupala_decision_tooltip:0 "Begin the rite while this holiday is underway."
 bp_announcement.1005.t:0 "Gaik. The Grove Awakes"
 bp_announcement.1005.desc:0 "On the thirtieth of April, green boughs should be carried into homes. Yet the old grove spoke at night. Roots stopped the woodcutters at its edge.\n\nGaik has arrived. No decree can cancel its season. You may only decide whether to enter the grove and perform the rite."
 bp_announcement.1006.t:0 "Spring Ancestors. Voices of the Dead"
 bp_announcement.1006.desc:0 "On the second of May lights appear beside the graves, though no one lit them. The elder priest says the dead have come not for food but to speak to those who inherited their lands.\n\nThe Spring Ancestors have come. Whether you listen is your choice."
 bp_announcement.1007.t:0 "Stado. The Season of Bonds"
 bp_announcement.1007.desc:0 "The last days of May carry song and laughter. People from distant villages gather. Some families prepare betrothals; others bring kin who have not spoken for years.\n\nStado has begun without your permission. What you do with those bonds will be remembered."
 bp_announcement.1008.t:0 "Kupala Night. Fire and Longing"
 bp_announcement.1008.desc:0 "On the twentieth of June fires blaze beside the rivers. A wreath floats upstream, and laughter rises from the dark. The people step away from daily rules under the summer sky.\n\nKupala Night has come. The gods witness not only ritual, but desires hidden from daylight."
 bp_gaik.5001.t:0 "Green Beneath the Axe"
 bp_gaik.5001.desc:0 "At dawn the castellan enters holding a broken axe and a fistful of soil. Iron bears the mark of fingers gripping it from within.\n\n\"We need timber for the fortifications,\" he says. \"But the grove refuses to be cut.\"\n\nBehind him the priest stands pale and silent. He claims Mokosh has awakened the roots. The castellan awaits your command."
 bp_gaik.5001.a:0 "Spare the grove. Build elsewhere."
 bp_gaik.5001.b:0 "Cut through. A fortress cannot bow to trees."
 bp_gaik.5001.c:0 "Let the villagers decide the sacred boundary."
 bp_gaik.5002.t:0 "What the Roots Protect"
 bp_gaik.5002.desc:0 "As you withdraw from the grove, the soil reveals old human bones beneath the oldest tree, with a damaged ring bearing a forgotten family mark.\n\nThe priest asks whether you will grant the dead a proper burial. \"Not for my sake,\" he adds, looking at the roots."
 bp_gaik.5002.desc_debt:0 "From the roots emerges a ring shaped like the one you saw during your encounter with Veles. Unburied bones lie beside it.\n\n\"The earth remembers your winter words,\" the priest says. \"You may yet do something with that memory.\""
 bp_gaik.5002.a:0 "Bury the dead. Find the name."
 bp_gaik.5002.b:0 "Let the tale bring me renown."
 bp_gaik.5003.t:0 "Roots Beneath the Palisade"
 bp_gaik.5003.desc:0 "The timber arrived by dusk. At night thin roots crept beneath the palisade. By morning spearheads were lodged inside them, as though the trees had learned war.\n\nMokosh did not take your timber back. She left a sign that she knows its price."
 bp_gaik.5003.a:0 "Have the watch keep an eye on the grove."
 bp_dziady.6001.t:0 "The Wise Dead Ask No Wine"
 bp_dziady.6001.desc:0 "Food is laid out beside the graves. As the first cup touches earth, a voice rises from beneath the stones: \"We did not come for supper. We came because you have forgotten how to survive.\"\n\nA dead commander and a dead steward await an answer. The priest asks whether you will honor the dead and listen."
 bp_dziady.6001.desc_blood:0 "At the first cup you hear the voice of a kinsman offered to Veles. There is no accusation. \"I remember the night in the grove. Today I carry words you cannot buy with another death.\"\n\nOther dead stand behind, waiting to be heard."
 bp_dziady.6001.a:0 "Offer gifts and hear the dead."
 bp_dziady.6001.b:0 "Sing the old songs. Honor need not be bought."
 bp_dziady.6001.c:0 "I will not take lessons from graves."
 bp_dziady.6002.t:0 "Two Lessons from the Grave"
 bp_dziady.6002.desc:0 "\"We survived because we studied hills, not enemy faces,\" says the dead commander, speaking of river crossings, guarded flanks and a retreat that saved an army.\n\n\"A realm also falls without a sword,\" replies the steward. \"Grain, measures and fair dues outlast many palisades.\"\n\nYou can carry one lesson into the living world before their voices fade."
 bp_dziady.6002.a:0 "I will remember the ways of war."
 bp_dziady.6002.b:0 "I will remember the ways of the granary and treasury."
 bp_dziady.6002.c:0 "I will remember their names. Knowledge begins there."
 bp_dziady.6003.t:0 "A Message Absent from the Books"
 bp_dziady.6003.desc_war:0 "During exercises a warrior demonstrates a new way to cross a river. You recognize it from the dead commander. The maneuver works. This was no mere dream."
 bp_dziady.6003.desc_state:0 "Your steward lays out the accounts. You find an error explained by the dead administrator during the rite. Correcting it leaves more food in the stores. Ancestral wisdom has tangible weight."
 bp_dziady.6003.desc_names:0 "Servants ask the old commander's name. You remember it. Later, when a forgotten tomb is found, the marks on the stone match the account the dead gave you."
 bp_dziady.6003.a:0 "Let the living benefit from this knowledge."
 bp_stado.7001.t:0 "Those Who Came Together"
 bp_stado.7001.desc:0 "People separated by fields, obligations and family feuds gather in a meadow. They share a jug. Singers recite betrothed names, but two hostile families refuse to join the song.\n\nThe priest asks whether the ruler will permit reconciliation or use the feast to reinforce authority."
 bp_stado.7001.a:0 "Hold a common feast. Seat them side by side."
 bp_stado.7001.b:0 "Let the elders of both families speak."
 bp_stado.7001.c:0 "The feast should serve my glory, not their quarrels."
 bp_stado.7002.t:0 "A Wreath on the Common Table"
 bp_stado.7002.desc_person:0 "In the crowd you notice [bp_stado_companion.GetFirstName]. A wreath lies between you and the conversation grows warm. Not every meeting needs a vow, yet some are worth remembering.\n\nThe elders await your return. How do you answer the unexpected gesture?"
 bp_stado.7002.desc_default:0 "The wreath travels from hand to hand. People approach one another without armed escorts. An elder says, \"Today we can mend what we broke throughout the year.\""
 bp_stado.7002.a:0 "Accept the invitation to speak."
 bp_stado.7002.b:0 "Let the community remember this day."
 bp_stado.7002.c:0 "Leave them time without my oversight."
 bp_kupala.8001.t:0 "When the River Takes the Fire"
 bp_kupala.8001.desc:0 "Bonfires blaze along the river. Faces are flushed with dance and wine. Someone carries a wreath; another leads a beloved companion into the trees. Laughter rises through the warm night.\n\nThe priest whispers: \"A fire may be spectacle or offering. The gods know the difference.\" Will you begin a rite that may alter hearts and dynasties?"
 bp_kupala.8001.a:0 "Give a costly offering and light the sacred fire."
 bp_kupala.8001.b:0 "Let every village bring its own flame."
 bp_kupala.8001.c:0 "Let this night pass without me."
 bp_kupala.8002.t:0 "When the Bonfires Die"
 bp_kupala.8002.desc_person:0 "The dance lasts far beyond the elders' expectations. By the river you meet [bp_kupala_companion.GetFirstName]. There is no talk of dowries or treaties.\n\n\"I can leave,\" you hear. \"But if you wish, I will stay until dawn.\"\n\nThere is room for desire and refusal alike. What you choose may reach court only weeks later."
 bp_kupala.8002.desc_default:0 "People leave the fires in pairs or alone. Some seek intimacy, others return to their spouses. A wreath cast into the river drifts back upstream. It is no accident. Something awaits your choice."
 bp_kupala.8002.a:0 "Stay. We both wish it."
 bp_kupala.8002.b:0 "Desire need not end in betrayal. I return to my own."
 bp_kupala.8002.c:0 "I will promise nothing tonight."
 bp_kupala.8003.t:0 "The Wreath Against the Current"
 bp_kupala.8003.desc:0 "A wreath stops in the middle of the river. Water flows past, but the flowers remain motionless. A woman's voice rises from below: \"You take and take again. What will you give those who wake tomorrow without bread?\"\n\nYou recognize Mokosh. The third trial concerns neither fire nor desire, but the lives that continue after dawn."
 bp_kupala.8003.desc_debt:0 "A wreath comes to rest against the current. A voice speaks from the water: \"Veles has your word. I ask about the living.\"\n\nMokosh has not come to erase that debt. She demands care for those who may yet see another spring."
 bp_kupala.8003.a:0 "Give stores to those in need. Let dawn bring life."
 bp_kupala.8003.b:0 "I will not empty my treasury for a voice in the river."
 bp_kupala.8003.c:0 "It is only a sign. Leave it."
 bp_kupala.8004.t:0 "Blessing of the Shortest Night"
 bp_kupala.8004.desc:0 "At dawn the sacred fire still burns although the wood is gone. Across the river stands a woman whose feet leave no marks in wet sand.\n\n\"The fire was true. The heart did not lie. The earth received its gift,\" says Mokosh. \"For a time let your life flourish as this bank flourishes.\"\n\nThree seeds fall from her hand. Each sprouts before it reaches the riverbed."
 bp_kupala.8004.a:0 "Accept the great blessing of Mokosh."
 bp_kupala.8005.t:0 "Dawn Without a Promise"
 bp_kupala.8005.desc:0 "The sun clears the forest. People return home, some alone, others holding hands. The fires go out, yet wreaths still drift upstream.\n\nNot all trials were completed. Even so, the land is briefly kinder. It is not a miracle you can demand again tomorrow."
 bp_kupala.8005.a:0 "Let this night remain in our memory."
 bp_kupala.8006.t:0 "When Summer Lost Its Scent"
 bp_kupala.8006.desc_secret:0 "Someone at court hums the song sung by the river. You recognize it at once. Few know what happened that night; others may soon ask.\n\nMokosh has not withdrawn her blessing, but even the shortest night can have long consequences."
 bp_kupala.8006.desc_default:0 "Weeks pass. The fields flourish with unusual vigor, and the people still speak of that June night in disbelief.\n\nThe gift endures. It came not from fire or pleasure alone, but from three distinct deeds."
 bp_kupala.8006.a:0 "The gods remember. So do I."
