 bp_book.0001.f:0 "About this mod and sacred festivals"
 bp_book.0001.g:0 "Chronicle of Festivals"
 bp_book.0006.t:0 "The Gods Remember: About the mod"
 bp_book.0006.desc:0 "THE GODS REMEMBER\n\nThe deities are real forces of the world. Twelve feasts arrive by the calendar, regardless of a ruler’s wishes. Their event pauses play and allows the rite to begin, be postponed within the season, or consciously refused.\n\nVeles remembers dynastic debts. Mokosh judges the fate of the land and its people, and Perun tests courage and oaths. The Book preserves divine favor, trials, debts, blessings, and the Chronicle.\n\nVersion 0.1.9 ALPHA: twelve feasts. The CK3 event artwork uses approved user-provided illustrations."
 bp_book.0007.t:0 "Chronicle of Festivals"
 bp_book.0007.desc:0 "The Chronicle remembers rites performed or neglected by your dynasty. Choose a feast to inspect its latest status.\n\nThe first four appear here, the next four on the second leaf, and Perun, Harvest, Autumn Ancestors, and Winter Solstice on the third. A complete dated journal of every earlier feast is not yet available."
 bp_book.chronicle_back:0 "Back to the Chronicle"
 bp_announcement.start:0 "I will begin the rite now."
 bp_announcement.later:0 "I will honor this festival later."
 bp_announcement.decline:0 "I will not perform the rite this year. I accept the consequences."
 bp_book.0007.a:0 "Gromnica"
 bp_book.0101.t:0 "Chronicle: Gromnica"
 bp_book.0101.desc_active:0 "Gromnica. RITE BEGUN IN THE CURRENT CYCLE.\n\nYour dynasty has begun this rite and cannot repeat it this season.\n\nDates: February 2-8."
 bp_book.0101.desc_declined:0 "Gromnica. DELIBERATE NEGLECT.\n\nThe holiday arrived, but the ruler rejected the rite. The gods remember this choice.\n\nDates: February 2-8."
 bp_book.0101.desc_announced:0 "Gromnica. FESTIVAL ANNOUNCED.\n\nThe gods proclaimed the sacred period. The rite has not yet begun. You may choose it in Decisions while the festival remains open.\n\nDates: February 2-8."
 bp_book.0101.desc_missed:0 "Gromnica. NO RITE WAS PERFORMED.\n\nThe festival arrived this cycle but has now passed. Your dynasty did not begin the rite.\n\nDates: February 2-8."
 bp_book.0101.desc_past_both:0 "Gromnica. MIXED DYNASTIC HISTORY.\n\nYour dynasty has both celebrated and deliberately neglected this festival in past years. The gods remember both choices.\n\nDates: February 2-8."
 bp_book.0101.desc_past_declined:0 "Gromnica. PAST REFUSAL RECORDED.\n\nYour dynasty once deliberately neglected this festival. Future festivals still arrive on schedule.\n\nDates: February 2-8."
 bp_book.0101.desc_past:0 "Gromnica. EARLIER CELEBRATIONS ARE RECORDED.\n\nYour dynasty has begun this rite before. Next year, the sacred period returns regardless of past choices.\n\nDates: February 2-8."
 bp_book.0101.desc_empty:0 "Gromnica. NO RECORDED CELEBRATION.\n\nThe chronicle has no confirmed rite in the history of this dynasty. The festival will still arrive at its appointed time.\n\nDates: February 2-8."
