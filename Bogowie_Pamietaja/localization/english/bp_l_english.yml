l_english:
 bp_book_decision:0 "Book of the Gods"
 bp_book_decision_desc:0 "Open the Book of Gods: divine favor, trials, blessings, the annual calendar and your dynasty chronicle."
 bp_book_decision_tooltip:0 "Check divine favor, calendar and the chronicle of rites. Free to open at any time."
 bp_gromnica_decision:0 "Gromnica: The Last Light"
 bp_gromnica_decision_desc:0 "2–8 February. Confront the sign that appeared among the festival fires."
 bp_gromnica_decision_tooltip:0 "February 2-8. Start the Gromnica rite once during its season. The festival itself occurs independently of your decision."
 bp_weles_week_decision:0 "Week of Veles: Seven Nights"
 bp_weles_week_decision_desc:0 "9–15 February. Enter the sacred grove and learn what Veles demands."
 bp_weles_week_decision_tooltip:0 "February 9-15. Start the Weles rite, at most once during this season."
 bp_spring_decision:0 "Spring New Year: Voice of the Earth"
 bp_spring_decision_desc:0 "9–14 March. Mokosh speaks through the earth, and words alone cannot deceive her."
 bp_spring_decision_tooltip:0 "March 9-14. Start the Spring New Year rite, at most once this season."
 bp_jare_decision:0 "Jare Gody: Farewell to Marzanna"
 bp_jare_decision_desc:0 "21–27 March. The equinox, fire and river. The winter leaves, but debts may remain."
 bp_jare_decision_tooltip:0 "March 21-27. Start the Jare Gody rite, at most once this season."
 bp_test_decision:0 "[TEST] Gods Remember: Start a Festival"
 bp_test_decision_desc:0 "Debug only: trigger a festival without waiting for the date."
 bp_test_decision_tooltip:0 "Use a copy of your save. Repeating events can repeat their effects."
 bp_weles_change_offering_decision:0 "Change the Offering to Veles"
 bp_weles_change_offering_decision_desc:0 "Return to the rite and choose another way to offer, or withdraw."
 bp_weles_change_offering_decision_tooltip:0 "Returns to the priest without killing or freeing anyone."
 bp_weles_designate_offering_interaction:0 "Designate for Veles' Rite"
 bp_weles_designate_offering_interaction_desc:0 "Select this adult prisoner as a possible offering. A separate confirmation follows; selection alone does not kill them."
 bp_gromnica.1001.t:0 "The Last Light"
 bp_gromnica.1001.desc:0 "Winter has taken the people by the throat. Hearths in the stronghold die one by one, though the wood is dry. A watchman leads me to a chamber where no one has lived for years.\n\nBehind the locked door, a blue fire burns without movement. Bare footprints lead away from it. Not a single guard has seen anyone leave.\n\n\"We must protect the fires,\" says the priest. \"Gromnica cannot stop what is coming, only bar its passage.\"\n\nA horn sounds from the northern village. Their trouble has already begun."
 bp_gromnica.1001.a:0 "Keep the gates ablaze. I will pay for wood and guards."
 bp_gromnica.1001.b:0 "Let my fires wait. Send men to the villages."
 bp_gromnica.1001.c:0 "Let the priest frighten fools. Open the stores."
 bp_gromnica.1002.t:0 "Tracks Beneath the Door"
 bp_gromnica.1002.desc_fire:0 "The guards kept the fire alive till dawn. In the morning, the courtyard snow lies black with soot, though no sparks fell there. A frozen clod of earth lies at my door, marked with three scratches. The priest refuses to touch it.\n\n\"He was here,\" he whispers. \"He did not enter. Not yet.\""
 bp_gromnica.1002.desc_village:0 "Our men return from the villages without two horses. They speak of a child who conversed all night with an empty corner. On my threshold lies clay bearing the marks of bare fingers. It is warm despite the frost.\n\n\"You were warned,\" the priest tells me. \"And he saw that you saved those people.\""
 bp_gromnica.1002.desc_ignored:0 "At dawn every chest in the granary springs open, though no lock is broken. Black dust covers the grain. The priest stands in the doorway.\n\n\"Gromnica is when doors are closed,\" he says quietly. \"You ordered yours opened.\""
 bp_gromnica.1002.a:0 "I will remember. But what should I fear?"
 bp_weles.2001.t:0 "Who Walks Beneath the Ice?"
 bp_weles.2001.desc_fire:0 "On the ninth of February, blows sound beneath the river ice. Under the oak where the fires of Gromnica burned lie wet silver coins from a realm no living ruler remembers.\n\n\"Veles does not come seeking warmth,\" the priest says. \"He comes for what mortals buried and ordered forgotten. If you call him, he will listen. You must then listen to him.\""
 bp_weles.2001.desc_village:0 "The people I saved bring salt and honey. With them comes a child's shoe filled with wet earth. The priest steps away.\n\n\"Veles saw you send your men. Enter the grove tonight and he will answer. You are already part of his affair.\""
 bp_weles.2001.desc_default:0 "During the night of 9 February the frozen river starts to move. A dead bird lies at the shrine; dry feathers surround a beak full of black soil.\n\n\"You neglected the fires of Gromnica,\" the priest tells me. \"You may still choose whether to enter the grove. But you cannot pretend no one is watching.\""
 bp_weles.2001.a:0 "Lead me to the grove. I want to hear Veles."
 bp_weles.2001.b:0 "Seal the grove. I will not give him my court."
 bp_weles.2002.t:0 "A Name to Be Offered"
 bp_weles.2002.desc:0 "Beneath the oak stands a black stone. The priest places three objects on it: a silver coin, a dry stalk of grain, and an empty bowl.\n\n\"Do not summon a god as if he were a tax collector,\" he warns. \"If you seek his aid, give him a reason to remember your name.\"\n\nI could sacrifice wealth, reputation, or the life of a man or woman in my power. The priest does not tell me which is right."
 bp_weles.2002.a:0 "Give sixty gold to recover forgotten graves."
 bp_weles.2002.b:0 "I shall choose an imprisoned mortal as an offering."
 bp_weles.2002.c:0 "Make a costly vow of silence over the sins of my ancestors."
 bp_weles.2002.d:0 "I refuse to offer a price I cannot understand."
 bp_weles.2003.t:0 "Guilt Beneath the Earth"
 bp_weles.2003.desc:0 "The priest expected an answer from the god. Instead the earth speaks, low and patient.\n\n\"Beyond the oak lies a man buried without his name. His land and memory were stolen. Who wears the signet of his despoiler today?\"\n\nI look at the ring I inherited. It suddenly feels heavier than iron.\n\n\"Restore his descendants' due. Then we may speak of gifts.\""
 bp_weles.2003.desc_kin:0 "The face of my sacrificed kinsman will not leave me. Veles does not ask what the offering cost.\n\n\"Your own blood you gave quickly. Yet your house has carried another man's debt for generations. Return the land your ancestors stole. Or tell me why one death should pay for all the others.\""
 bp_weles.2003.a:0 "Find the wronged descendants and repay the debt."
 bp_weles.2003.b:0 "The land stays mine. The dead shall not judge me."
 bp_weles.2003.c:0 "I cannot mend this yet. I ask for time, not forgiveness."
 bp_weles.2004.t:0 "I Am Not Your Property"
 bp_weles.2004.desc:0 "[bp_offering_person.GetTitledFirstName] stands before the stone. The priest reaches for his knife, but the prisoner looks only at me.\n\n\"I was a person all my life,\" they say. \"Today you seem to have forgotten it.\"\n\nThe torches cease to crackle. A voice comes from beneath the roots.\n\n\"Do not silence them. I want to hear the ruler's answer.\"\n\nIt is Veles. And he waits for my choice."
 bp_weles.2004.a:0 "Complete the rite. This death is my responsibility."
 bp_weles.2004.b:0 "Step away from the stone. You are no offering of mine."
 bp_weles.2005.t:0 "An Offering Needs a Name"
 bp_weles.2005.desc:0 "The priest covers the knife. \"I will not choose for you.\"\n\nOpen your prisoners list, choose a living adult prisoner and use the new character interaction \"Designate for Veles' Rite\". It also works on imprisoned adult members of your own dynasty.\n\nThis opens a second confirmation scene. The target remains alive until you explicitly confirm. You may return to the Decisions menu and choose \"Change the Offering to Veles\" instead."
 bp_weles.2005.a:0 "I understand. The choice will be mine."
 bp_weles.2006.t:0 "Treasure Beneath the Roots"
 bp_weles.2006.desc:0 "The stone splits. The earth offers rusted iron, broken bones, and coins struck before my grandfather was born. A figure emerges from beneath the oak; its face cannot be remembered.\n\n\"You paid three times,\" Veles says. \"With fire, loss, and truth. I will not make you immortal. I will give you years without poverty.\"\n\nThe ground opens to reveal a buried treasury.\n\n\"And when I return, do not ask whether you remember me. I remember.\""
 bp_weles.2006.a:0 "I accept the gift, and I heard the final words."
 bp_weles.2007.t:0 "A Handful of Earth"
 bp_weles.2007.desc:0 "No god rises from the grove. The priest is about to pronounce the rite a failure when a dark stone emerges from the soil. A metallic vein gleams along its base.\n\nVeles did not give me everything I asked. But he gave enough for me to know he heard.\n\n\"Great gifts require three acts,\" says the priest. \"Not three promises.\""
 bp_weles.2007.a:0 "I shall remember what trial remains."
 bp_weles.2008.t:0 "Hunger at the Threshold"
 bp_weles.2008.desc:0 "At dawn a clod of grave-earth lies on my threshold. Upon it is a signet like mine, cut in two.\n\n\"Lying to men is easy,\" the priest says. \"Veles demands that you tell the truth as well.\"\n\nIn the following days, coin vanishes from locked coffers."
 bp_weles.2008.a:0 "Let this be a warning, not the final word."
 bp_weles.2010.t:0 "The First Creditor"
 bp_weles.2010.desc:0 "My income has grown for weeks. Merchants bring silver beyond all expectation. One night a damp handprint appears on my table, beside a thin oak twig. A note bears no seal: \"I have not forgotten the road to your home.\"\n\nNo signature is needed."
 bp_weles.2010.a:0 "I know who left this. And I know he shall return."
 bp_spring.3001.t:0 "The Earth Opens Its Hands"
 bp_spring.3001.desc:0 "On 9 March water returns to the ditches. The soil breathes beneath melting snow, but seed stores are thin. A barefoot woman in plain linen enters the yard. Her feet remain dry despite the mud.\n\n\"Your land is hungry,\" she says. \"Not because nothing grows here. Because you keep everything it yields behind closed doors.\"\n\nThe priest dares not meet her eyes."
 bp_spring.3001.desc_blood:0 "Winter is leaving, but the snow in the sacred grove has not melted. A barefoot woman in linen comes to the hall and crumbles earth between her fingers.\n\n\"Another's blood will not make fields fertile,\" she says. \"I am not Veles. Show me whom you mean to feed.\"\n\nThe priest recognises Mokosh."
 bp_spring.3001.desc_debt:0 "The fields thaw, yet the promise made beneath the oak remains. A woman dressed in simple linen walks through the gate carrying sprouting grain.\n\n\"Veles gives what the earth has kept,\" she says. \"I ask what the earth shall receive in return.\"\n\nGreen shoots appear round the stone well."
 bp_spring.3001.a:0 "Open the stores for sowing. The earth shall have its seed."
 bp_spring.3001.b:0 "Visit the villages. Let them see I have not forsaken them."
 bp_spring.3001.c:0 "The fields can wait. My treasury comes first."
 bp_spring.3002.t:0 "Dividing the Grain"
 bp_spring.3002.desc:0 "In a village by the road a cold hearth faces a table bearing water and three slices of black bread. The woman who lives here has not eaten since yesterday.\n\nThe village elder spreads a sack of seed before me. Eat it now, and the villagers survive a month but harvest nothing in autumn. Leave it, and some may not live to see spring.\n\nThe woman in linen stands behind me without advice."
 bp_spring.3002.a:0 "Feed the village from my treasury. Save the seed for sowing."
 bp_spring.3002.b:0 "Command the nobles to share their stores, whatever it costs me."
 bp_spring.3002.c:0 "I will not spend my crown's wealth."
 bp_jare.4001.t:0 "The River Carries Winter Away"
 bp_jare.4001.desc:0 "On 21 March, the people carry Marzanna to the river, braided from straw and worn linen. Children laugh, but the elders grow quiet when a branch rises from the current without anyone throwing it.\n\nThe priest raises a torch. Across the water stands the barefoot woman.\n\n\"Drowning winter is not enough,\" Mokosh says. \"You must also allow the living to live.\""
 bp_jare.4001.desc_kin:0 "Marzanna waits on the riverbank. No one wants to speak of the kinsman I offered beneath the oak. In the water I glimpse a face I know to be dead.\n\nThe woman in linen stands beside me. \"Winter can leave,\" says Mokosh. \"Memory is not carried away so easily.\"\n\nThe choice remains mine."
 bp_jare.4001.a:0 "Cleanse the bank, farewell Marzanna, and return to the fields."
 bp_jare.4001.b:0 "Let this rite proclaim the greatness of my rule."
 bp_jare.4001.c:0 "Enough ceremonies. The river flows without us."
 bp_jare.4002.t:0 "Breath of Mother Earth"
 bp_jare.4002.desc:0 "As the straw figure disappears round the bend, mist rises. Mokosh crosses the wet meadow, green shoots appearing beneath her bare feet.\n\n\"Three times you chose life,\" she says. \"Seed, bread and renewal. You sought a gift for the land, not just your table.\"\n\nShe touches the soil, and life spreads across the county of my seat.\n\n\"For four years it shall yield more than it did for your fathers. Remember whose gift this is.\""
 bp_jare.4002.a:0 "Open the fields. Let everyone see the gift of Mokosh."
 bp_jare.4003.t:0 "What the Current Carries"
 bp_jare.4003.desc:0 "Marzanna vanishes beneath the water. The people cheer. Turning away, I see bare footprints leading from the bank into the fields. Spring has come, but not every debt is settled."
 bp_jare.4003.desc_debt:0 "The current takes Marzanna. Yet beneath the oak the river briefly turns black. My winter debt remains. Veles remembers. Across the water, Mokosh lets damp earth fall between her fingers. Neither god tells me what comes next."
 bp_jare.4003.a:0 "Not everything ended with the winter."
 bp_book.0001.t:0 "Book of the Gods"
 bp_book.0001.desc:0 "The old priests did not measure every god by the same standard. Each remembers something different.\n\nVeles: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] (-100 to +100)\nMokosh: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] (-100 to +100)\nPerun: [ROOT.GetCharacter.MakeScope.Var('bp_perun_favor').GetValue|0] (-100 to +100)\n\n+60 or above: great favour. +20 to +59: interest. -19 to +19: silence. Below -20: disfavour. The score cannot replace the three trials, nor guarantee a miracle.\n\nChoose a god for your progress, blessings and debts."
 bp_book.0001.a:0 "Veles: trials and debts."
 bp_book.0001.b:0 "Mokosh: trials and earth."
 bp_book.0001.c:0 "Perun: divine favour."
 bp_book.0001.d:0 "Close the book."
 bp_book.0002.t:0 "Veles: Memory Beneath Roots"
 bp_book.0002.desc_great:0 "Veles knows your name. A great gift has been granted and a debt may return.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nTHREE TRIALS: completed.\nTreasure Beneath Roots: +75% monthly income and +5 stewardship for three years, while the modifier lasts. The debt may outlive the blessing."
 bp_book.0002.desc_all:0 "Veles has heard three deeds.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nTRIAL I: Gromnica complete.\nTRIAL II: Offering complete.\nTRIAL III: Ancestral wrong made right."
 bp_book.0002.desc_offering:0 "Veles knows the price of your offering.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nTRIAL I: Gromnica, depending on your choice.\nTRIAL II: Offering complete.\nTRIAL III: Settle an ancestral wrong."
 bp_book.0002.desc_first:0 "You kept the border between the fire of the living and the silence of the dead.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nTRIAL I: Gromnica complete.\nTRIAL II: Offering pending.\nTRIAL III: Truth pending."
 bp_book.0002.desc_none:0 "No great blessing from Veles has been recorded yet.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_weles_favor').GetValue|0] / 100\n\nTRIAL I: Gromnica not recorded.\nTRIAL II: Offering not recorded.\nTRIAL III: Truth not recorded."
 bp_book.0003.t:0 "Mokosh: Earth That Watches"
 bp_book.0003.desc_great:0 "Mokosh blessed the earth of your capital county.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nTHREE TRIALS: complete.\nBreath of Mother Earth: +100% development growth and +50% taxes for four years, while the county modifier lasts."
 bp_book.0003.desc_second:0 "Mokosh remembers two costly choices. The equinox awaits.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nTRIAL I: Sowing complete.\nTRIAL II: Feed the people complete.\nTRIAL III: Jare Gody pending."
 bp_book.0003.desc_first:0 "Mokosh has accepted your first act.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nTRIAL I: Sowing complete.\nTRIAL II: Feed the people pending.\nTRIAL III: Jare Gody pending."
 bp_book.0003.desc_none:0 "Mokosh dwells close to every field, but her greatest favour belongs to those who care for life.\n\nFavour: [ROOT.GetCharacter.MakeScope.Var('bp_mokosh_favor').GetValue|0] / 100\n\nTRIAL I: Spring New Year pending.\nTRIAL II: Dividing the Grain pending.\nTRIAL III: Jare Gody pending."
 bp_book.0004.t:0 "Perun: Silence Before Thunder"
 bp_book.0004.desc:0 "Perun: [ROOT.GetCharacter.MakeScope.Var('bp_perun_favor').GetValue|0] (from -100 to +100)\n\nThree trials of the Thunderer: the rite beneath the oak, an actual price for the oath, and a deed proving courage and care for the people. Great blessing: +20 battle advantage when commanding personally, +50% army damage, and +100% knight effectiveness for twelve months during war. If granted in peacetime, it may be invoked later through Decisions.\n\nPerun hears words, but judges deeds."
 bp_book.back:0 "Return to the Book of the Gods."
