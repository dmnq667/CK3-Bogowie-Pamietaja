 bp_weles_restored_graves_modifier_desc:0 "Repaired graves and restitution improve stewardship of this land."
 bp_weles_barren_fields_modifier:0 "Veles' Silent Fields"
 bp_weles_barren_fields_modifier_desc:0 "Veles' displeasure suppresses income and growth."
 bp_weles_debt_shadow_modifier:0 "A Creditor's Shadow"
 bp_weles_debt_shadow_modifier_desc:0 "An unsettled debt to Veles weakens income and stewardship."
 bp_weles_public_confession_modifier:0 "The Ancestors' Truth"
 bp_weles_public_confession_modifier_desc:0 "Naming ancient wrongs brings insight, but damages political standing."

 bp_weles_reckon_debt_decision:0 "Settle the Debt to Veles"
 bp_weles_reckon_debt_decision_desc:0 "Veles has recorded an outstanding debt against this dynasty. A ruler may seek a reckoning without waiting for the next ancestral feast."
 bp_weles_reckon_debt_decision_tooltip:0 "Open the debt reckoning, once per 90 days, until the debt is settled."
 bp_weles.2013.desc_outside:0 "A priest arrives at my door carrying a book bound in black leather. He asks nothing of the season. The first page bears the name of an old ruler of my dynasty, followed by an account that was never closed.\n\n\"Veles remembers his bargain,\" the priest says. \"Your forebear could not settle it. The debt now belongs to the dynasty. Since you called for this reckoning, answer the god in your own name.\"\n\nNo wind stirs outside. Yet the branches brush against the walls, like hands against a barred door."
 bp_weles.2013.desc_outside_blood:0 "The priest places two clay bowls before me. One holds the ring of a kinsman once sacrificed by our dynasty; the other, earth from a village unjustly seized generations ago.\n\n\"Veles took the blood, but did not close the account,\" the priest says. \"The death of your kin and the wrong done to others are different debts. Choose what you will do about your forebear's bargain.\""

 bp_weles.2007.desc_debt:0 "When I ask for another gift, wet earth appears upon the offering stone. A familiar voice answers from the roots.\n\n“I shall not open a second ledger while the first remains unpaid. The wealth I gave you still has its price.”\n\nThe priest bows. I receive only a lesser favour. Veles has not forgotten."
 bp_perun_decision:0 "Perun: Under the Thunder"
 bp_perun_decision_desc:0 "The feast of Perun is held from July 20 to July 27. Thunder, vows, and a trial of courage. The festival comes regardless of the ruler. The rite can be performed only once per season."
 bp_perun_decision_tooltip:0 "Open the holiday event and choose how to perform the rite."
 bp_perun_decision_confirm:0 "Begin the Rite of Perun"
 bp_harvest_decision:0 "Harvest Feast: What the Earth Provides"
 bp_harvest_decision_desc:0 "From August 28 to September 5, the land demands an honest division of its bounty. The festival comes regardless of the ruler. The rite can be performed only once per season."
 bp_harvest_decision_tooltip:0 "Open the holiday event and choose how to perform the rite."
 bp_harvest_decision_confirm:0 "Begin the Harvest Rite"
 bp_autumn_decision:0 "Autumn Ancestors: Those Who Return"
 bp_autumn_decision_desc:0 "From October 25 to October 31 the ancestors return for memory, truth, and unpaid debts. The festival comes regardless of the ruler. The rite can be performed only once per season."
 bp_autumn_decision_tooltip:0 "Open the holiday event and choose how to perform the rite."
 bp_autumn_decision_confirm:0 "Begin the Autumn Ancestors Rite"
 bp_szczodre_decision:0 "Winter Solstice: The Light Returns"
 bp_szczodre_decision_desc:0 "A single winter solstice season lasts from December 21 to January 6. The festival comes regardless of the ruler. The rite can be performed only once per season."
 bp_szczodre_decision_tooltip:0 "Open the holiday event and choose how to perform the rite."
 bp_szczodre_decision_confirm:0 "Begin the Solstice Rite"
 bp_perun_call_storm_decision:0 "Call Upon Perun’s Blessing"
 bp_perun_call_storm_decision_desc:0 "Perun granted you strength but held it in reserve for the hour of trial. Invoke his thunder while your forces are at war. The blessing expires if unused within two years."
 bp_perun_call_storm_decision_tooltip:0 "Activate the powerful war bonus for twelve months."
 bp_perun_call_storm_decision_confirm:0 "Summon Perun’s Thunder"
 bp_announcement.1009.t:0 "Perun: Under the Thunder"
 bp_announcement.1009.desc:0 "July 20–27. Perun’s feast has come. Lightning has split the old oak above the gathering place, and the warriors await your word. The feast comes whether you approve of it or not. Begin the rite, return later, or consciously refuse."
 bp_announcement.1010.t:0 "Harvest Feast: What the Earth Provides"
 bp_announcement.1010.desc:0 "August 28 – September 5. Sheaves stand across the fields and the granaries fill. Mokosh wishes to know who will eat and who will go hungry. Begin the rite now, return before the feast ends, or abstain."
 bp_announcement.1011.t:0 "Autumn Ancestors: Those Who Return"
 bp_announcement.1011.desc:0 "October 25–31. At dusk the road to the burial mounds disappears in mist. The priest speaks the names of the ancestors, but one name finds no answer among the living. The feast comes without your permission. You choose how to face it."
 bp_announcement.1012.t:0 "Winter Solstice: The Light Returns"
 bp_announcement.1012.desc:0 "December 21 – January 6. The longest night is beginning. The settlement fires will burn whether or not their ruler takes part. The season continues across the new year, yet its rite may only be performed once."
 bp_perun.9101.t:0 "Thunder Above the Oak"
 bp_perun.9101.desc:0 "The storm came from the north though the morning sky had been clear. Charred branches lie beneath the ancient oak, and the warriors wait in silence. The priest points to spears and shields laid before the idol. “Perun hears oaths,” he says, “but remembers what was done afterward.”"
 bp_perun.9101.a:0 "I dedicate weapons and seventy gold to maintaining the watch."
 bp_perun.9101.b:0 "I pay with an oath that will cost me renown."
 bp_perun.9101.c:0 "I will make no promises beneath a storm."
 bp_perun.9102.t:0 "An Oath Without Witnesses"
 bp_perun.9102.desc_war:0 "Word comes from the camp before dusk: the enemy is advancing on your watch. The warriors look to you, for no order frees them from danger. The priest asks whether your own honor will answer for those you send toward death."
 bp_perun.9102.desc_peace:0 "There is no war today, but there are watch posts to rebuild and men who must defend them when winter ends. The priest points to the frontier. “When there is no enemy, courage can mean bearing a burden no one sees.”"
 bp_perun.9102.a:0 "I will answer for the fate of my warriors."
 bp_perun.9102.b:0 "I surrender some glory to repair the frontier watch and protect my people."
 bp_perun.9102.c:0 "Let the men face danger without me."
 bp_perun.9103.t:0 "The Man Left on the Road"
 bp_perun.9103.desc:0 "A scout returns through the rain carrying a wounded man his companions had left behind. No chronicler will record the wounded man’s name. Yet the priest watches you closely: Perun’s third trial is settled neither by words nor gifts, but by what is done for a man without standing at court."
 bp_perun.9103.a:0 "Treat him at my expense. No one will be left in the mud."
 bp_perun.9103.b:0 "Let his family receive public recompense."
 bp_perun.9103.c:0 "His fate shall serve as a warning to others."
 bp_perun.9104.t:0 "The Thunderer’s Silence"
 bp_perun.9104.desc:0 "The fire burns low beneath the oak. Gold and iron have left your treasury, an oath has been spoken, and the wounded have found care. Nothing more can be demanded by force. The storm moves across the valley, and for a moment only rain upon shields can be heard."
 bp_perun.9104.a:0 "I will hear the answer, whatever it may be."
 bp_perun.9105.t:0 "Thunder Placed in Your Hands"
 bp_perun.9105.desc_war:0 "Lightning strikes a rock behind the warriors. None falls, though each sees his own shadow cast upon the earth. A pale glow passes along the sword edges. The priest kneels. “Perun gives you an advantage, but he will carry no shield for you.”"
 bp_perun.9105.desc_peace:0 "Thunder falls from the clouds without striking a house. The priest gathers a charred splinter from the oak and places it in your hand. “Keep this sign. When war comes, summon the promised aid. Wait too long, and the memory of fire will fade.”"
 bp_perun.9105.a:0 "I accept the gift and the responsibility that follows."
 bp_perun.9106.t:0 "A Spark Instead of a Storm"
 bp_perun.9106.desc:0 "The sky has not opened for you. Wind carries embers from the sacred fire, briefly lighting the warriors’ hands. The priest does not look disappointed. “Not every oath brings lightning. Sometimes it is enough that a man keeps his word until morning.”"
 bp_perun.9106.a:0 "I shall not squander even this."
 bp_perun.9107.t:0 "Wrath Among the Clouds"
 bp_perun.9107.desc:0 "As you turn away from the fire, a crack splits the air above the camp. No spear breaks, but the men see a fissure running through the oak idol’s face. The priest averts his gaze. Perun has not taken your crown; he has left you knowing that your refusal was witnessed."
 bp_perun.9107.a:0 "I shall live with the consequences of this night."
 bp_perun.9108.t:0 "A Mark Upon the Shield"
 bp_perun.9108.desc_reserved:0 "Months have passed. The splinter taken from beneath the oak is still warm in your hand, though no fire has touched it. The priest reminds you: Perun’s gift awaits war, but it will not wait forever."
 bp_perun.9108.desc:0 "Months have passed. On one shield you find a charred crack resembling lightning. The soldiers speak of it as a sign of victory. You also remember the wounded man who was not left behind on the road."
 bp_perun.9108.a:0 "Perun remembers what no chronicle records."
 bp_harvest.9201.t:0 "The First Sheaf"
 bp_harvest.9201.desc:0 "The fields lie quiet, but sheaves stand beside the boundaries. A harvest song carries from afar, and fresh bread has been laid before the sacred post. Mokosh’s priest brings two sacks: one for the court and one for the hungry. “At harvest’s end,” he says, “we ask not how much grew, but whose hands received it.”"
 bp_harvest.9201.desc_hard:0 "The soil still bears scars from the damage done to the sacred grove. The harvest has come in smaller than expected, and the reapers returned in silence. Mokosh’s priest places the first loaf upon the table. “The goddess remembers how her earth was treated. Today she will watch how you treat her people.”"
 bp_harvest.9201.a:0 "I offer the first grain and a gift from my treasury."
 bp_harvest.9201.b:0 "I surrender a measure of splendor to fund a common feast."
 bp_harvest.9201.c:0 "The finest sheaves belong to me."
 bp_harvest.9202.t:0 "Full Granaries, Empty Bowls"
 bp_harvest.9202.desc:0 "Two queues form outside the granary. Officials with seals stand in one; barefoot villagers with empty bowls in the other. Your steward asks that the collection of dues not be disturbed. The priest says nothing and points to a sack of grain that will never reach the village beyond the forest."
 bp_harvest.9202.a:0 "Open the stores. I will cover the shortfall from my own gold."
 bp_harvest.9202.b:0 "Let the steward return the collected dues to those who paid them."
 bp_harvest.9202.c:0 "Shut the granary gates. Every measure has its price."
 bp_harvest.9203.t:0 "Seed for the Coming Spring"
 bp_harvest.9203.desc:0 "As the feast draws to a close, a peasant woman arrives asking for seed grain. Floodwater ruined her fields; without aid she will have nothing to reap next year. Your courtiers advise sending her away with a promise. You have already seen what promises made at a laden table are worth."
 bp_harvest.9203.desc_gaik:0 "The arrivals speak of the sacred grove disputed during Gaik. Its roots still hold moisture in the soil, but the fields beyond the forest flooded. A peasant woman asks for seed grain. Mokosh’s priest watches you as though he has known your answer since spring."
 bp_harvest.9203.a:0 "Give her seed now, before it is too late."
 bp_harvest.9203.b:0 "Let her receive seed from the court’s reserves."
 bp_harvest.9203.c:0 "She owns her fate. Let her bear it."
 bp_harvest.9204.t:0 "A Hand in the Soil"
 bp_harvest.9204.desc:0 "As the woman leaves, the priest kneels beside a furrow. From the damp earth he lifts a single unspoiled seed. It is not sowing season, yet a pale green shoot has emerged. No one on the square dares call it chance."
 bp_harvest.9204.a:0 "Let Mokosh herself judge our deeds."
 bp_harvest.9205.t:0 "The Earth Answers"
 bp_harvest.9205.desc:0 "Overnight, grain rises on fallow land where nothing has grown for generations. When your steward reports it, the priest shows no surprise. “The goddess counted not the loaves, but those allowed to remain at the table without bringing gold.” The gift will strengthen the land for which you are personally responsible."
 bp_harvest.9205.a:0 "May this land yield more than anyone expected."
 bp_harvest.9206.t:0 "Hollow Ears of Grain"
 bp_harvest.9206.desc:0 "After the feast your steward brings a handful of golden ears of grain. They look healthy from afar, but when split they prove empty. Mokosh’s priest lets the husks slip between his fingers. “No enemy stole this grain,” he says quietly."
 bp_harvest.9206.a:0 "A hard year shall follow these hollow ears."
 bp_harvest.9207.t:0 "A Gift Smaller Than the Promise"
 bp_harvest.9207.desc:0 "Fresh shoots appear at the edge of a field though the harvest has ended. Mokosh has not wholly refused you, but she has not opened her full granaries either. The priest points to the soil. “From this grace will grow only as much as your own hands can tend.”"
 bp_harvest.9207.a:0 "I accept what has been given."
 bp_harvest.9208.t:0 "The Second Sowing"
 bp_harvest.9208.desc:0 "One morning you find a handful of dark grain from land no one had thought fertile. The farmers ask permission to sow there. You remember the woman you did not turn away that autumn."
 bp_harvest.9208.a:0 "Let the memory of this harvest outlast winter."
 bp_autumn.9301.t:0 "The Night of Open Graves"
 bp_autumn.9301.desc:0 "Leaves cover the path between burial mounds. The priest lays bowls of food one by one and speaks the names of the ancestors. A branch snaps deeper in the forest. It sounds like footsteps, though nobody can be seen. “In spring they came with counsel,” says the priest. “In autumn they come to settle accounts.”"
 bp_autumn.9301.desc_debt:0 "Before your arrival someone has placed a red cord upon a grave, marking the unpaid debt to Veles. The priest refuses to touch it. “I did not summon the ancestors tonight. Your dynasty gave them reason to come.” A soft rustling rises along the path between the mounds."
 bp_autumn.9301.a:0 "Give the dead their due offerings and speak their names."
 bp_autumn.9301.b:0 "I surrender part of my family’s honor to remember the forgotten."
 bp_autumn.9301.c:0 "The living govern this realm, not the dead."
 bp_autumn.9302.t:0 "The Name Nobody Spoke"
 bp_autumn.9302.desc:0 "Between the fires stands a figure whose face is familiar from old paintings. No one introduces it. The figure sets an empty bowl on the earth, and every conversation falls silent. “One name was erased from the family’s story. Why?”"
 bp_autumn.9302.desc_debt:0 "A dead kinsman appears beside the fire. He asks for no food. Touching the red cord laid upon the grave, he points to the hands in which Veles left his debt. “Gifts can be counted,” he says. “A wrong must be named.”"
 bp_autumn.9302.desc_paid:0 "An ancestor appears between the trees. He lays down a broken ring, an old token of Veles’s debt, and slides it toward you. “Repayment does not restore life,” he says, “but it restores the right to be remembered.”"
 bp_autumn.9302.a:0 "I admit before my kin that silence, too, can be a crime."
 bp_autumn.9302.b:0 "Let Veles demand what we still owe him."
 bp_autumn.9302.c:0 "Burn the old records. I have heard enough accusations."
 bp_autumn.9303.t:0 "Who Will Remain at the Grave?"
 bp_autumn.9303.desc:0 "Before dawn a messenger from a nearby village arrives. One of your ancestors’ graves was opened for stone to build with. The villagers ask for a new place of remembrance. You can give labor and money, or surrender a privilege no one now wishes to hold."
 bp_autumn.9303.a:0 "I will restore the grave and reward those who guarded it."
 bp_autumn.9303.b:0 "Let my house renounce the privilege gained from this wrong."
 bp_autumn.9303.c:0 "Set up an ordinary stone. We will speak of this no more."
 bp_autumn.9304.t:0 "A Judgment No King Presides Over"
 bp_autumn.9304.desc:0 "Shadows of those named in the rite gather before the stone. One points toward the castle, another toward an empty place at the table, and the third never lifts his head. The priest steps away, leaving you alone. Veles’s answer comes without witnesses you might bribe."
 bp_autumn.9304.desc_debt:0 "Every shadow turns toward the red thread on the grave. They do not ask about your gifts. They ask about the debt your family still bears. You may take away only a fragment of ancestral knowledge while the old account remains open."
 bp_autumn.9304.a:0 "I will accept their judgment without hiding the truth."
 bp_autumn.9305.t:0 "Wisdom Beneath the Ashes"
 bp_autumn.9305.desc:0 "Beside the extinguished fire you find a wooden tablet that was not there before. One side bears the disposition of warriors in a narrow valley; the other lists ancient obligations owed by the land. The ancestors grant neither a crown nor victory. They leave knowledge that may change how you rule."
 bp_autumn.9305.a:0 "I shall keep the military wisdom and teach it to my commanders."
 bp_autumn.9305.b:0 "I shall keep the wisdom of stewardship and teach it to my officials."
 bp_autumn.9306.t:0 "A Fragment of Memory"
 bp_autumn.9306.desc:0 "On the ashes of the fire someone has traced a single mark, perhaps the first letter of a name. It is not the full favor of the ancestors, but more than any command could win. The priest asks you to preserve it in the Book of the Gods."
 bp_autumn.9306.desc_debt:0 "Among the ashes lies only a charred splinter. The priest says the ancestors have not refused everything. “Veles’s open debt obscures the greater gift. While it remains, memory speaks to you only in whispers.”"
 bp_autumn.9306.a:0 "I shall preserve even this fragment of their memory."
 bp_autumn.9306.b:0 "I must return to the matter of Veles’s debt."
 bp_autumn.9307.t:0 "Those Denied a Name"
 bp_autumn.9307.desc:0 "At night the servants complain they cannot sleep. They hear footsteps in the hall and find damp grave soil upon the thresholds. None has seen a visitor. The priest asks you to be silent. “The ancestors do not always shout. Sometimes they simply cease to depart.”"
 bp_autumn.9307.a:0 "I cannot silence every voice."
 bp_autumn.9308.t:0 "The Road Beneath the Roots"
 bp_autumn.9308.desc:0 "The grave opens by no more than a handspan. Cold air rises from the earth, carrying the scent of damp wood. It is the same sign Veles left upon your dynasty. If you wish to settle the debt, you need not wait for his next summons."
 bp_autumn.9308.a:0 "I shall follow the debt to its source."
 bp_szczodre.9401.t:0 "The Longest Night"
 bp_szczodre.9401.desc:0 "Before dusk the priest orders embers from one fire carried throughout the settlement. The last flames of the old year are extinguished in each house, and the people await the new. Smoke hangs above the snowy courtyard. “The sun will return,” says the old man, “but not everyone we wish it for will live to see dawn.”"
 bp_szczodre.9401.a:0 "I will keep the fire burning for the whole settlement."
 bp_szczodre.9401.b:0 "I entrust the honor of my house to the priest for this rite."
 bp_szczodre.9401.c:0 "No priest shall order the fires of my house extinguished."
 bp_szczodre.9402.t:0 "Twelve Places at the Table"
 bp_szczodre.9402.desc:0 "Long tables stand in the great hall beneath linen cloth. Among the guests you recognize kin, counselors, and warriors, yet places have also been laid for those who died this year. Hungry travelers wait beyond the door. Your steward asks whether to turn them away."
 bp_szczodre.9402.a:0 "Open the gates. None shall be sent away hungry tonight."
 bp_szczodre.9402.b:0 "Let the guests take seats at the expense of the court’s privileges."
 bp_szczodre.9402.c:0 "Shut the doors. This feast belongs to my house."
 bp_szczodre.9403.t:0 "The Uninvited Guest"
 bp_szczodre.9403.desc:0 "As the eldest guest raises his cup, one of the empty plates moves across the table. Laughter dies away. The elders look to you, awaiting the name of the dead for whom the place was set. You must choose what to carry from the old year into the next."
 bp_szczodre.9403.desc_debt:0 "A shadow falls across the empty place, and a red cord lies on the plate. Veles has not sat among the guests, but his debt has come to the feast. The priest speaks softly: “The light of the new year will not erase an account left unpaid in the old.”"
 bp_szczodre.9403.desc_paid:0 "Someone has placed an old broken ring at the empty place. You recognize the token of Veles’s debt that your dynasty has settled. This time no hand reaches for payment. The priest asks you to speak the names of those who will never again sit at this table."
 bp_szczodre.9403.a:0 "I shall speak their names, and the promise I have yet to fulfill."
 bp_szczodre.9403.b:0 "Veles demands repayment. I will face his debt."
 bp_szczodre.9403.c:0 "Remove the plate. I will not let the dead spoil our feast."
 bp_szczodre.9404.t:0 "A Promise at the Last Fire"
 bp_szczodre.9404.desc:0 "Snow covers the tracks in the courtyard. Children bring damp wood to the hearth, too wet to light. An elder asks for dry timber and men to repair the roofs. No one calls this a third trial. Yet you know the gods distinguish a promise spoken at table from one kept in the cold."
 bp_szczodre.9404.a:0 "I shall pay for fuel and repairs before dawn."
 bp_szczodre.9404.b:0 "I shall surrender part of the court’s splendor to shelter the people this winter."
 bp_szczodre.9404.c:0 "I have promised all I could. I shall do no more."
 bp_szczodre.9405.t:0 "The Light Returns"
 bp_szczodre.9405.desc:0 "Before dawn a narrow stripe of gold appears in the east. It spreads faster than the season should allow, illuminating one house after another. People step into the snow. The priest says only: “You opened your doors before the sky was opened.” You may direct the great blessing toward your court or the land in your care."
 bp_szczodre.9405.a:0 "Let my court’s strength to govern be renewed."
 bp_szczodre.9405.b:0 "Let the fields and settlements of my land be renewed."
 bp_szczodre.9406.t:0 "Light Through a Shutter"
 bp_szczodre.9406.desc:0 "A narrow band of morning light falls across the hall wall. No one calls it a great miracle. Yet the priest bows his head. “It is good that you kept the fire for those who follow. Not every gift must transform an entire realm.”"
 bp_szczodre.9406.desc_debt:0 "One plate remains untouched upon the table. The priest points to the red cord and says the gods have not forgotten the feast, but Veles’s debt still weighs upon the house. Greater grace must await a debt that does not vanish with the old year."
 bp_szczodre.9406.a:0 "We shall preserve even this light."
 bp_szczodre.9407.t:0 "The Cold Threshold"
 bp_szczodre.9407.desc:0 "Toward morning the hearths throughout the settlement gutter out. The guards try to relight them, but the wood merely smokes and blackens. Tracks in the snow mark the people sent away from the gate. The priest does not summon the gods again. “They have already heard the answer,” he says."
 bp_szczodre.9407.a:0 "We shall pass through winter without their great blessing."
 bp_szczodre.9408.t:0 "The First Dawn of the New Year"
 bp_szczodre.9408.desc:0 "Weeks later word arrives from your family’s lands. People rebuild homes thought lost in autumn, and the granaries are opened without orders. Some courtiers call it prudent management. You remember how the light entered the hall during the longest night, faster than it should have."
 bp_szczodre.9408.a:0 "Thus begins another year of remembrance."
