l_polish:
 bp_040_revenge.t:0 "Cena krwi powraca"
 bp_040_revenge.desc:0 "Minęły miesiące od krzywdzącego rozkazu. Ludzie, których skrzywdziłeś, zebrali stronników i grożą odwetem. Możesz zapłacić za zgodę, przeciwstawić się im osobiście lub ponieść skutki nieudanego porządku w prowincji."
 bp_040_revenge.desc_target:0 "Minęły miesiące od twojego krwawego rozkazu. Ludzie związani z pokrzywdzoną rodziną grożą, że zamordują [bp_040_revenge_target.GetTitledFirstName], człowieka z twojego dworu. Możesz wykupić ochronę, zlekceważyć ostrzeżenie lub podjąć ryzyko własnej śmierci."
 bp_040_revenge.a:0 "Zapłacę za pokój i ochronę (150 złota; koniec tej napaści)."
 bp_040_revenge.b:0 "Zlekceważę groźby (65% ryzyka śmierci dworzanina)."
 bp_040_revenge.c:0 "Sam stanę przeciw mścicielom (30% ryzyka śmierci władcy)."
 bp_040_revenge.d:0 "Rozkażę tłumienie zamieszek (straty prowincji, wzrost stresu)."
 bp_040_aftermath.t:0 "Krew rodzi następną krew"
 bp_040_aftermath.desc:0 "Od morderstwa, do którego doprowadziła dawna zemsta, upłynął niemal rok. Krewni ofiary wciąż nie pogodzili się ze stratą. Możesz wynagrodzić ich cierpienie, odpowiedzieć przemocą albo ponownie osobiście narazić życie, aby zakończyć waśń."
 bp_040_aftermath.a:0 "Wypłacę odszkodowanie (180 złota; pojednanie i ulga w stresie)."
 bp_040_aftermath.b:0 "Odpowiem represjami (+130 złota; większy postrach i wieloletni odwet)."
 bp_040_aftermath.c:0 "Sam stanę do ostatniej próby (25% ryzyka śmierci władcy)."
 bp_040_gromnica.t:0 "Gromnica — dwie osady pod śniegiem"
 bp_040_gromnica.desc:0 "W noc Gromnicy śnieżyca odcięła dwie osady od grodu. Zabrakło opału, a drogi są nieprzejezdne. Dowódca straży oznajmia, że może wyruszyć tylko jeden konwój. Musisz zdecydować, kto otrzyma pomoc i kto zapłaci za twoją decyzję."
 bp_040_gromnica.desc_compassionate:0 "W noc Gromnicy zamarzają ludzie w dwóch osadach. Wiesz, ile rodzin znalazło się w niebezpieczeństwie. Straż czeka na rozkaz: pomóc mieszkańcom kosztem skarbca czy pozostawić ich własnemu losowi. Ci, których nie ocalisz, będą pamiętani przez swoich bliskich."
 bp_040_gromnica.desc_callous:0 "Śnieżyca odcięła od grodu dwie osady. Twój zarządca widzi w katastrofie sposobność do zatrzymania zapasów i zwiększenia danin. Mieszkańcy proszą o ratunek, lecz decyzja należy wyłącznie do ciebie."
 bp_040_gromnica.a:0 "Wyślę pomoc osadom (80 złota; rozwój, łaska Mokoszy)."
 bp_040_gromnica.b:0 "Zatrzymam zapasy. Osady poniosą straty (+75 złota; niepokoje, późniejsza zemsta)."
 bp_040_gromnica.c:0 "Wzmocnię straże grodu (prestiż i wojskowa przewaga; większy stres)."
 bp_040_weles.t:0 "Siedem Nocy Welesa — cena spokoju"
 bp_040_weles.desc:0 "W czasie zimowego obrzędu żerca przekazuje ci propozycję Welesa. Bóg uwolni cię od ciężaru trosk i napełni skarbiec, lecz po kilku miesiącach osobiście upomni się o dług. Alternatywą jest wskazanie prawdziwego więźnia na ofiarę albo odmowa układu."
 bp_040_weles.desc_brave:0 "Jesteś znany z odwagi, lecz nawet ty nie możesz pokonać bezsenności ani ciężaru dawnych decyzji mieczem. Weles oferuje ukojenie i bogactwo, żądając późniejszej zapłaty. Nie ukrywa, że złamanie przysięgi może kosztować cię życie."
 bp_040_weles.desc_craven:0 "Nocą odczuwasz coraz większy lęk. Żerca przekazuje ofertę Welesa: potężna ulga od stresu i złoto teraz, lecz nieuniknione żądanie zapłaty za kilka miesięcy. Jeśli nie dotrzymasz słowa, sam bóg może cię zabić."
 bp_040_weles.a:0 "Przyjmę pakt (-100 stresu, +250 złota; późniejszy sąd Welesa)."
 bp_040_weles.b:0 "Wskażę rzeczywistego dorosłego więźnia na krwawą ofiarę."
 bp_040_weles.c:0 "Odrzucę układ. Wolę wolność od boskiego długu."
 bp_040_spring.t:0 "Wiosenny Nowy Rok — ziarno dla żywych"
 bp_040_spring.desc:0 "Po zimie w spichlerzach zostało niewiele ziarna. Wojowie żądają żywności, aby mogli ruszyć w pole, a mieszkańcy proszą o zasiew. Nie starczy dla wszystkich. Ocalenie przyszłych plonów oznacza osłabienie wojska; zbrojny pobór może sprowadzić głód."
 bp_040_spring.desc_compassionate:0 "Znasz rodziny, które utraciły zimą zapasy. Wiosną ich dzieci czekają na pierwszy siew, lecz twoi wojowie domagają się reszty ziarna. Musisz wybrać między bezpieczeństwem państwa a życiem poddanych. Mokosz zapamięta twój czyn."
 bp_040_spring.desc_callous:0 "Twoi wojowie domagają się zboża. Ziarno przeznaczone na siew można przejąć jednym rozkazem, a miejscowi nie zdołają się temu oprzeć. Dochód i siła militarna wzrosną szybko; koszty głodu spadną na prowincję."
 bp_040_spring.a:0 "Ocalę zasiew (75 złota; silny rozwój ziemi)."
 bp_040_spring.b:0 "Zabiorę ziarno dla wojska (+120 złota, siła; nieurodzaj i późniejszy sąd Mokoszy)."
 bp_040_spring.c:0 "Podzielę zapasy (mniejszy dar ziemi; utrata prestiżu)."
 bp_040_jare.t:0 "Jare Gody — pokój czy krew"
 bp_040_jare.desc:0 "Podczas wiosennego święta wybucha spór między ludźmi dwóch rodów. Dobyto broni, choć przysięgano zachować pokój. Możesz wykupić pojednanie, poprzeć przemoc albo pozwolić, by spór trwał przez następne lata."
 bp_040_jare.desc_target:0 "Przybył do ciebie [bp_040_target.GetTitledFirstName], dworzanin oskarżony o udział w napaści podczas Jarych Godów. Dowody nie są rozstrzygające, lecz część dworu żąda jego głowy. Możesz zapłacić za pokój, skazać rzeczywistą osobę albo pozostawić waśń nierozwiązaną."
 bp_040_jare.desc_brave:0 "Dwaj zwaśnieni stronnicy gotowi są walczyć w świętym miejscu. Twoi ludzie oczekują, że przerwiesz spór i przyjmiesz odpowiedzialność za wyrok. Egzekucja może budzić postrach, ale rozpocznie nową waśń."
 bp_040_jare.desc_craven:0 "Dwaj zwaśnieni stronnicy grożą rozlewem krwi. Pragniesz uniknąć otwartej konfrontacji, lecz milczenie także jest decyzją. Jeśli pozwolisz im odejść bez ugody, ich rodziny mogą wkrótce chwycić za broń."
 bp_040_jare.a:0 "Wykupię pokój rodów (90 złota; lojalność i mniejszy stres)."
 bp_040_jare.b:0 "Każę stracić [bp_040_target.GetTitledFirstName] (śmierć postaci; tyrania i zemsta)."
 bp_040_jare.c:0 "Nie będę rozstrzygać (prestiż dziś; wieloletnia waśń)."
 bp_040_gaik.t:0 "Gaik — pożar świętego gaju"
 bp_040_gaik.desc:0 "Zarządca zamierza wyciąć święty gaj, by zdobyć drewno na umocnienia. Mieszkańcy stają mu na drodze. Pierwsze chaty już płoną, a twoi ludzie chcą użyć siły. Dzisiaj możesz ocalić miejsce kultu, wzbogacić skarbiec lub osobiście ryzykować życie wśród walczących."
 bp_040_gaik.desc_compassionate:0 "Widzisz dym nad gajem i słyszysz wołanie mieszkańców. Zarządca przekonuje, że drewno wystarczy na umocnienia, ale ceną będzie krzywda ludzi i świętokradztwo. Możesz powstrzymać wyrąb, choć podważysz rozkaz własnego urzędnika."
 bp_040_gaik.desc_callous:0 "Święty gaj dostarczyłby cennego drewna, a miejscowi sprzeciwiają się wycince. Masz wybór: ochronić ich i utracić korzyści, rozbić opór albo wejść między walczących i zaryzykować własne życie."
 bp_040_gaik.a:0 "Ochronię gaj (spokój prowincji, łaska Mokoszy; prestiż -70)."
 bp_040_gaik.b:0 "Rozkażę wyrąb (+150 złota; wieloletnie szkody i zemsta)."
 bp_040_gaik.c:0 "Sam rozdzielę walczących (25% ryzyka śmierci władcy)."
 bp_040_dziady.t:0 "Dziady wiosenne — krzywda po przodkach"
 bp_040_dziady.desc:0 "Podczas obrzędu przybywają ludzie, którzy twierdzą, że twój ród odebrał ich rodzinie majątek. Przynieśli dokument i proszą o zwrot ziemi. Możesz naprawić krzywdę, zniszczyć dowody albo publicznie przyznać, że historia rodu nie była nieskazitelna."
 bp_040_dziady.desc_blood:0 "Do obrzędu Dziadów dołącza rodzina pamiętająca człowieka zabitego z twojego rozkazu. Oprócz dawnego sporu o majątek żądają prawdy o tamtej śmierci. Twoja odpowiedź zdecyduje, czy waśń wygaśnie, czy z czasem dotknie także twoich bliskich."
 bp_040_dziady.desc_compassionate:0 "Przed tobą stoją ludzie, których rodzina utraciła ziemię wskutek czynów twoich przodków. Nie odpowiadasz za ich decyzje, lecz możesz zapobiec dalszej krzywdzie. Koszt zadośćuczynienia jest wysoki, a milczenie umocni nienawiść."
 bp_040_dziady.desc_callous:0 "Potomkowie dawnych właścicieli żądają zwrotu majątku. Dokumenty mogą być prawdziwe, lecz to ty dzierżysz obecnie władzę. Możesz kupić spokój, spalić dowody albo przyjąć publiczną hańbę zamiast wydawać złoto."
 bp_040_dziady.a:0 "Zwrócę należność (125 złota; ugoda, przychylność Welesa)."
 bp_040_dziady.b:0 "Zniszczę dowody (+120 złota, postrach; późniejsza zemsta)."
 bp_040_dziady.c:0 "Wyznaję winę rodu (utrata prestiżu i dochodu; oczyszczenie)."
 bp_040_stado.t:0 "Stado — krew przy uczcie"
 bp_040_stado.desc:0 "W czasie święta wojowie dwóch stron wdają się w bójkę. Jeden człowiek leży ranny, a pozostali żądają natychmiastowego wyroku. Możesz zakończyć spór ugodą, ukarać go śmiercią albo rozwiązać go siłą, prowokując dalszą waśń."
 bp_040_stado.desc_target:0 "Podczas uczty zginął człowiek, a dworzanie oskarżają o napaść [bp_040_target.GetTitledFirstName]. Nie masz pewności, czy oskarżenie jest prawdziwe. Możesz doprowadzić do ugody albo wydać wyrok śmierci na istniejącą postać. Krewni zabitego nie przebaczą łatwo."
 bp_040_stado.desc_brave:0 "Przy świątecznym stole dobyto broni. Ranni wołają o pomoc, a wojowie czekają, czy zdołasz zakończyć krwawy spór. Szybka egzekucja uciszy jednych, lecz może wzniecić zemstę drugich."
 bp_040_stado.desc_craven:0 "W czasie uczty padają pierwsze ciosy. Najchętniej pozostawiłbyś rozstrzygnięcie innym, lecz właśnie twojej decyzji oczekują wojowie. Zwłoka może doprowadzić do kolejnych zabójstw."
 bp_040_stado.a:0 "Przerwę bójkę i ogłoszę pokój (koszt prestiżu; silniejsza lojalność)."
 bp_040_stado.b:0 "Każę stracić [bp_040_target.GetTitledFirstName] (śmierć postaci; +35 postrachu, zemsta)."
 bp_040_stado.c:0 "Pozwolę wojom rozstrzygnąć spór (80 złota; niepokoje i zemsta)."
 bp_040_kupala.t:0 "Noc Kupały — wezbrana rzeka"
 bp_040_kupala.desc:0 "Po nocnym obrzędzie rzeka występuje z brzegów. Woda zagraża osadom; straż prosi o rozkazy. Gdy na miejscu znajduje się człowiek z twojego dworu, ocalenie go może wymagać osobistego ryzyka. Możesz też nakazać ochronę zabudowań."
 bp_040_kupala.desc_target:0 "Rzeka porywa [bp_040_target.GetTitledFirstName], osobę z twojego dworu. Ludzie stoją bezradnie na brzegu. Możesz skoczyć do wody osobiście — ryzykując śmierć — albo powierzyć ratunek straży. Odmowa pomocy oznacza śmierć tej postaci."
 bp_040_kupala.desc_brave:0 "Wezbrana rzeka zagraża ludziom po obchodach Nocy Kupały. Twoja odwaga może uratować komuś życie, lecz nurt jest tak silny, że sam możesz zginąć. Nikt nie rozkaże ci wejść do wody."
 bp_040_kupala.desc_craven:0 "Nocny obrzęd przerywa nagła powódź. Ludzie wołają o pomoc. Wiesz, że wejście do nurtu może zakończyć się twoją śmiercią, dlatego rozważasz powierzenie ratunku wojom."
 bp_040_kupala.a:0 "Sam wejdę do rzeki (25% ryzyka śmierci; wielka łaska za ocalenie)."
 bp_040_kupala.b:0 "Poślę straż (50% ryzyka śmierci dworzanina)."
 bp_040_kupala.c:0 "Nie narazię nikogo. [bp_040_target.GetTitledFirstName] utonie."
 bp_040_kupala.d:0 "Zabezpieczę osady przed wodą (pomniejszy dar Mokoszy)."
 bp_040_perun.t:0 "Święto Peruna — przysięga wojów"
 bp_040_perun.desc:0 "Przed wojami odnawiasz dawną przysięgę. Dowódcy żądają, abyś osobiście podjął ryzyko, które dotąd ponosili wyłącznie żołnierze. Możesz stanąć do śmiertelnej próby, odmówić albo ukarać jednego z ludzi oskarżonych o zdradę."
 bp_040_perun.desc_target:0 "Podczas Święta Peruna przed drużyną staje [bp_040_target.GetTitledFirstName], osoba oskarżona o złamanie przysięgi. Dowody są niepełne, ale żołnierze żądają krwi. Możesz sam podjąć śmiertelną próbę, uchylić się od niej lub skazać oskarżonego."
 bp_040_perun.desc_brave:0 "Zwycięstwa uczyniły cię sławnym wojownikiem, ale dziś Perun wymaga dowodu wierności żołnierskiej przysiędze. Możesz narazić własne życie w próbie albo postawić przed sądem człowieka oskarżonego o zdradę."
 bp_040_perun.desc_craven:0 "Wojowie pamiętają, że unikałeś osobistego zagrożenia. Teraz żądają publicznego dowodu odwagi. Możesz odmówić i przyjąć gniew Peruna albo zaryzykować własne życie w śmiertelnej próbie."
 bp_040_perun.a:0 "Sam podejmę próbę Peruna (20% ryzyka śmierci; wielka siła wojenna)."
 bp_040_perun.b:0 "Odmówię. Niech walczą inni (+120 złota; gniew Peruna po kilku miesiącach)."
 bp_040_perun.c:0 "Każę stracić [bp_040_target.GetTitledFirstName] (śmierć; postrach i waśń)."
 bp_040_harvest.t:0 "Dożynki — danina z krwi"
 bp_040_harvest.desc:0 "Po grabieży wieś nie jest w stanie zapłacić daniny. Poborca żąda pozwolenia na konfiskaty, a głodni mieszkańcy grożą buntem. Możesz ulżyć prowincji, ściągnąć podatek przemocą albo obarczyć śmiercią jednego z dworzan."
 bp_040_harvest.desc_target:0 "Po nieurodzaju poborca zarzuca [bp_040_target.GetTitledFirstName] udział w rozgrabieniu zapasów. Dowody nie zostały jeszcze sprawdzone, lecz skarbiec domaga się pieniędzy. Możesz darować daninę, bezwzględnie ją ściągnąć albo wydać wyrok śmierci na oskarżoną osobę."
 bp_040_harvest.desc_compassionate:0 "Widzisz wycieńczonych ludzi, którzy nie mają nawet ziarna na następny siew. Nie zamierzasz przymykać oczu na ich krzywdę, lecz skarbiec potrzebuje dochodu. Twój wybór zaważy na losach okolicy przez kilka lat."
 bp_040_harvest.desc_callous:0 "Daninę można ściągnąć siłą. Wieś straci zapasy, lecz ty odbudujesz skarbiec. Zarządca ostrzega przed buntem. Możesz również wskazać domniemanego winnego i wymierzyć mu śmierć zamiast prowadzić dochodzenie."
 bp_040_harvest.a:0 "Daruję daninę (100 złota; silny rozwój i przychylność Mokoszy)."
 bp_040_harvest.b:0 "Ściągnę podatek zbrojnie (+180 złota; bieda i zemsta)."
 bp_040_harvest.c:0 "Każę stracić [bp_040_target.GetTitledFirstName] (+200 złota; realna śmierć i waśń)."
 bp_040_autumn.t:0 "Dziady jesienne — żywi żądają sprawiedliwości"
 bp_040_autumn.desc:0 "W czasie Dziadów do dworu przychodzi skarga rodziny, którą skrzywdził wcześniejszy rozkaz. Nie są to duchy ani tajemnicze znaki: żywi domagają się sprawiedliwości. Możesz zapłacić odszkodowanie, uciszyć świadka albo odmówić i przyjąć późniejsze skutki."
 bp_040_autumn.desc_target:0 "Podczas obrzędu [bp_040_target.GetTitledFirstName] składa przed tobą skargę dotyczącą dawnego wyroku. Dworzanin prosi o jawne dochodzenie, a krewni zabitego oczekują odpowiedzi. Możesz przyznać się do winy, nakazać śmierć świadka albo odrzucić oskarżenie."
 bp_040_autumn.desc_blood:0 "Dziady jesienne przynoszą przypomnienie zbrodni, do której doszło z twojego rozkazu. Krewni zabitego człowieka żądają zapłaty. Odmowa może rozpocząć wieloletnią zemstę; nowa egzekucja rozpali ją jeszcze bardziej."
 bp_040_autumn.desc_brave:0 "Podczas Dziadów jesiennych twoi poddani przynoszą skargę przeciw jednemu z dawnych wyroków. Nikt nie może narzucić ci odpowiedzi, ale wszyscy zobaczą, czy odważysz się przyznać do błędu."
 bp_040_autumn.desc_craven:0 "W Dziady jesienne przychodzą ludzie domagający się sprawiedliwości za dawną krzywdę. Boisz się gniewu dworu i odwetu krewnych. Musisz zdecydować, czy przyznać się do winy, czy ukryć ją za nowym rozkazem."
 bp_040_autumn.a:0 "Wynagrodzę krzywdę (100 złota; koniec sporu i łaska Welesa)."
 bp_040_autumn.b:0 "Uciszę [bp_040_target.GetTitledFirstName] wyrokiem śmierci (waśń i zemsta)."
 bp_040_autumn.c:0 "Spalę skargę i odmówię (100 złota; wieloletnie zagrożenie)."
 bp_040_szczodre.t:0 "Szczodre Gody — prawo gościny"
 bp_040_szczodre.desc:0 "Podczas zimowego święta pod bramą czekają ludzie proszący o schronienie. Ich prześladowcy oferują zapłatę za odmowę. Prawo gościny jest święte, ale ochrona przybyszów kosztuje. Możesz ich przyjąć, odrzucić lub wydać krwawy wyrok."
 bp_040_szczodre.desc_target:0 "Przybysze proszą o gościnę, a dwór oskarża [bp_040_target.GetTitledFirstName] o ich zdradzenie. Nie znasz jeszcze całej prawdy. Możesz ochronić gości, skazać oskarżonego dworzanina albo przystać na zapłatę prześladowców."
 bp_040_szczodre.desc_compassionate:0 "Zmarznięte rodziny proszą o schronienie podczas Szczodrych Godów. Wiesz, że odmowa może oznaczać dla nich nieszczęście. Musisz jednak wydać pieniądze i narazić się sąsiadom, jeśli postanowisz ich chronić."
 bp_040_szczodre.desc_callous:0 "Prześladowcy oferują złoto za odmowę gościny. Przybysze nie potrafią się obronić. Możesz zachować honor święta, przyjąć zapłatę albo zastraszyć własny dwór krwawym wyrokiem."
 bp_040_szczodre.a:0 "Udzielę ochrony (90 złota; potężna korzyść dyplomatyczna)."
 bp_040_szczodre.b:0 "Stracę [bp_040_target.GetTitledFirstName] (realna egzekucja, złoto i zemsta)."
 bp_040_szczodre.c:0 "Odmówię gościny (+70 złota; gniew i dalsza waśń)."
