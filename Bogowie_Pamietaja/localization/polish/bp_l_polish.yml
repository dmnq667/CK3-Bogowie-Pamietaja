 bp_judgement.1001.t:0 "To, czego nie strawił ogień"
 bp_judgement.1001.desc_both:0 "Wkrótce po odejściu Welesa straże znajdują w wygasłym palenisku mokrą ziemię i monetę bez znaku żyjącego władcy. Na jej brzegu widać dwa odciski: płomień i ludzką dłoń. Strzegłem ognia w grodzie, lecz nie pozostawiłem też mieszkańców północnych osad na pastwę mrozu.\n\nŻerca długo obraca monetę w palcach. „Bogowie widzieli oba rozkazy. Ogień pamięta, komu dałeś schronienie. Ziemia pamięta, czyje imię kazałeś jej przyjąć”.\n\nZa drzwiami komnaty rozlegają się kroki. Nikt nie stoi na korytarzu."
 bp_judgement.1001.desc_fire:0 "Wkrótce po odejściu Welesa znajdują w popiele strażnic mokrą ziemię i monetę bez znaku żyjącego władcy. Ogień, którego strzegłem, nie zgasł. Lecz z północnych osad wracają ludzie, którzy pytają, dlaczego najpierw ocalały bramy, a dopiero potem zaczęto liczyć żywych.\n\nŻerca podnosi monetę. „Płomień pamięta swoich strażników. Weles pamięta również tych, których przy ogniu zabrakło”.\n\nNocą słychać kroki za zamkniętymi drzwiami."
 bp_judgement.1001.desc_village:0 "Wkrótce po odejściu Welesa straże odnajdują w wygasłym palenisku monetę i grudkę ciepłej ziemi. Jest na niej ślad małej dłoni, podobny do odcisków z północnych osad, którym posłałem pomoc. Własne ognie grodu pozostały jednak słabsze, niż zalecił żerca.\n\n„Uratowałeś ludzi”, mówi. „Ziemia nie zapomni ich imion. Ale każdy ocalony próg ma swoją cenę”.\n\nZa drzwiami komnaty rozlegają się kroki, choć korytarz jest pusty."
 bp_judgement.1001.desc_ignored:0 "W palenisku, którego kazałem nie strzec, leży mokra ziemia. Wszystkie skrzynie w spichlerzu pozostają zamknięte, a jednak na ich wieku osiada czarny pył. Obok znaleziono monetę pozbawioną królewskiego znaku.\n\nŻerca nie kłania się na powitanie. „Gromnicę można było zlekceważyć. Zima nie musiała jej lekceważyć wraz z tobą”.\n\nTej nocy słychać kroki za moimi drzwiami. Nikt nie przyznaje, by je stawiał."
 bp_judgement.1001.desc_none:0 "Wkrótce po Siedmiu Nocach Welesa straże znajdują w wygasłym palenisku garść mokrej ziemi. Pośrodku spoczywa moneta, której nie widziano w żadnym skarbcu. Na jednej stronie ma znak płomienia, na drugiej imię człowieka, którego nie znam.\n\nŻerca patrzy na nią długo. „Czasem bogowie pamiętają uczynione dobro. Innym razem przede wszystkim to, czego nie uczyniono”.\n\nZa drzwiami rozlegają się kroki, lecz korytarz pozostaje pusty."
 bp_judgement.1001.a:0 "Niech żerca otworzy sąd. Odpowiem za minioną zimę."
 bp_judgement.1002.t:0 "Głos pod korzeniami"
 bp_judgement.1002.desc_lie:0 "W gaju nie ma wiatru. Spod ziemi dochodzi oddech, a potem głos. „Pytałem o skrzywdzonych. Odpowiedziałeś kłamstwem. Kamień można zasypać, lecz słowa nie pogrzebiesz tak łatwo”.\n\nŻerca odwraca wzrok. Wiem, że Weles nie pyta, czy żałuję. Pyta, czy jeszcze umiem nazwać własny czyn."
 bp_judgement.1002.desc_fled:0 "Pod świętym dębem leży kamień, na którym nie złożono daru. Weles nie ukazuje twarzy. „Odwróciłeś się, zanim usłyszałeś cenę. Nie ścigam uciekających. Pozwalam im pamiętać, przed czym uciekli”.\n\nZiemia milknie, a żerca czeka na moje słowa."
 bp_judgement.1002.desc_waiting:0 "Weles nie spogląda na mnie, lecz na puste miejsce przy kamieniu ofiarnym. „Obiecałeś przedstawić człowieka i jeszcze o jego losie nie rozstrzygnąłeś. Nie będę nazywał przysięgi spełnioną, nim poznam jej koniec”.\n\nŻerca cofa rękę od noża. Rozumiem, że czas tej próby jeszcze trwa."
 bp_judgement.1002.desc_time:0 "„Prosiłeś o czas, aby naprawić dawną krzywdę”, mówi głos spod dębu. „Nie nazwałem tego kłamstwem. Lecz czas dany człowiekowi także podlega rachunkowi”.\n\nŻerca milczy. Ziemia zachowuje imię skrzywdzonego, a sprawa pozostaje niedomknięta."
 bp_judgement.1002.desc_blood:0 "Nóż leży pod korzeniami, choć żaden z żerców go tutaj nie przynosił. Głos Welesa płynie z mokrej ziemi. „Wybrałeś cenę, którą zapłacił inny człowiek. Nie pytam, czy była łatwa. Pytam, czy odważysz się przy niej pozostać”.\n\nNa ostrzu widzę odbicie własnej twarzy."
 bp_judgement.1002.desc_mercy:0 "Spod dębu słychać słowa człowieka, któremu pozwoliłem odejść od kamienia. Weles odpowiada bez gniewu. „Mogłeś odebrać życie. Nie uczyniłeś tego. Nie każdy dar mierzy się krwią, lecz każda odmowa ma swoją cenę”.\n\nŻerca odkłada nóż. Przed nami pozostaje jedynie ziemia."
 bp_judgement.1002.desc_truth:0 "Weles przypomina imię człowieka pozbawionego ziemi przez mój ród. „Oddałeś należność tym, których skrzywdzono. Nie dlatego, że zmarli mogli ci zagrozić, lecz dlatego, że pamięć nie powinna służyć wyłącznie zwycięzcom”.\n\nŻerca mówi cicho: „Teraz możesz odpowiedzieć także za żywych”."
 bp_judgement.1002.desc_refusal:0 "„Odmówiłeś złożenia daru”, mówi Weles. „Wielu odmawia ze strachu. Ty musisz odpowiedzieć, czy odmówiłeś dlatego, że wiedziałeś, komu cena została wyznaczona”.\n\nPrzypominam sobie mieszkańców osad i płomień w grodzie. Milczenie żercy jest dłuższe niż zwykle."
 bp_judgement.1002.desc_oath:0 "Na kamieniu widnieje ślad dawnej monety. „Dałeś słowo, a wraz z nim oddałeś część swojej sławy”, mówi Weles. „To, co zostało wypowiedziane pod dębem, waży więcej niż rozkazy wydawane przy uczcie”.\n\nŻerca przyklęka. Nie wypowiada przysięgi za mnie."
 bp_judgement.1002.desc_none:0 "Głos spod korzeni przemawia bez gniewu. „Nie usłyszałem od ciebie ceny, której chciałbyś dotrzymać. Być może jeszcze się jej nauczysz. Ale dziś nie nadasz własnemu milczeniu imienia zasługi”.\n\nŻerca prosi, bym stanął przed kamieniem i wysłuchał wyroku."
 bp_judgement.1002.light:0 "Niech ogień i ocaleni przemówią za mnie."
 bp_judgement.1002.oath:0 "Nie cofnę słowa, które przyjęła ziemia."
 bp_judgement.1002.boundary:0 "Nie każda ofiara jest godziwa. Wytłumaczę mój wybór."
 bp_judgement.1002.silence:0 "Przyjmę wyrok, choć bogowie nie odpowiadają."
 bp_judgement.1002.pending:0 "Niech przysięga pozostanie otwarta do czasu rozstrzygnięcia."
 bp_judgement.1011.t:0 "Światło dla żywych"
 bp_judgement.1011.desc:0 "W gaju podnoszą się dwa słabe ogniki. Jeden rozbłyskuje jak płomień strażnic, drugi ma barwę świtu nad uratowanymi osadami. Żerca wymawia imiona tych, którym dałem schronienie. Głos spod korzeni odpowiada: „Nie wybierałeś między ogniem a człowiekiem. Zapłaciłeś za oba obowiązki i nie uciekłeś przed prawdą”.\n\nNa mojej dłoni pozostaje znak podobny do żaru pod popiołem. Nie parzy. Ma jednak przypominać o cenie każdego ocalonego życia."
 bp_judgement.1011.a:0 "Przyjmę znak i nie pozwolę zgasnąć temu światłu."
 bp_judgement.1011.b:0 "Nie potrzebuję znaku. Niech wystarczą ocaleni."
 bp_judgement.1012.t:0 "Słowo dane ziemi"
 bp_judgement.1012.desc:0 "Pod dębem rozstępuje się ziemia, lecz nie ukazuje skarbu. Weles przypomina ofiarę, wyrzeczenie lub przysięgę, za którą zapłaciłem. „Nie nazywam cię dobrym”, mówi. „Nazywam cię człowiekiem, który nie odwrócił wzroku od ceny własnego słowa”.\n\nŻerca kreśli znak w mokrej ziemi. Na chwilę nad korzeniami unosi się ciemny żar, który zdaje się czekać na moją odpowiedź."
 bp_judgement.1012.desc_debt:0 "Ziemia pod dębem drży, lecz nie otwiera skarbca. „Wziąłeś mój dar”, mówi Weles. „Uznałeś cenę, a ja uznaję twoje słowo. Ale nie sądź, że znak zdejmuje dług. Jeszcze powrócę po to, co mi się należy”.\n\nNa mokrym kamieniu pojawia się ciemny ślad ognia. Żerca nie próbuje go zetrzeć."
 bp_judgement.1012.a:0 "Przyjmuję znak. Nie wyrzeknę się ceny mojego słowa."
 bp_judgement.1012.b:0 "Niech moja przysięga wystarczy bez boskiego znamienia."
 bp_judgement.1013.t:0 "Granica ofiary"
 bp_judgement.1013.desc:0 "Pod świętym dębem nie ma przygotowanej ofiary. Weles odzywa się głosem, w którym nie słyszę ani gniewu, ani przebaczenia. „Odmówiłeś. Nie dlatego, że nie wiedziałeś, czego żądałem, lecz dlatego, że znałeś imię człowieka, który miałby za to zapłacić”.\n\nPrzywołuje mieszkańców ocalonych podczas Gromnicy. „Zachowałeś ich przy życiu. Teraz powiedz, czy potrafisz dochować również granicy własnej władzy”."
 bp_judgement.1013.a:0 "Przyjmę znak. Nie każda cena może być zapłacona cudzym życiem."
 bp_judgement.1013.b:0 "Niech mój wybór pozostanie bez znamienia."
 bp_judgement.1014.t:0 "Gdy bogowie milczą"
 bp_judgement.1014.desc:0 "Żerca wypowiada moje imię raz, potem drugi. Ziemia nie odpowiada. Wygasłe ognisko rzuca cień na kamień, chociaż nie ma już płomieni. Wiem, co pamiętają bogowie: zlekceważone ostrzeżenie, ucieczkę przed zobowiązaniem albo słowa, które miały przykryć krzywdę.\n\n„Milczenie też jest wyrokiem”, mówi żerca. „Nie zabiera ci dziś korony. Zabiera przekonanie, że nikt nie widział twoich czynów”.\n\nPrzed nami jeszcze wiosna. Wtedy pamięć powróci."
 bp_judgement.1014.a:0 "Odejdę. Niech ten sąd zostanie zapisany."
 bp_judgement.1015.t:0 "Niedopełniona cena"
 bp_judgement.1015.desc:0 "Weles nie zamyka dłoni na mojej przysiędze. Obok kamienia pozostaje puste miejsce po człowieku, którego los nie został jeszcze rozstrzygnięty, albo imię przodka czekającego na sprawiedliwość.\n\n„Nie nazwę tego zdradą”, mówi. „Nie nazwę też dotrzymanym słowem. Wróć, gdy dokonasz wyboru, którego nie da się cofnąć”.\n\nŻerca zapisuje w księdze jedynie dwie rzeczy: czas i niedopełnioną cenę."
 bp_judgement.1015.a:0 "Pozwólcie, by sprawa pozostała otwarta."
 trait_bp_gods_mark_1_v020:0 "Znak Pierwszego Ognia"
 trait_bp_gods_mark_1_v020_desc:0 "Pierwsze trwałe znamię przymierza z bogami, zdobyte w Sądzie Popiołu i Przysięgi. Pamięć o przyjętej odpowiedzialności, próbach Gromnicy i Siedmiu Nocach Welesa. Pierwszy stopień jednej rozwijanej cechy; kolejne sądy mogą ją wzmocnić."
 bp_first_court_light_modifier_v020:0 "Światło dla żywych"
 bp_first_court_oath_modifier_v020:0 "Słowo dane ziemi"
 bp_first_court_boundary_modifier_v020:0 "Granica ofiary"
 bp_test.9006.court_one:0 "[TEST] Sąd Popiołu i Przysięgi (na kopii zapisu)"

 # Court I read-only chronicle
 bp_book.0002.first_court:0 "Sąd Popiołu i Przysięgi: zapis zimy"
 bp_book.0012.t:0 "Księga Bogów: Sąd Popiołu i Przysięgi"
 bp_book.0012.desc_light:0 "Światło dla żywych. Ogień został ochroniony, ludzie ocaleni, a władca zmierzył się z żądaniami Welesa. Bogowie uznali jego czyny. Znak Pierwszego Ognia pozostanie przy postaci, a dyplomacja wzrosła na rok o 5.\n\nWiosenny sąd przypomni ten wybór. Samo zimowe wyróżnienie nie gwarantuje złota."
 bp_book.0012.desc_oath:0 "Słowo dane ziemi. Władca przyjął trudną cenę, ofiarę lub przysięgę bez wyparcia się odpowiedzialności. Otrzymał Znak Pierwszego Ognia oraz roczną łaskę: +5 intrygi i +10 naturalnego postrachu.\n\nJeżeli dług Welesa pozostaje otwarty, nie został spłacony przez ten wyrok."
 bp_book.0012.desc_boundary:0 "Granica ofiary. Władca ocalił ludzi, lecz odmówił złożenia daru, którego cena była nie do przyjęcia. Otrzymał Znak Pierwszego Ognia i +5 wiedzy na rok.\n\nBogowie zapamiętają również to, czego świadomie odmówił."
 bp_book.0012.desc_declined:0 "Zimowy sąd zakończył się możliwością przyjęcia boskiego znamienia, lecz władca sam odmówił. Nie przyjął nowej łaski ani dodatkowego rocznego bonusu. Jeśli nosił już dawniej zdobyty Znak Pierwszego Ognia, zachowuje go. Ten wybór będzie zapamiętany w rozliczeniu wiosennym."
 bp_book.0012.desc_silence:0 "Gdy bogowie milczą. Zimowy sąd nie przyniósł znamienia ani błogosławieństwa. Zaniedbanie, ucieczka lub nieprawda zostały zapisane i powrócą podczas Sądu Korzeni i Przodków."
 bp_book.0012.desc_pending:0 "Niedopełniona cena. Los więźnia lub naprawienie dawnej krzywdy pozostają nierozstrzygnięte. Sąd nie potwierdził jeszcze zasługi ani winy. Księga zachowuje pamięć o zobowiązaniu."
 bp_book.0012.desc_started:0 "Sąd został zwołany, lecz nie zapisano jeszcze jego ostatecznego rozstrzygnięcia. Nie ma przyznanej cechy ani rocznej łaski."
 bp_book.0012.desc_none:0 "Nie zachowano rozstrzygnięcia tegorocznego Sądu Popiołu i Przysięgi. Sąd odbywa się po Siedmiu Nocach Welesa. Dawniejsze wybory, których mod nie odnotował, nie są rekonstruowane."
 bp_book.0012.back:0 "Wróć do rozdziału Welesa"
 bp_book.0012.desc_last_light:0 "Ostatnie zapamiętane rozstrzygnięcie rodu: Światło dla żywych. Władca ocalił ludzi i dochował ognia. To pamięć dawnego sądu, nie nowa premia."
 bp_book.0012.desc_last_oath:0 "Ostatnie zapamiętane rozstrzygnięcie rodu: Słowo dane ziemi. Ofiara lub przysięga została przyjęta ze świadomością jej ceny. Ewentualny dług Welesa pozostaje odrębnym zobowiązaniem."
 bp_book.0012.desc_last_boundary:0 "Ostatnie zapamiętane rozstrzygnięcie rodu: Granica ofiary. Władca stanął po stronie ocalonych i odmówił niegodziwej ceny. Dawny wyrok nie gwarantuje łaski w obecnym roku."
 bp_book.0012.desc_last_declined:0 "Ostatni zapamiętany sąd rodu zakończył się odmową przyjęcia boskiego znamienia. Nie jest to świadectwo czynów obecnego władcy."
 bp_book.0012.desc_last_silence:0 "Ostatnie zapamiętane rozstrzygnięcie rodu: Gdy bogowie milczą. Dawne przewinienie nie zniknęło z księgi. Obecny rok może jednak przynieść inne czyny."
 bp_book.0012.desc_last_pending:0 "Ostatnie zapamiętane rozstrzygnięcie rodu: Niedopełniona cena. Dawna przysięga nie otrzymała jednoznacznego wyroku. Sprawdź, czy zobowiązania wobec Welesa pozostają otwarte."

 # 0.2.0 concise one-window winter judgment
 bp_judgement.1001.desc_silence_v021:0 "Żerca odnajduje w zimnym palenisku czarną monetę. „Weles pamięta kłamstwo, ucieczkę i zlekceważony ogień. Milczenie bogów także jest wyrokiem”. Nikt nie podnosi głosu. Znak nie pojawi się na mojej dłoni. Rozliczenie powróci wraz z wiosną."
 bp_judgement.1001.desc_blood_v021:0 "Na kamieniu pod dębem leży nóż. Weles nie pyta, czy ofiara była słuszna. „Przelałeś krew i wziąłeś na siebie jej cenę. Nie odwracaj wzroku”. Czuję ciężar wypowiedzianej przysięgi, a ziemia przyjmuje moje słowo."
 bp_judgement.1001.desc_oath_debt_v021:0 "Spod korzeni dębu odzywa się Weles: „Przyjąłeś mój dar i jego cenę. Znak otrzymasz, lecz dług pozostaje”. Na ziemi błyska rozgrzana moneta. Rozumiem, że łaska nie jest przebaczeniem i że rachunek jeszcze powróci."
 bp_judgement.1001.desc_oath_v021:0 "W mokrej ziemi pojawia się ślad monety. „Nie nazywam cię dobrym”, mówi Weles. „Uznaję człowieka, który poniósł cenę własnej przysięgi”. Żerca wskazuje mi znak wyrysowany u stóp dębu."
 bp_judgement.1001.desc_light_v021:0 "W popiele znajdują monetę z dwoma znakami: płomieniem i ludzką dłonią. „Strzegłeś ognia i ocaliłeś ludzi”, mówi żerca. „Weles pamięta również, że nie skłamałeś przed jego dębem”. Moneta rozgrzewa się w mojej dłoni, choć palenisko wygasło."
 bp_judgement.1001.desc_boundary_v021:0 "Pod dębem leży pusty kamień ofiarny. „Odmówiłeś ceny, którą miał zapłacić ktoś inny”, mówi Weles. „Ale nie odwróciłeś się od żywych”. Ziemia pozostaje cicha. To ja muszę zdecydować, czy przyjąć znak."
 bp_judgement.1001.desc_pending_v021:0 "Na kamieniu pozostało miejsce po niedokończonej ofierze. „Nie osądzę dziś słowa, którego nie dopełniono”, mówi Weles. Żerca zapisuje w księdze otwartą przysięgę. Na rozstrzygnięcie trzeba jeszcze poczekać."
 bp_judgement.1001.accept_light_v021:0 "Przyjmuję Znak Pierwszego Ognia (+5 dyplomacji na rok)."
 bp_judgement.1001.accept_oath_v021:0 "Przyjmuję znak i cenę przysięgi (+5 intrygi, +10 postrachu na rok)."
 bp_judgement.1001.accept_boundary_v021:0 "Przyjmuję znak, zachowując granicę ofiary (+5 wiedzy na rok)."
 bp_judgement.1001.refuse_mark_v021:0 "Nie przyjmuję znamienia. Niech wystarczą moje czyny."
 bp_judgement.1001.silence_v021:0 "Przyjmuję milczenie bogów. Zapamiętam ten wyrok."
 bp_judgement.1001.pending_v021:0 "Niech sprawa pozostanie otwarta do kolejnego rozliczenia."
