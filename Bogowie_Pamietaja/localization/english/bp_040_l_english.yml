l_english:
 bp_040_revenge.t:0 "Blood Demands Payment"
 bp_040_revenge.desc:0 "Months have passed since your harsh order. Those who suffered have gathered followers and now threaten revenge. You may pay for peace, confront them yourself or accept the consequences of unrest."
 bp_040_revenge.desc_target:0 "Months after your brutal order, the injured family's supporters threaten to murder [bp_040_revenge_target.GetTitledFirstName], a real member of your court. You may pay for protection, ignore their threat or risk your own life."
 bp_040_revenge.a:0 "Buy peace and protection (150 gold; avert the attack)."
 bp_040_revenge.b:0 "Ignore the threat (65% risk of a courtier's death)."
 bp_040_revenge.c:0 "Face the avengers personally (30% risk of the ruler's death)."
 bp_040_revenge.d:0 "Suppress the unrest (county damage and stress)."
 bp_040_aftermath.t:0 "Blood Begets Blood"
 bp_040_aftermath.desc:0 "Almost a year has passed since the murder committed in an earlier act of revenge. The victim's relatives still demand justice. You may compensate them, retaliate or risk your own life to end the feud."
 bp_040_aftermath.a:0 "Pay compensation (180 gold; reconciliation and relief)."
 bp_040_aftermath.b:0 "Retaliate (+130 gold; more dread and years of danger)."
 bp_040_aftermath.c:0 "Face the last trial (25% chance of the ruler's death)."
 bp_040_gromnica.t:0 "Gromnica — Two Villages in the Snow"
 bp_040_gromnica.desc:0 "During Gromnica a blizzard isolates two villages. They have almost no fuel, and your guards can send only one convoy. The choice is yours: rescue the villagers or preserve your resources for the fortress."
 bp_040_gromnica.desc_compassionate:0 "Families are freezing in the two villages cut off by a blizzard. You know that sending help will drain your treasury, yet abandoning them will leave lasting wounds."
 bp_040_gromnica.desc_callous:0 "A blizzard isolates two villages. Your steward sees a chance to keep their supplies and increase the taxes. The villagers ask for rescue, but the decision lies entirely with you."
 bp_040_gromnica.a:0 "Rescue the villages (80 gold; growth and Mokosh's favor)."
 bp_040_gromnica.b:0 "Keep the supplies (+75 gold; hardship and later vengeance)."
 bp_040_gromnica.c:0 "Strengthen the garrison (prestige and military strength; stress)."
 bp_040_weles.t:0 "Seven Nights of Veles — The Price of Peace"
 bp_040_weles.desc:0 "During the winter rites, a priest brings Veles's offer: relief from suffering and an overflowing treasury, in exchange for a debt the god will personally collect months from now. You may instead designate an actual prisoner for sacrifice or reject the bargain."
 bp_040_weles.desc_brave:0 "You are known for courage, but no sword can defeat sleepless nights. Veles offers wealth and freedom from stress, then promises to return for payment. Breaking the oath may cost your life."
 bp_040_weles.desc_craven:0 "Fear has robbed you of sleep. Veles offers riches and relief in exchange for an inevitable demand several months hence. If you break the oath, the god himself may kill you."
 bp_040_weles.a:0 "Accept the pact (-100 stress, +250 gold; Veles will return)."
 bp_040_weles.b:0 "Designate a real adult prisoner for sacrifice."
 bp_040_weles.c:0 "Reject the bargain. I will owe the god nothing."
 bp_040_spring.t:0 "Spring New Year — Grain for the Living"
 bp_040_spring.desc:0 "The winter left little grain. Your soldiers demand provisions, but the villagers need seed for their fields. There is not enough for everyone. Feeding the army may bring famine and the goddess's anger."
 bp_040_spring.desc_compassionate:0 "The villagers' children await spring sowing, but your warriors demand the remaining grain. Your decision will determine whether the land can recover."
 bp_040_spring.desc_callous:0 "Your warriors want grain, and the stores reserved for sowing can be seized with one order. The soldiers will be stronger; the suffering will fall on the villages."
 bp_040_spring.a:0 "Preserve the seed (75 gold; strong development)."
 bp_040_spring.b:0 "Take the grain for my soldiers (+120 gold, power; famine and Mokosh's judgment)."
 bp_040_spring.c:0 "Divide the stores (smaller boon; loss of prestige)."
 bp_040_jare.t:0 "Jare Gody — Blood Before the Sacred Fire"
 bp_040_jare.desc:0 "During the spring festival, the priest calls upon the people to abandon old feuds. Yet two clans, long divided by a dispute over land and a river crossing, meet before the sacred fire. Their armed followers draw swords, and a festival guest is gravely wounded. The elders demand your judgment before more blood is spilled. You may pay for peace, order your soldiers to subdue the attackers, or leave the feud unresolved."
 bp_040_jare.desc_target:0 "Two feuding clans' armed followers clash during Jare Gody. None of your courtiers is accused of a crime without evidence. Their elders demand a judgment."
 bp_040_jare.desc_brave:0 "The oath of peace sworn at Jare Gody is broken when two armed men draw their swords. A festival guest is wounded. Known for your courage, you are summoned before the sacred fire to give judgment. You can buy reconciliation or order a violent reckoning. If you refuse, the clans will return to their feud."
 bp_040_jare.desc_craven:0 "As the priest begins the rite, armed men from two clans start fighting. A festival guest lies wounded. You would rather avoid danger, but every witness looks to you for a verdict. Peace will cost gold, violence will bring revenge, and inaction will leave both clans free to seek blood."
 bp_040_jare.a:0 "Pay 90 gold and compel peace. (Less stress; Mokosh's favor)"
 bp_040_jare.b:0 "Order the warriors to put down the aggressors. (Spoils; dread; tyranny and revenge)"
 bp_040_jare.c:0 "Refuse to judge. (Less stress; lost prestige and a lasting feud)"
 bp_040_gaik.t:0 "Gaik — Fire in the Sacred Grove"
 bp_040_gaik.desc:0 "Your steward wishes to fell the sacred grove for fortifications. Villagers resist and the first houses are burning. You can spare the grove, profit from the timber or risk your own life among the combatants."
 bp_040_gaik.desc_compassionate:0 "Smoke rises from the grove, and villagers call for help. Your steward demands timber for the defenses. Saving the people means defying your own officer."
 bp_040_gaik.desc_callous:0 "The grove could yield valuable timber, but the villagers refuse to allow it. You may protect them, crush their resistance or intervene personally at mortal risk."
 bp_040_gaik.a:0 "Protect the grove (peace, Mokosh's favor; -70 prestige)."
 bp_040_gaik.b:0 "Order the felling (+150 gold; lasting damage and revenge)."
 bp_040_gaik.c:0 "Intervene personally (25% chance of the ruler's death)."
 bp_040_dziady.t:0 "Spring Dziady — An Ancestral Wrong"
 bp_040_dziady.desc:0 "During the rites, descendants of a family dispossessed by your ancestors come to demand their land. They bring written evidence. You can make restitution, destroy the document or publicly admit the family's guilt."
 bp_040_dziady.desc_blood:0 "The relatives of someone killed by your order join the Dziady rites. They demand the truth about that death and compensation for an older wrong. Your answer may end the feud or bring harm to your family."
 bp_040_dziady.desc_compassionate:0 "The descendants of a dispossessed family stand before you. You did not commit your ancestors' crime, but you can repair its consequences."
 bp_040_dziady.desc_callous:0 "The former owners' descendants demand restitution. Their documents may be genuine, but you now wield the power. Pay them, burn the evidence or admit the family wrong."
 bp_040_dziady.a:0 "Restore their claim (125 gold; peace and Veles's favor)."
 bp_040_dziady.b:0 "Destroy the evidence (+120 gold, dread; later revenge)."
 bp_040_dziady.c:0 "Confess the family's guilt (prestige and income lost; reconciliation)."
 bp_040_stado.t:0 "Stado — Blood at the Common Table"
 bp_040_stado.desc:0 "During Stado, two feuding kin groups join a feast of reconciliation. A warrior draws his blade and the first guests fall wounded. Their followers seize their weapons. You can separate the factions, order a bloody reckoning with the armed aggressors, or let them settle the matter. The consequences will endure for years."
 bp_040_stado.desc_target:0 "Relatives of people slain by your earlier commands arrive at the Stado feast and demand restitution. A quarrel turns violent and the first guests are wounded. You may halt the bloodshed, order the armed men cut down, or abandon the families to their feud. The past cannot be silenced."
 bp_040_stado.desc_brave:0 "Blades are drawn around the sacred table. You know that stepping between the factions requires courage, while ordering a massacre would leave another debt of blood. The elders await your decision."
 bp_040_stado.desc_craven:0 "The feast descends into violence. You long to leave the judgement to others, but the priest and elders demand your verdict. Hesitation will not end the feud."
 bp_040_stado.a:0 "Part the combatants and proclaim peace. (–100 prestige, less stress, Mokosh's favor)"
 bp_040_stado.b:0 "Order my warriors to kill the armed ringleaders. (+35 dread, spoils, tyranny and later revenge)"
 bp_040_stado.c:0 "Let the kin groups fight to the end. (+80 gold, lost prestige and a lasting feud)"
 bp_040_kupala.t:0 "Kupala Night — The River Claims Blood"
 bp_040_kupala.desc:0 "After the rites of Kupala Night, the river bursts its banks. The current sweeps people away and guards call for aid. You can risk your own life in the water, dispatch your soldiers, defend the settlements, or seize the boats and leave the villagers to their fate."
 bp_040_kupala.desc_target:0 "Your subjects remember the mercy you showed in earlier years. Families from a flooded village now kneel before your camp, pleading for rescue. Water reaches the roofs; every delay means further deaths."
 bp_040_kupala.desc_brave:0 "The Kupala fires are extinguished by the flood. You wish to rescue the people, though even a seasoned warrior may drown in this river. The choice is yours."
 bp_040_kupala.desc_craven:0 "The river swallows boats and stores. You know that attempting a rescue yourself may cost your life. You can trust your guards or remain safely ashore."
 bp_040_kupala.a:0 "Enter the river myself to rescue the drowning. (25% risk of the ruler's death; great favor if successful)"
 bp_040_kupala.b:0 "Send my guards into the flooded houses. (50% risk of failure, casualties and destruction)"
 bp_040_kupala.c:0 "Keep the boats for my own court. (+40 gold, ruined settlements and future revenge)"
 bp_040_kupala.d:0 "Order the riverbanks reinforced. (Protect villages without risking my life)"
 bp_040_perun.t:0 "Feast of Perun — The Ruler's Trial"
 bp_040_perun.desc:0 "During Perun's feast, commanders renew their vows before the priest. The warriors remember those who died following your orders and demand that you face danger yourself. You may accept a deadly trial, refuse it, or command your men to undertake it in your stead. Perun will judge deeds, not words."
 bp_040_perun.desc_target:0 "In earlier years, you refused a public trial of courage. The soldiers have not forgotten. Before Perun's altar they again demand proof that you will not send men to die merely to spare yourself."
 bp_040_perun.desc_brave:0 "Your reputation for courage carries obligations. Before the gathered warband, you can risk your life to honor the oath you demand of others. Refusal will be remembered."
 bp_040_perun.desc_craven:0 "You dread a trial that your bodyguards cannot face for you. The soldiers see your fear. If you send others into mortal danger in your place, their blood will be on your hands."
 bp_040_perun.a:0 "Face Perun's trial myself. (20% risk of death; mighty war blessing if I survive)"
 bp_040_perun.b:0 "Refuse. Let others fight. (+120 gold, lost prestige and Perun's wrath)"
 bp_040_perun.c:0 "Send my warriors on the deadly trial in my stead. (Casualties, dread, tyranny and divine wrath)"
 bp_040_harvest.t:0 "Harvest Feast — The Price of the Last Seed"
 bp_040_harvest.desc:0 "At the harvest feast stand families whose stores were lost to raids and crop failure. Tax collectors demand tribute, though the granaries hold little more than seed for spring. You can provide relief, collect by force, or order the bloody suppression of resisting villages."
 bp_040_harvest.desc_target:0 "Your subjects remember the blood shed on your orders. Now the harvest baskets are empty, and tax collectors demand the last stores. The villagers fear you will again command killings rather than hear their grievance."
 bp_040_harvest.desc_compassionate:0 "Children beg for bread, while the elders show you sacks of seed reserved for next spring. Taking it will condemn the province to another year of hunger. Yet the treasury expects payment."
 bp_040_harvest.desc_callous:0 "The collectors present their accounts: the tribute can be gathered if soldiers break resistance. The price in blood will be high, but the treasury will be replenished."
 bp_040_harvest.a:0 "Forgive the tribute and purchase seed. (–100 gold, development and Mokosh's favor)"
 bp_040_harvest.b:0 "Collect the tribute under armed escort. (+180 gold, poverty and later revenge)"
 bp_040_harvest.c:0 "Order a bloody crackdown on resisting villages. (+200 gold, deaths, tyranny and long hardship)"
 bp_040_autumn.t:0 "Autumn Dziady — The Living Demand Justice"
 bp_040_autumn.desc:0 "At Autumn Dziady, the elders read petitions from families harmed by violence and unjust sentences. The living call for judgement before their ancestors. You may compensate the victims, silence the mourners with swords, or refuse to hear their case."
 bp_040_autumn.desc_target:0 "Families of people slain on your orders come before the sacred fire. They speak the names of their dead and demand justice for your dynasty's actual deeds. You may compensate them or commit another crime against the mourners."
 bp_040_autumn.desc_blood:0 "The families have not forgotten the earlier retaliation. They now appeal to the ancestors. Another violent response will bring fresh avengers to your court."
 bp_040_autumn.desc_brave:0 "The elders demand that you hear the petitions without an armed escort. Courage now means answering for a judgement rather than drawing your sword."
 bp_040_autumn.desc_craven:0 "You fear the families demanding justice. You may buy peace, send soldiers against them, or burn their pleas; none of these acts can undo what has passed."
 bp_040_autumn.a:0 "Compensate the families and hear their grievances. (–100 gold, less stress and Veles's favor)"
 bp_040_autumn.b:0 "Order my warriors to silence the mourners by the sword. (Blood, dread, tyranny and revenge)"
 bp_040_autumn.c:0 "Burn the petitions and refuse judgement. (+100 gold, stress and a lasting feud)"
 bp_040_szczodre.t:0 "Szczodre Gody — The Sacred Law of Hospitality"
 bp_040_szczodre.desc:0 "On the longest winter night, families pursued by armed men reach your gates. They plead for food and shelter. Their enemies offer gold if you surrender the refugees. You can honor the law of hospitality, betray the guests, or shut the gates."
 bp_040_szczodre.desc_target:0 "Your people remember the shelter you gave to those in need. Now families with children stand before your gate, while their pursuers offer payment for betrayal. Your choice will reveal whether your former mercy was a principle or a passing gesture."
 bp_040_szczodre.desc_compassionate:0 "Shivering children cling to their parents' cloaks. Refusal may condemn them to death. Yet shelter will cost your treasury and may provoke the armed men who seek them."
 bp_040_szczodre.desc_callous:0 "The pursuers offer gold for the refugees. The newcomers are defenseless and will not survive the winter hunt without your protection. You may accept payment and have others spill their blood."
 bp_040_szczodre.a:0 "Give the refugees shelter and food. (–90 gold, prestige and Mokosh's favor)"
 bp_040_szczodre.b:0 "Deliver the families to their pursuers. (+150 gold, deaths, dread and revenge)"
 bp_040_szczodre.c:0 "Close the gates to both parties. (+70 gold, disgrace and anger)"
 bp_040_weles_judgement.desc_bargain:0 "Months have passed since Veles lifted your burden of stress and granted you two hundred and fifty gold. Now the towering god appears in person to collect the agreed price. He demands four hundred gold and a public acknowledgement of the debt. You may endure five years of punishment instead. If you defy him openly, you risk death (35%)."
 bp_040_jare.desc_blood:0 "Relatives of people who died as a consequence of your past orders have come to Jare Gody. Before the sacred fire, they demand restitution. Your warriors attempt to disperse them, and blood is spilled. The priest recalls that this festival was meant to end feuds, not kindle new ones. You can make amends, order further violence, or leave the victims' kin to pursue vengeance."
 bp_040_jare.desc_mercy:0 "Two feuding clans meet before the ritual fire. One of their armed men wounds a festival guest, and the crowd demands revenge. The elders remind everyone that you have previously chosen mercy over the sword. Your people expect you to do so again. You may purchase peace, use force, or refuse judgment and let the avengers decide."
