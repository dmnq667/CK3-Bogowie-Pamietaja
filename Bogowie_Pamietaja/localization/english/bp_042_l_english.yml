l_english:
 message_filter_bp_042_events_pause:0 "Wrath and Grace of the Gods — Pause Time"
 message_filter_bp_042_events_pause_desc:0 "Ritual festivals, encounters with gods and trial outcomes. These pause the game by default."
 bp_042_pause_rite.t:0 "A Slavic Holy Day Has Arrived"
 bp_042_pause_rite.desc:0 "Time pauses so you may learn about the ceremony."
 bp_042_pause_story.t:0 "The Feast Demands Judgment"
 bp_042_pause_story.desc:0 "The fate of people and rulers depends on your decision. Time pauses."
 bp_042_pause_divine.t:0 "The Gods Have Come to Collect"
 bp_042_pause_divine.desc:0 "A judgment demands your attention. Time pauses."
 bp_042_result_generic_good.t:0 "The Trial Has Been Resolved"
 bp_042_result_generic_bad.t:0 "The Trial Ends in Misfortune"
 bp_042_gaik_dead.t:0 "Death in the Sacred Grove"
 bp_042_gaik_dead.desc:0 "The ruler entered the fighting but suffered a fatal blow. The realm now passes to the successor."
 bp_042_gaik_survived.t:0 "The Ruler Survives the Grove"
 bp_042_gaik_survived.desc:0 "You stopped the bloodshed and returned alive. Your courage strengthens your soldiers for two years."
 bp_042_kupala_dead.t:0 "The River Takes the Ruler"
 bp_042_kupala_dead.desc:0 "The flooded river swept you away. Your attempt at rescue ends in death, and your successor inherits the realm."
 bp_042_kupala_survived.t:0 "Saved from Kupala's Waters"
 bp_042_kupala_survived.desc:0 "You rescued a drowning courtier and returned to shore alive. Mokosh grants you a blessing for two years."
 bp_042_kupala_guard_failed.t:0 "A Rescue Fails on Kupala Night"
 bp_042_kupala_guard_failed.desc:0 "Your guards could not save a member of your court. The courtier drowned and you must live with the decision."
 bp_042_kupala_guard_saved.t:0 "The Guards Save the Courtier"
 bp_042_kupala_guard_saved.desc:0 "Your followers pulled the drowning courtier from the river. You gain prestige, and the community remembers."
 bp_042_perun_trial_dead.t:0 "Death Under Perun's Thunder"
 bp_042_perun_trial_dead.desc:0 "You did not survive the martial trial. The warriors will remember your courage, but your successor takes the crown."
 bp_042_perun_trial_survived.t:0 "Perun's Trial Survived"
 bp_042_perun_trial_survived.desc:0 "You endured the ordeal and upheld your oath. Perun grants you mighty martial strength for two years."
 bp_042_revenge_dead.t:0 "The Avengers Murder the Ruler"
 bp_042_revenge_dead.desc:0 "You faced the avengers but died in an ambush. Your dynasty inherits the realm and the memory of your blood."
 bp_042_revenge_survived.t:0 "The Avengers Are Repelled"
 bp_042_revenge_survived.desc:0 "You survived the confrontation. Your ruthlessness inspires dread, and your warband fights better for three years."
 bp_042_aftermath_dead.t:0 "The Final Judgment of a Blood Feud"
 bp_042_aftermath_dead.desc:0 "The attempt to end a long feud cost you your life. Your successor inherits a realm marked by old crimes."
 bp_042_aftermath_survived.t:0 "The Blood Feud Is Settled"
 bp_042_aftermath_survived.desc:0 "You survived the final challenge and secured reconciliation. You gain prestige and four years of improved diplomacy."
 bp_042_perun_wrath_dead.t:0 "The Wrath of Perun Is Complete"
 bp_042_perun_wrath_dead.desc:0 "You defied the storm god, and his judgment ended your life. Your dynasty will remember the defeat."
 bp_042_perun_wrath_survived.t:0 "Perun Spares You, Not Your Guilt"
 bp_042_perun_wrath_survived.desc:0 "You live, but five years of Perun's disfavor await you. Your prestige, peace and martial strength diminish."
 bp_042_weles_wrath_dead.t:0 "Veles Collects His Due"
 bp_042_weles_wrath_dead.desc:0 "You rejected Veles's demand. The lord of the underworld claimed your life and left the debt in your dynasty's memory."
 bp_042_weles_wrath_survived.t:0 "Veles Leaves You Alive"
 bp_042_weles_wrath_survived.desc:0 "The god does not kill you, but his terrible curse weighs upon you for five years. You suffer major stress and lost prestige."
