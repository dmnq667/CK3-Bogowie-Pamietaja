 bp_calendar_already_celebrated_tt:0 "To święto rozpoczęto już w bieżącym okresie. Kolejna możliwość pojawi się w przyszłym roku."
 bp_book.0001.e:0 "Sprawdź kalendarz obrzędów"
 bp_book.0005.t:0 "Kalendarz świąt | Bogowie pamiętają"
 bp_book.0005.desc:0 "KALENDARZ OBRZĘDÓW\n\nGROMNICA: 2–8 lutego\nTYDZIEŃ WELESA: 9–15 lutego\nWIOSENNY NOWY ROK: 9–14 marca\nJARE GODY: 21–27 marca\nGAIK / TURZYCA: 30 kwietnia – 1 maja\nDZIADY WIOSENNE: 2–8 maja\nSTADO: 29 maja – 4 czerwca\nNOC KUPAŁY: 20–23 czerwca\nŚWIĘTO PERUNA: 20–27 lipca\nŚWIĘTO PLONÓW: 28 sierpnia – 5 września\nDZIADY JESIENNE: 25–31 października\nSZCZODRE GODY: 21 grudnia – 6 stycznia\n\nŚwięta nadejdą niezależnie od władcy. W ich okresie decydujesz, czy odprawić obrzęd. Każdy może być odprawiony tylko raz na okres, także gdy przechodzi przez Nowy Rok. Zapis zdarzeń znajduje się w trzech kartach Kroniki Świąt."
